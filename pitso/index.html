<style>
/* ===========================================================================
   PITSO — design system "Assembly"
   A village noticeboard: civic, open, warm, plainspoken, generous with space.
   Items separated by rules, not boxed into a grid of tiles.
   =========================================================================== */
:root{
  --paper:#FBF7EF; --paper2:#F3EDE1;
  --ink:#1C1917; --ink2:#57534E;
  /* --ink3 was #8A8378, which measures 3.51:1 on the paper and 3.22:1 on
     paper2 — under the 4.5:1 floor everywhere it was used as text (field
     labels, the footer, 'not taking work now'). Darkened to 5.08 / 4.66.
     It is still visibly the quietest of the three inks. */
  --ink3:#6F6961;
  --green:#14532D; --green2:#166534;
  --clay:#B45309; --line:#DDD5C4;
  --serif:'Source Serif 4', Georgia, 'Times New Roman', serif;
  --sans:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  /* The shared strip (core/ui.js) is one component in a shadow root and can be
     reached only through these four. Same values tools/deploy.py injects. */
  --mend-bar-bg:#14532D; --mend-bar-fg:#FBF7EF;
  --mend-bar-accent:#B45309; --mend-bar-line:rgba(251,247,239,.22);
}
*,*::before,*::after{box-sizing:border-box}
/* A visible focus ring on EVERYTHING focusable. Nothing in this page drew
   one, so the first Tab press left the reader with no idea where they were.
   :focus rather than only :focus-visible — a ring a mouse user also sees is
   a smaller cost than a keyboard user seeing none. */
:focus{outline:3px solid var(--clay); outline-offset:2px}
:focus-visible{outline:3px solid var(--clay); outline-offset:2px}
@media (forced-colors:active){:focus,:focus-visible{outline:3px solid Highlight}}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.55;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,h4{font-family:var(--serif); font-weight:600; line-height:1.22; margin:0; letter-spacing:-.005em}
p{margin:0 0 .8rem}
a{color:var(--green2)}
img{max-width:100%}
.wrap{width:100%; max-width:820px; margin:0 auto; padding:0 18px}
.muted{color:var(--ink3)}
.sec{color:var(--ink2)}
.small{font-size:.8125rem}
.tiny{font-size:.75rem}
.break{overflow-wrap:anywhere; word-break:break-word}

/* ---- masthead ---------------------------------------------------------- */
header.mast{background:var(--green); color:#F6F2E8; padding:22px 0 18px}
.mast h1{font-size:2rem; font-weight:700; color:#fff; letter-spacing:-.02em}
.mast .said{font-family:var(--serif); font-size:1rem; color:#CFE3D5; margin-top:4px}
.mast .who{
  margin-top:16px; padding-top:14px; border-top:2px solid rgba(255,255,255,.18);
  display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center;
}
.mast .who label{font-size:.75rem; text-transform:none; color:#BBD4C3; letter-spacing:.02em}
.mast select{
  font-family:var(--sans); font-size:.9375rem; padding:9px 10px; min-height:44px;
  background:#0F3F22; color:#fff; border:2px solid rgba(255,255,255,.25); border-radius:0;
  max-width:100%;
}
/* ---- sign-in, in the masthead ------------------------------------------ */
/* Email and a one-time code. There is no password field here and there is not
   one anywhere else either. */
.mast form.si{display:flex; flex-wrap:wrap; gap:8px 10px; align-items:center; width:100%}
.mast input[type=email],.mast input[type=text].code{
  flex:1 1 210px; min-width:0; font-family:var(--sans); font-size:1rem; padding:10px 12px;
  min-height:44px; background:#0F3F22; color:#fff;
  border:2px solid rgba(255,255,255,.25); border-radius:0;
}
.mast input::placeholder{color:#7FA88E}
.mast input:focus{outline:2px solid #CFE3D5; outline-offset:0; border-color:#CFE3D5}
.mast .btnw{
  appearance:none; min-height:44px; padding:10px 16px; font-family:var(--sans);
  font-size:.9375rem; font-weight:600; border-radius:0; cursor:pointer;
  background:#F6F2E8; color:var(--green); border:2px solid #F6F2E8;
}
.mast .btnw.ghost{background:transparent; color:#CFE3D5; border-color:rgba(255,255,255,.35)}
.mast .btnw[disabled]{opacity:.5; cursor:not-allowed}
.mast .wholine{flex:1 1 100%; font-size:.9375rem; color:#DCE9E0}
.mast .wholine b{color:#fff; font-weight:600}
.mast .authnote{flex:1 1 100%; font-size:.75rem; color:#A9C6B5; max-width:60ch}
.mast .autherr{flex:1 1 100%; font-size:.8125rem; font-weight:600; color:#FBD9A6}
.mast .signedin{display:flex; flex-wrap:wrap; gap:10px; align-items:center; width:100%}

/* ---- mode notice ------------------------------------------------------- */
/* FOUR states, and they are not decorations. device and connecting are notes;
   connected is a quiet confirmation; unreachable is a WARNING, because the page
   is then showing whatever this browser last saved and a reader who misses that
   will act on figures that are not current. */
.mode{border-bottom:2px solid var(--line); background:var(--paper2); padding:12px 0}
.mode .flag{
  display:inline-block; font-size:.6875rem; font-weight:600; letter-spacing:.09em;
  text-transform:uppercase; padding:3px 8px; margin-right:8px; color:#fff; background:var(--clay);
}
.mode.device .flag{background:var(--ink2)}
.mode.connecting .flag{background:var(--ink3)}
.mode.connected .flag{background:var(--green2)}
.mode .detail{color:var(--ink2); font-size:.875rem}
.mode.unreachable{
  background:#FBF1E2; border-top:3px solid var(--clay); border-bottom:3px solid var(--clay);
  padding:15px 0;
}
.mode.unreachable .flag{background:var(--clay)}
.mode.unreachable .detail{color:#7C3A06}
.mode.unreachable .stale{
  display:block; margin-top:8px; margin-bottom:4px; color:#7C3A06;
  font-family:var(--serif); font-size:1.125rem; font-weight:700; max-width:56ch;
}

/* ---- writes that did not save ------------------------------------------ */
/* A row still on screen that never reached the database is the exact failure
   this project keeps hitting. It gets a band of its own, not a toast. */
#alerts:empty{display:none}
.wfail{background:#FBF1E2; border-bottom:3px solid var(--clay); padding:14px 0}
.wfail h4{font-size:1.0625rem; color:#7C3A06}
.wfail p{font-size:.875rem; color:#7C3A06; margin:6px 0 0; max-width:60ch}
.wfail ul{list-style:none; margin:10px 0 0; padding:0}
.wfail li{padding:8px 0; border-top:1px solid #E4C9A2; font-size:.875rem; color:#7C3A06}
.wfail li:first-child{border-top:0}
.wfail .what{font-weight:600}
.wfail .why{display:block; margin-top:3px; color:var(--ink2); overflow-wrap:anywhere}
.wfail .btnrow{margin-top:12px}

/* a row in flight, and a row that never landed */
.sync{
  display:inline-block; font-size:.6875rem; font-weight:600; letter-spacing:.04em;
  padding:2px 7px; margin-left:8px; white-space:nowrap;
  border:1px solid var(--line); background:var(--paper2); color:var(--ink3);
}
.sync.failed{border-color:var(--clay); background:#FBF1E2; color:#7C3A06}

/* ---- nav --------------------------------------------------------------- */
nav.tabs{border-bottom:2px solid var(--line); background:var(--paper); position:sticky; top:0; z-index:20}
nav.tabs .scroller{display:flex; gap:0; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch}
nav.tabs .scroller::-webkit-scrollbar{display:none}
nav.tabs button{
  flex:0 0 auto; appearance:none; background:none; border:0; border-bottom:3px solid transparent;
  font-family:var(--sans); font-size:.9375rem; font-weight:500; color:var(--ink2);
  padding:14px 14px; min-height:48px; cursor:pointer; white-space:nowrap; border-radius:0;
}
nav.tabs button:first-child{padding-left:0}
nav.tabs button[aria-selected="true"]{color:var(--green); font-weight:600; border-bottom-color:var(--clay)}

/* ---- sections ---------------------------------------------------------- */
main{padding:26px 0 72px}
.viewhead h2{font-size:1.5rem}
.viewhead p{color:var(--ink2); margin-top:6px; max-width:52ch}
.rule{border:0; border-top:2px solid var(--line); margin:22px 0}
.rule.thin{border-top-width:1px; margin:16px 0}

/* ---- the noticeboard list ---------------------------------------------- */
.board{list-style:none; margin:0; padding:0}
.board > li{padding:22px 0; border-top:2px solid var(--line)}
.board > li:first-child{border-top:0}

/* ---- provider entry: NAME and STANDING first, price small and last ----- */
.pname{font-family:var(--serif); font-size:1.3125rem; font-weight:700; color:var(--ink)}
/* A person's name is the main thing anyone taps on this page, and it landed
   at 31px against a 44px floor. The 2px rule under it moved from a
   border-bottom (which padding pushes away from the text) to an underline
   (which hugs it), so the target can be padded to 44px without the rule
   drifting. The negative margin keeps the surrounding rhythm unchanged. */
a.pname{
  display:inline-block; min-height:44px; padding:10px 0; margin:-10px 0;
  text-decoration:underline; text-decoration-color:var(--line);
  text-decoration-thickness:2px; text-underline-offset:4px;
}
a.pname:hover{text-decoration-color:var(--clay)}
.standing{display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 10px; margin-top:6px}
.stars{color:var(--clay); font-size:1.0625rem; letter-spacing:.06em}
.score{font-weight:600}
.counts{color:var(--ink2); font-size:.875rem}
.trade{margin-top:8px; font-size:.9375rem; color:var(--ink2)}
.trade b{color:var(--ink); font-weight:600}
.headline{margin-top:8px; font-family:var(--serif); font-size:1.0625rem; color:var(--ink); max-width:56ch}
.price{margin-top:12px; font-size:.8125rem; color:var(--ink3)}
.price b{color:var(--ink2); font-weight:600}

.badges{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
.badge{
  font-size:.6875rem; font-weight:600; letter-spacing:.04em; padding:3px 8px;
  border:1px solid var(--line); background:var(--paper2); color:var(--ink2);
}
.badge.ok{border-color:#B9CFC0; background:#EDF4EF; color:var(--green)}
/* clay on this band measures 4.49:1 — a hair under the floor at 11px. */
.badge.warn{border-color:#E4C9A2; background:#FBF1E2; color:#9A4708}
.badge.off{color:var(--ink3)}

/* ---- filters ----------------------------------------------------------- */
.filters{background:var(--paper2); border-top:2px solid var(--line); border-bottom:2px solid var(--line); padding:16px 0 18px; margin-bottom:4px}
.fgrid{display:grid; grid-template-columns:1fr; gap:12px}
@media(min-width:560px){.fgrid{grid-template-columns:1fr 1fr}}
label.fl{display:block; font-size:.75rem; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--ink3); margin-bottom:5px}
select,input[type=text],input[type=date],input[type=number],textarea{
  width:100%; max-width:100%; font-family:var(--sans); font-size:1rem; color:var(--ink);
  background:#fff; border:2px solid var(--line); border-radius:0; padding:11px 12px; min-height:46px;
}
textarea{min-height:110px; resize:vertical; line-height:1.5}
select:focus,input:focus,textarea:focus{outline:2px solid var(--green2); outline-offset:0; border-color:var(--green2)}
.checkrow{display:flex; align-items:center; gap:12px; min-height:44px}
/* A 20x20 checkbox is a 20px target. Drawn instead as a 44px ballot box —
   which is both a thumb-sized target and, in a system made of 2px rules and
   square corners, the shape this design was always reaching for. */
.checkrow input[type=checkbox]{
  appearance:none; -webkit-appearance:none; margin:0; flex:0 0 auto;
  width:44px; height:44px; border:2px solid var(--line); background:#fff;
  border-radius:0; cursor:pointer; display:grid; place-content:center;
}
.checkrow input[type=checkbox]::before{
  content:'\2713'; font-size:1.5rem; line-height:1; font-weight:700;
  color:var(--green); opacity:0;
}
.checkrow input[type=checkbox]:checked{border-color:var(--green); background:#EDF4EF}
.checkrow input[type=checkbox]:checked::before{opacity:1}
.checkrow label{cursor:pointer; min-height:44px; display:flex; align-items:center}
.count{margin-top:14px; font-size:.875rem; color:var(--ink2)}

/* ---- buttons ----------------------------------------------------------- */
.btn{
  appearance:none; display:inline-flex; align-items:center; justify-content:center;
  font-family:var(--sans); font-size:.9375rem; font-weight:600; border-radius:0; cursor:pointer;
  min-height:46px; padding:11px 18px; border:2px solid var(--green); background:var(--green); color:#fff;
}
.btn:hover{background:var(--green2); border-color:var(--green2)}
.btn.ghost{background:transparent; color:var(--green); }
.btn.ghost:hover{background:#EDF4EF}
.btn.clay{background:var(--clay); border-color:var(--clay)}
.btn.clay:hover{background:#9A4708; border-color:#9A4708}
.btn.small{min-height:44px; padding:9px 14px; font-size:.875rem}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.btnrow{display:flex; flex-wrap:wrap; gap:10px; margin-top:14px}
/* Same problem, same fix: an inline text button was 22px high. */
.link{
  background:none; border:0; font:inherit; color:var(--green2); cursor:pointer;
  text-decoration:underline; text-underline-offset:3px;
  display:inline-block; min-height:44px; padding:11px 0; margin:-11px 0;
}

/* ---- cards (the ONLY 4px radius in the system) ------------------------- */
.card{background:#fff; border:2px solid var(--line); border-radius:4px; padding:16px}
.card + .card{margin-top:12px}
.card.quiet{background:var(--paper2)}

/* ---- forms ------------------------------------------------------------- */
form .field{margin-bottom:18px}
form .hint{font-size:.8125rem; color:var(--ink3); margin-top:5px}
.err{font-size:.8125rem; color:#9A3412; font-weight:500; margin-top:5px}
.field.bad input,.field.bad select,.field.bad textarea{border-color:#B45309}
.note{border-left:4px solid var(--clay); padding:10px 0 10px 14px; background:var(--paper2); font-size:.875rem; color:var(--ink2)}
.note.ok{border-left-color:var(--green2)}
.flash{border:2px solid var(--green2); background:#EDF4EF; color:var(--green); padding:12px 14px; font-weight:500; margin-bottom:18px}

/* ---- request entry ----------------------------------------------------- */
.rtitle{font-family:var(--serif); font-size:1.1875rem; font-weight:600; max-width:46ch}
.meta{display:flex; flex-wrap:wrap; gap:4px 12px; margin-top:8px; font-size:.875rem; color:var(--ink2)}
.meta span{white-space:nowrap}
.desc{margin-top:10px; color:var(--ink2); max-width:60ch}
.offercount{margin-top:10px; font-size:.875rem; font-weight:600; color:var(--clay)}
.offercount.none{color:var(--ink3); font-weight:400}

/* ---- reviews ----------------------------------------------------------- */
.review{padding:16px 0; border-top:1px solid var(--line)}
.review:first-child{border-top:0}
.review .body{font-family:var(--serif); font-size:1.0625rem; color:var(--ink); margin-top:6px; max-width:58ch}
.review .by{font-size:.8125rem; color:var(--ink3); margin-top:8px}

/* ---- standing panel ---------------------------------------------------- */
.tally{display:flex; flex-wrap:wrap; gap:10px; margin-top:12px}
.tally div{flex:1 1 128px; background:var(--paper2); border:2px solid var(--line); padding:12px 14px; min-width:0}
.tally .n{font-family:var(--serif); font-size:1.5rem; font-weight:700; line-height:1}
.tally .l{font-size:.75rem; color:var(--ink2); margin-top:4px}
/* The cross-platform links are the proof that a standing is portable, and on a
   phone they are a real tap, not decoration — so they get the 44px floor too.
   Underline rather than border-bottom, and negative margins, so the padding
   does not push the rule away from the word or grow the tally cell. */
.tally .l a{
  color:var(--green2); display:inline-block; min-height:44px; padding:14px 0; margin:-14px 0;
  text-decoration:underline; text-decoration-color:var(--line); text-underline-offset:3px;
}
.tally .l a:hover{text-decoration-color:var(--clay)}

/* ---- my documents ------------------------------------------------------ */
.dlist{list-style:none; margin:0; padding:0}
.dlist > li{padding:22px 0; border-top:2px solid var(--line)}
.dlist > li:first-child{border-top:0}
.dname{font-family:var(--serif); font-size:1.1875rem; font-weight:700}
.dstate{margin-top:6px; font-size:.9375rem; font-weight:600}
.dstate.ok{color:var(--green)}
.dstate.wait{color:var(--ink2)}
.dstate.no{color:var(--clay)}
.dstate.draft{color:var(--ink2)}
.dwhy{
  margin-top:10px; border-left:4px solid var(--clay); padding:10px 0 10px 14px;
  background:var(--paper2); font-size:.875rem; color:var(--ink); max-width:60ch;
}
.dmeta{margin-top:8px; font-size:.875rem; color:var(--ink2)}
.dlink{margin-top:10px; font-size:.875rem}
.kinds{list-style:none; margin:10px 0 0; padding:0; font-size:.8125rem; color:var(--ink3); max-width:60ch}
.kinds li{padding:6px 0; border-top:1px solid var(--line)}
.kinds b{color:var(--ink2); font-weight:600}
input[type=file]{
  width:100%; max-width:100%; font-family:var(--sans); font-size:.9375rem;
  padding:11px 12px; min-height:46px; background:#fff;
  border:2px dashed var(--line); border-radius:0; color:var(--ink2);
}
input[type=file]:focus{outline:2px solid var(--green2); border-color:var(--green2)}

/* ---- doc verdicts ------------------------------------------------------ */
.docs{list-style:none; margin:10px 0 0; padding:0}
.docs li{padding:10px 0; border-top:1px solid var(--line); display:flex; gap:10px; align-items:flex-start; font-size:.9375rem}
.docs li:first-child{border-top:0}
.docs .mark{flex:0 0 auto; font-weight:700; width:1.2em; text-align:center}
.docs .ok{color:var(--green2)}
.docs .no{color:var(--clay)}
.docs .wait{color:var(--ink3)}

/* ---- rating input ------------------------------------------------------ */
.ratepick{display:flex; gap:6px; flex-wrap:wrap}
.ratepick button{
  appearance:none; min-width:46px; min-height:46px; font-size:1.125rem; cursor:pointer;
  border:2px solid var(--line); background:#fff; color:var(--ink3); border-radius:0; font-family:var(--sans);
}
.ratepick button[aria-pressed="true"]{background:var(--clay); border-color:var(--clay); color:#fff; font-weight:600}

/* ---- scrollers for anything genuinely wide ----------------------------- */
.xscroll{overflow-x:auto; -webkit-overflow-scrolling:touch; max-width:100%}

/* ---- footer ------------------------------------------------------------ */
footer{border-top:2px solid var(--line); background:var(--paper2); padding:26px 0 34px; margin-top:40px}
footer p{font-size:.8125rem; color:var(--ink3); margin:0 0 6px}
footer a{color:var(--green2)}
/* ---- share: the text itself, always shown, never a dead button ---------- */
/* MEND.share() falls all the way down — share sheet, clipboard, then the text
   returned so it can be copied by hand. The manual case is the one that has to
   work: a button that appears to do nothing is worse than no button. */
.sharebox{border:2px solid var(--green); background:#fff; padding:14px; margin:0 0 18px}
.sharebox h4{font-size:1.0625rem}
.sharebox .lead{font-size:.875rem; color:var(--ink2); margin:6px 0 10px}
.sharebox textarea{
  width:100%; max-width:100%; min-height:190px; box-sizing:border-box;
  font-family:var(--sans); font-size:.875rem; line-height:1.5;
  padding:10px; border:1.5px solid var(--line); background:var(--paper2); color:var(--ink);
  border-radius:0; resize:vertical; -webkit-text-size-adjust:100%;
}
.sharebox .btnrow{margin-top:10px}

/* ---- settlement -------------------------------------------------------- */
.settle{border-top:2px solid var(--line); margin-top:14px; padding-top:12px}
.settle h4{font-size:1rem}
.paid{border-left:4px solid var(--green); background:var(--paper2); padding:10px 12px; margin:10px 0 0}
.paid .top{display:flex; flex-wrap:wrap; gap:4px 12px; align-items:baseline}
.paid .amt{font-size:1.0625rem; font-weight:600}
.paid .st{font-size:.75rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink2)}
.paid.done{border-left-color:var(--green2); background:#EEF5EE}
.paid .ref{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.8125rem; overflow-wrap:anywhere}
.settleform .grid2{display:flex; flex-wrap:wrap; gap:0 14px}
.settleform .grid2 > *{flex:1 1 150px; min-width:0}

/* ---- saying something is wrong ----------------------------------------- */
/* QUIET, on purpose. This is not an action to encourage: a prominent REPORT
   button on every listing is an invitation, and the first people to accept an
   invitation like that are rarely the ones with a real complaint. It is the
   quietest ink in the system, it sits under everything else, and it still
   carries the 44px floor because a small target is a different thing from a
   quiet one. */
.reportrow{margin-top:14px}
.link.quiet{font-size:.8125rem; color:var(--ink3); text-decoration-color:var(--line)}
.link.quiet:hover{color:var(--clay); text-decoration-color:var(--clay)}
/* A count, and only from two people up — one report is one opinion. */
.repsignal{margin-top:10px; font-size:.8125rem; color:var(--clay); font-weight:600}
.repform .private{
  border-left:4px solid var(--green); background:#EDF4EF; padding:10px 0 10px 14px;
  margin-top:12px; font-size:.875rem; color:var(--ink2); max-width:60ch;
}

/* ---- taken down by MEND ------------------------------------------------ */
/* Never silent. A listing that quietly stops appearing, with no word said, is
   indistinguishable from a bug — to the person it happened to most of all. */
.takedown{
  border:2px solid var(--clay); background:#FBF0E6; padding:12px 14px; margin:12px 0;
  max-width:62ch;
}
.takedown .hd{font-family:var(--serif); font-size:1.0625rem; font-weight:700; color:#8A3F07}

<style>/* Injected into every app at build time. A printed page must be the RECORD,
   not a photograph of an app: no navigation, no buttons, no banners, no
   coloured blocks that come out as grey smears on a mono printer. */
@media print {
  #mend-strip, nav, .noprint, [data-noprint] { display: none !important; }
  html, body { background: #fff !important; color: #000 !important;
               padding-bottom: 0 !important; margin: 0 !important; }
  body { font-size: 11.5pt; }
  a[href^="http"]::after { content: " (" attr(href) ")"; font-size: 9pt; word-break: break-all; }
  a { text-decoration: none; color: #000 !important; }
  /* Progress bars and status pills are colour on screen and meaningless in
     grey, so print gives them an outline and lets the number carry the meaning. */
  [class*="bar"], [class*="pill"], [class*="badge"], [class*="stamp"] {
    box-shadow: none !important; border: 1px solid #000 !important;
    background: #fff !important; color: #000 !important;
  }
  button, input[type="button"], input[type="submit"], select { display: none !important; }
  input, textarea { border: none !important; padding: 0 !important; font: inherit !important; }
  table { page-break-inside: auto; } tr { page-break-inside: avoid; }
  h1, h2, h3 { page-break-after: avoid; }
  /* When one element is being printed on purpose, print only that.
     CSS cannot select an ancestor, so printRecord() marks the chain from the
     target up to <body> with data-print-path. Without that, a target nested
     anywhere below body had its own parent hidden and printed a blank page. */
  body[data-printing] *:not([data-print-path]):not([data-print-target]):not([data-print-target] *) {
    display: none !important;
  }
  body[data-printing] [data-print-path] {
    display: block !important;
    margin: 0 !important; padding: 0 !important; border: none !important;
    background: none !important; box-shadow: none !important; max-width: none !important;
  }
  body[data-printing] [data-print-target],
  body[data-printing] [data-print-target] * { display: revert !important; }
  body[data-printing] [data-print-target] { display: block !important; }
  @page { margin: 16mm; }
}
</style>

  addEventListener('online', paintOnline); addEventListener('offline', paintOnline); paintOnline();

  ['caterer','Catering','Moapehi'],['seamstress','Tailoring & dressmaking','Moroki'],

  ['accountant','Bookkeeping & tax',null],['hr','HR on demand',null],
  ['legal','Legal drafting',null],['surveyor','Land surveying',null],

];

function tradeName(c){ return TRADE_NAME[c] || c; }

/* Seven of these eleven names already exist in core/i18n.js and are used from

var DOC_KEY = {
  national_id:'doc.national_id', passport:'doc.passport',

var ALLOWED_EXT  = ['.jpg','.jpeg','.png','.heic','.pdf'];

  mafisa:  MEND.HOSTS.mafisa,
  matsema: MEND.HOSTS.matsema

var TAB_KEY = { find:'pitso.find', requests:'pitso.requests', post:'pitso.post',

/* ---- tiny helpers ------------------------------------------------------ */
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
var $  = function(s,r){ return (r||document).querySelector(s); };
var $$ = function(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
function dayOf(ts){ return ts ? String(ts).slice(0,10) : null; }
function yearOf(d){ return d ? String(d).slice(0,4) : ''; }
function name(id){ var p = MEND.profile(id); return p ? p.display_name : 'Unknown'; }

/* ONE function converts a typed amount into cents, and ONE converts cents to
   text. A figure shown on screen and the figure written to storage must never
   be computed in two places. */
function toCents(v){
  if (v == null) return null;
  var s = String(v).trim().replace(/[, ]/g,'');
  if (s === '') return null;
  var n = Number(s);
  if (!isFinite(n) || n < 0) return NaN;
  return Math.round(n * 100);

function offerAmount(offer){ return offer && offer.quote_cents != null ? offer.quote_cents : null; }
function moneyOrPhrase(cents, phrase){ return cents == null ? phrase : MEND.M(cents); }

function rateLine(pp){
  if (pp.rate === 'hourly'  && pp.rate_cents != null) return T('pitso.rate.hourly', { amount: MEND.M(pp.rate_cents) });
  if (pp.rate === 'daily'   && pp.rate_cents != null) return T('pitso.rate.daily',  { amount: MEND.M(pp.rate_cents) });
  if (pp.rate === 'per_job') return T('pitso.rate.perjob');
  return T('pitso.rate.quote');
}

/* A state that came out of the database — 'agreed', 'engaged', 'offered' — is
   the schema talking, not the app. One place turns it into a word. */
function stateWord(st){ return T('pitso.st.' + st); }

   word order moves between languages. So the whole sentence is one string with
   named holes, escaped as a template, and the holes filled with markup that is
   already safe. */
function tHtml(key, vars){
  var out = esc(T(key));
  Object.keys(vars || {}).forEach(function(k){
    out = out.split('{' + k + '}').join(vars[k]);

}
function countWord(n, one, many){ return n === 1 ? T(one) : T(many, { n: n }); }

/* This app found a race in MEND.record(): it read the previous hash and the next
   sequence number, awaited the SHA-256 digest, and only then pushed — so two
   actions in the same tick both wrote a row claiming seq 1 and the chain

   quickly. THAT IS NOW FIXED IN core/mend.js, which serialises its own writes.
   This wrapper stays for the second reason only: a ledger failure must never
   eat a click. */
var recTail = Promise.resolve();
function rec(event_type, opts){
  recTail = recTail.then(function(){ return MEND.record(event_type, opts); })
                   .catch(function(){ /* a ledger failure must never eat a click */ });
  return recTail;
}

var T = function(k, v){ return MEND.t(k, v); };

   SHARE — plain text that can leave the app

   be able to become text somebody pastes into a WhatsApp group, reads down a
   phone, or prints and puts on a wall.

   MEND.share() falls all the way down: the share sheet, then the clipboard,
   then the text itself handed back. THE LAST CASE IS THE ONE THAT MATTERS —
   it is shown in a box that can be selected, because a button that appears to
   do nothing is worse than no button at all.

function doShare(spec){
  MEND.share(spec).then(function(res){
    if (res.via === 'cancelled') return;
    state.shareBox = { title: spec.title, text: res.text, via: res.via };
    render();
    window.scrollTo(0, 0);
  });
}

    '<p class="lead">' + esc(lead) + '</p>' +
    '<textarea id="sharetext" readonly rows="10" aria-label="' +
      esc(T('pitso.share.notice')) + '">' + esc(b.text) + '</textarea>' +
    '<div class="btnrow">' +
      '<a class="btn small" href="' + esc(MEND.whatsappLink('', b.text)) + '" target="_blank" rel="noopener">' +
        esc(T('pitso.share.whatsapp')) + '</a>' +
      '<button class="btn ghost small" id="share-close">' + esc(T('app.close')) + '</button>' +

  '</div>';

/* =========================================================================
   PRINT — the record, not a photograph of an app
   The sheet is built as a DIRECT CHILD of <body>. tools/print.css isolates the
   print target with `body[data-printing] > *:not([data-print-target])`, which
   only reaches the top level: a target nested inside a wrapper has that
   wrapper hidden out from under it and prints a blank page.
   ========================================================================= */
function printSheet(html, title){
  var el = document.getElementById('printsheet');
  if (!el){
    el = document.createElement('div');
    el.id = 'printsheet'; el.className = 'printsheet';
    /* It is display:none except while printing. Without this its h1/h3 stay in
       the heading order of the live page and a screen reader navigating by
       heading walks into a document that is not on screen. */
    el.setAttribute('aria-hidden', 'true');
    document.body.appendChild(el);
  }
  el.innerHTML = html;
  MEND.printRecord(el, title);

/* =========================================================================
   SETTLEMENT — the platform RECORDS that money moved. It never moves it.
   No card rail exists for a Lesotho merchant and holding other people's funds
   is licensed activity, so the money goes M-Pesa, EcoCash, bank or hand to
   hand, exactly as it already does. What Pitso can give the two of them is one
   record they both agreed to, with the transaction code on it.

   There is no Pay button on this screen and there is not going to be one.
   ========================================================================= */
var ELECTRONIC = ['mpesa','ecocash','bank_transfer'];
function methodLabel(m){ return T('pitso.method.' + m); }

/* MEND.canSettle is the ONLY place the rule lives. This puts its answer into
   Sesotho and nothing more — if core changes its wording the match misses and
   the English comes through, which is degraded but never wrong. */
function settleReason(msg){
  if (!msg) return msg;
  var m = String(msg);
  if (/^put in how much/.test(m))                       return T('pitso.settle.err.amount');
  if (/only be between the two people/.test(m))         return T('pitso.settle.err.parties');
  if (/same person on both sides/.test(m))              return T('pitso.settle.err.same');
  var mm = m.match(/^an?\s+(.+?)\s+payment needs its transaction code/);
  if (mm) return T('money.code_needed', { method: mm[1] });
  if (/more than twice/.test(m))                        return T('pitso.settle.err.toomuch');
  if (/only the two people in this payment/.test(m))    return T('pitso.settle.err.nobody');
  return m;
}

function settleRow(s, meId){
  var mineDone = (s.payer_id === meId && s.confirmed_by_payer) ||
                 (s.payee_id === meId && s.confirmed_by_payee);
  var iAmParty = s.payer_id === meId || s.payee_id === meId;
  var them = s.payer_id === meId ? s.payee_id : s.payer_id;
  var line = s.agreed_by_both ? T('money.settled')
           : (s.confirmed_by_payer || s.confirmed_by_payee)
             ? (mineDone ? T('pitso.settle.mine.done', { name: name(them) })
                         : T('pitso.settle.theirs.done', { name: name(them) }))
             : T('pitso.settle.state.new');
  return '<div class="paid' + (s.agreed_by_both ? ' done' : '') + '">' +
    '<div class="top">' +
      '<span class="amt">' + esc(MEND.M(s.amount_cents)) + '</span>' +
      '<span class="st">' + esc(methodLabel(s.method)) + '</span>' +
      '<span class="st">' + esc(MEND.fmtDate(s.paid_on)) + '</span>' +
    '</div>' +
    '<div class="small sec">' + esc(T('pitso.settle.paidto',
        { payer: name(s.payer_id), payee: name(s.payee_id) })) + '</div>' +
    (s.reference ? '<div class="ref">' + esc(T('pitso.settle.ref')) + ': ' + esc(s.reference) + '</div>' : '') +
    (s.note ? '<div class="small sec break">' + esc(s.note) + '</div>' : '') +
    '<div class="small" style="margin-top:6px"><b>' + esc(line) + '</b></div>' +
    (iAmParty && !mineDone
      ? ifWritable('<div class="btnrow"><button class="btn small" data-confirmpay="' + esc(s.id) + '">' +
                   esc(T('pitso.settle.confirm')) + '</button></div>')
      : '') +
  '</div>';
}

function submitSettlement(form){
  if (refuseWrite()) return;
  var eid = form.getAttribute('data-payform');
  var e = MEND.all('engagements').filter(function(x){ return x.id === eid; })[0];
  var meP = MEND.me();
  if (!e || !meP) return;

  var dir = $('#s-dir', form).value;
  var payer = dir === 'pv' ? e.provider_id : e.counterparty_id;
  var payee = dir === 'pv' ? e.counterparty_id : e.provider_id;
  var cents = toCents($('#s-amount', form).value);
  var spec = {
    payer_id: payer, payee_id: payee,
    amount_cents: isNaN(cents) ? null : cents,
    method: $('#s-method', form).value,
    reference: $('#s-ref', form).value,
    paid_on: $('#s-date', form).value || MEND.today()
  };

  /* Ask the gate BEFORE writing and show what it said, in words, rather than
     greying a button out and leaving the person to guess. */
  var why = MEND.canSettle(eid, spec);
  if (why){ state.settleErr = settleReason(why); return render(); }

  try {
    MEND.recordSettlement(eid, spec);
  } catch (err){
    state.settleErr = settleReason(err.message); return render();
  }
  state.settleErr = null; state.openForm = null;
  state.flash = T('pitso.settle.written');
  render();
}

/* =========================================================================
   SAYING SOMETHING IS WRONG

   A report is a CLAIM, not a finding. Three things follow from that, and all
   three are in the markup below rather than in a comment nobody reads:

     1. It is PRIVATE. What is written goes to MEND and is never shown to the
        person reported. The form says so, in the person's own language,
        before they type — because that is what decides whether somebody
        writes honestly or writes nothing.
     2. It is QUIET. The way in is the smallest link on the page. A prominent
        button here would be an invitation, and the people who take up an
        invitation like that first are rarely the ones with a real complaint.
     3. ONE report is ONE opinion. MEND.reportSignal() returns 0 below two on
        purpose, so the count is shown only when it is non-zero. Nothing here
        ever prints "1 person reported this".
   ========================================================================= */
var REPORT_WHAT = { pitso_providers:'pitso.rep.what.provider',
                    pitso_requests: 'pitso.rep.what.request' };

/* core/mend.js refuses in English. Same pattern as settleReason/disputeReason:
   an unmatched refusal comes through in English, which is degraded and
   visible, rather than swallowed. */
function reportReason(msg){
  if (!msg) return msg;
  var m = String(msg);
  if (/^sign in to report/.test(m))        return T('pitso.rep.err.signin');
  if (/already reported this/.test(m))     return T('report.already');
  if (/^choose a reason/.test(m))          return T('pitso.rep.err.reason');
  return m;
}

function reportKey(table, id){ return table + ':' + id; }

/* The count, and nothing else. Never the reason, never who said it, never the
   words — putting a claim on a public page would make Pitso a place people are
   damaged by rumour. */
function reportSignalHtml(table, id){
  var n = MEND.reportSignal(table, id);
  if (!n) return '';
  return '<div class="repsignal">' + esc(T('report.signal', { n: n })) + '</div>';
}

function reportForm(table, id){
  var k = reportKey(table, id);
  var what = T(REPORT_WHAT[table] || 'pitso.rep.what.provider');
  return '<form class="card quiet repform" data-reportform="' + esc(k) + '" style="margin-top:12px" novalidate>' +
    '<h4>' + esc(T('pitso.rep.head')) + '</h4>' +
    '<p class="tiny sec" style="margin-top:4px">' + esc(T('pitso.rep.about', { what: what })) + '</p>' +
    /* Said before a word is typed. It is true — db/020_abuse.sql scopes a
       report to its reporter and the desk — and it is the fact that decides
       whether somebody is willing to write honestly. */
    '<div class="private">' + esc(T('report.private')) + '</div>' +
    (state.reportErr ? '<div class="note" style="margin-top:10px"><b>' + esc(T('app.no')) + '</b> — ' +
                       esc(state.reportErr) + '</div>' : '') +
    '<div class="field" style="margin-top:14px"><label class="fl" for="rp-reason">' +
      esc(T('report.why')) + '</label>' +
      '<select id="rp-reason">' +
        '<option value="">' + esc(T('pitso.rep.pick')) + '</option>' +
        MEND.REPORT_REASONS.map(function(r){
          return '<option value="' + esc(r) + '">' + esc(T('report.r.' + r)) + '</option>';
        }).join('') +
      '</select></div>' +
    '<div class="field"><label class="fl" for="rp-detail">' + esc(T('report.detail')) + '</label>' +
      '<textarea id="rp-detail" maxlength="2000" placeholder="' + esc(T('pitso.rep.detail_ph')) + '"></textarea></div>' +
    '<div class="btnrow"><button type="submit" class="btn ghost small">' + esc(T('pitso.rep.send')) + '</button>' +
      '<button type="button" class="btn ghost small" data-cancel="1">' + esc(T('app.cancel')) + '</button></div>' +
  '</form>';
}

/* The signal, then either the form, the refusal in words, or the quiet way in.
   Never a dead button: if MEND.canReport says no, the reason is printed. */
function reportBlock(table, id){
  var k = reportKey(table, id);
  var h = reportSignalHtml(table, id);
  if (state.openForm === 'rep-' + k) return h + reportForm(table, id);
  var why = MEND.canReport(table, id);
  if (why)
    return h + '<div class="reportrow"><span class="small muted">' + esc(reportReason(why)) + '</span></div>';
  return h + '<div class="reportrow" data-noprint>' +
    '<button class="link quiet" data-report="' + esc(k) + '">' + esc(T('report.this')) + '</button></div>';
}

function submitReport(form){
  if (refuseWrite()) return;
  var parts = String(form.getAttribute('data-reportform') || '').split(':');
  var table = parts.shift(), id = parts.join(':');
  var reason = $('#rp-reason', form).value;
  var detail = $('#rp-detail', form).value.trim();
  if (!reason) { state.reportErr = T('pitso.rep.err.reason'); return render(); }
  try {
    MEND.report(table, id, reason, detail);
  } catch (err) {
    state.reportErr = reportReason(err.message);
    return render();
  }
  state.openForm = null; state.reportErr = null;
  state.flash = MEND.claimed(T('report.sent'));
  render();
}

/* =========================================================================
   WHEN MEND HAS TAKEN SOMETHING DOWN

   db/020_abuse.sql makes moderation readable by everybody (`using (true)`) for
   exactly this reason: a person whose listing was hidden is entitled to see
   that it was, and why. A takedown also quietly flips the row itself —
   pitso_providers.available to false, pitso_requests.state to 'withdrawn' — so
   without this block the listing would read as "not taking work now" to its
   owner and to everyone else, which is a different and untrue statement.
   ========================================================================= */
function isHidden(table, id){
  var m = MEND.moderationOf(table, id);
  return m && m.action === 'hidden' ? m : null;
}

function takedownBlock(table, id){
  var m = isHidden(table, id);
  if (!m) return '';
  var day = dayOf(m.created_at);
  return '<div class="takedown">' +
    '<div class="hd">' + esc(T('mod.hidden')) +
      (day ? ' ' + esc(T('pitso.mod.on', { date: MEND.fmtDate(day) })) : '') + '</div>' +
    '<div class="why"><b>' + esc(T('mod.reason')) + '</b><span class="break">' + esc(m.reason) + '</span></div>' +
    '<p class="note">' + esc(T('pitso.mod.note')) + '</p>' +
  '</div>';
}

/* =========================================================================
   WHAT THE LIST IS NOT SHOWING

   Downloads are bounded — the first 200 providers, the first 200 open
   requests. A bounded list that does not say it is bounded is lying by
   omission, and the lie is worst for exactly the person who is missing.
   ========================================================================= */
/* Four thousand three hundred and twelve is read as 4,312, not 4312. A figure
   that has to be counted digit by digit is a figure people skip. */
function grouped(n){
  try { return Number(n).toLocaleString(); } catch (e) { return String(n); }
}

function coverageBlock(table, opts){
  var c = MEND.coverageOf(table);
  if (!c || !(c.total > c.loaded)) return '';
  opts = opts || {};
  return '<div class="bounded">' +
    '<b>' + esc(T('pitso.cov.showing',

/* ---- a write that did not land ----------------------------------------- */
/* In connected mode insert()/update() return immediately and push in the
   background. A row that failed carries _sync === 'failed' and _error. Both are
   shown: a band at the top of the page, and a mark on the row itself. */
function syncMark(row){
  if (!row) return '';
  /* Once a row has been refused, Pitso keeps saying so. It does not take a later
     'success' as proof: a PATCH against a row that was never inserted matches
     nothing, returns 200, and core clears its own marker — at which point a
     document that exists in this browser alone would read as saved. */
  var remembered = row.id && state.failedIds[row.id];
  if (row._sync === 'failed' || remembered)
    return '<span class="sync failed" title="' + esc(row._error || remembered || T('pitso.wfail.nomsg')) + '">' +
           esc(T('pitso.wfail.notsaved')) + '</span>';
  if (row._sync === 'saving')
    return '<span class="sync" title="' + esc(T('pitso.wfail.sendingtip')) + '">' +
           esc(T('pitso.wfail.saving')) + '</span>';
  return '';
}

function renderAlerts(){
  var box = $('#alerts');
  if (!box) return;
  if (!state.writeErrors.length) { box.innerHTML = ''; return; }
  var n = state.writeErrors.length;
  box.innerHTML = '<div class="wfail"><div class="wrap">' +
    '<h4>' + esc(n === 1 ? T('pitso.wfail.one') : T('pitso.wfail.many', { n: n })) + '</h4>' +
    '<p>' + esc(T('pitso.wfail.explain')) + '</p>' +
    '<ul>' + state.writeErrors.map(function(e){
      return '<li><span class="what">' + esc(describeWrite(e)) + '</span>' +
             '<span class="why">' + esc(e.message) + '</span>' +
             (/_sync/.test(e.message || '')
               ? '<span class="why">' + esc(T('pitso.wfail.core')) + '</span>'
               : '') +
             '</li>';
    }).join('') + '</ul>' +
    '<div class="btnrow"><button class="btn ghost small" id="clear-errors">' +
      esc(T('pitso.wfail.read')) + '</button></div>' +
    '</div></div>';
}

var WRITE_WORDS = {

  engagements:'pitso.w.engagement', reviews:'pitso.w.review',
  documents:'pitso.w.document', profiles:'pitso.w.profile',

/* ---- when a write would be a lie --------------------------------------- */
/* Device preview has no server, and the banner says so, so a local write there
   is honest. When a server IS configured and is not answering, a form that
   accepts input would produce a row that lives in this browser and nowhere
   else — which is the failure this whole band of the page exists to prevent. */
function writeBlock(){
  if (!MEND.CONFIGURED) return null;
  if (MEND.status === 'connected') return null;
  if (MEND.status === 'connecting') return T('pitso.err.connecting');
  return T('pitso.err.noserver');
}
function ifWritable(html){
  var r = writeBlock();
  return r ? '<div class="note" style="margin-top:12px">' + esc(r) + '</div>' : html;
}
/* Guard at the moment of writing, not only at render. */
function refuseWrite(){
  var r = writeBlock();
  if (r) { state.flash = r; render(); return true; }
  return false;
}

/* =========================================================================
   FINDING SOMEBODY WHO IS NOT IN THE FIRST 200

   MEND.searchAll() reads the local cache, and the cache is now the first 200
   providers and the first 200 open requests. The one welder in Mokhotlong is
   not in it, and a search that answered "nothing matched" would be telling a
   person their neighbour does not exist.

   So: MEND.searchServer() when there is a server answering, MEND.searchAll()
   when there is not — and the page SAYS WHICH ONE RAN, every time, because
   "nothing matched" means two different things in the two cases.

   Debounced, and deliberately not on every keystroke. Firing a query per
   letter over somebody's prepaid data is a cost they did not agree to, and
   eight round trips to spell "Mokhotlong" is seven of them wasted.
   ========================================================================= */
var SEARCH_MIN = 2;
var SEARCH_WAIT = 400;
var searchTimer = null;

function searchBox(){
  var s = state.search;
  return '<div class="qrow">' +
    '<label class="fl" for="q-find">' + esc(T('pitso.q.label')) + '</label>' +
    '<input type="search" id="q-find" autocomplete="off" spellcheck="false" ' +
      'value="' + esc(s.q) + '" placeholder="' + esc(T('pitso.q.ph')) + '">' +
  '</div>';
}

/* Which of the two searches ran, said plainly. This is the honesty the whole
   feature turns on, so it is never omitted — not when there are results, not
   when there are none. */
function searchNoteHtml(){
  var s = state.search;
  if (s.err)
    return '<div class="qnote">' + esc(T('pitso.q.err', { why: s.err })) + '</div>';
  if (s.running)
    return '<div class="qnote">' + esc(T('pitso.q.running')) + '</div>';
  if (s.q.trim().length && s.q.trim().length < SEARCH_MIN)
    return '<div class="qnote">' + esc(T('pitso.q.min')) + '</div>';
  if (!s.results) return '';
  var n = s.results.length;
  return '<div class="qnote">' +
    esc(n === 0 ? T('pitso.q.none') : n === 1 ? T('pitso.q.one') : T('pitso.q.n', { n: n })) +
    '<span class="where">' + esc(T(s.via === 'server' ? 'pitso.q.server' : 'pitso.q.local')) + '</span>' +
  '</div>';
}

/* A person or a Pitso listing is opened in this app. Anything on Mafisa or
   Matsema is a link OUT, which is the portable-standing claim being made good
   rather than asserted — and it opens in its own tab so nothing typed here is
   thrown away. */
function searchResultHtml(r){
  var label = T('pitso.q.t.' + r.type) === 'pitso.q.t.' + r.type ? r.type : T('pitso.q.t.' + r.type);
  var inApp = (r.type === 'person' || r.type === 'provider') ||
              (r.type === 'request' && r.platform === 'pitso');
  var title;
  if (inApp && (r.type === 'person' || r.type === 'provider')) {
    title = '<a href="#" data-profile="' + esc(r.id) + '">' + esc(r.title) + '</a>';
  } else if (r.url) {
    title = '<a href="' + esc(r.url) + '" rel="noopener" target="_blank">' + esc(r.title) + '</a>';
  } else {
    title = esc(r.title);
  }
  var where = (r.platform && r.platform !== 'pitso') ? ' · ' + T('pitso.q.elsewhere') : '';
  return '<li>' +
    '<span class="kindtag">' + esc(label) + '</span>' +
    '<div class="qt">' + title + '</div>' +
    (r.subtitle || where
      ? '<div class="qs break">' + esc((r.subtitle || '') + where) + '</div>' : '') +
  '</li>';
}

function searchResultsHtml(){
  var s = state.search;
  if (!s.results || !s.results.length) return '';
  return '<ul class="qres">' + s.results.map(searchResultHtml).join('') + '</ul>';
}

/* Only the two panels are repainted, never the input. Re-rendering the whole
   view on each keystroke would take the caret away from whoever is typing,
   which on a phone means they cannot finish a word. */
function paintSearch(){
  var note = $('#q-note'), out = $('#q-out'), board = $('#q-board');
  if (!note || !out) return;
  note.innerHTML = searchNoteHtml();
  out.innerHTML = searchResultsHtml();
  if (board) board.hidden = !!(state.search.results || state.search.running);
}

function runSearch(){
  var s = state.search;
  var q = s.q.trim();
  if (q.length < SEARCH_MIN) {
    s.running = false; s.results = null; s.via = null; s.err = null;
    return paintSearch();
  }
  var seq = ++s.seq;
  s.running = true; s.err = null;
  paintSearch();
  /* searchServer() returns null rather than throwing when there is no
     connection, which is the signal to fall back — and to say so. */
  Promise.resolve(MEND.searchServer(q, 30)).then(function(rows){
    if (seq !== state.search.seq) return;          /* a newer query is in flight */
    if (rows) { s.results = rows; s.via = 'server'; }
    else      { s.results = MEND.searchAll(q); s.via = 'local'; }
    s.running = false;
    paintSearch();
  }).catch(function(e){
    if (seq !== state.search.seq) return;
    /* The server answered badly. Fall back rather than showing nothing, and
       print BOTH facts: what came back, and that only the cache was read. */
    s.results = MEND.searchAll(q); s.via = 'local';
    s.running = false; s.err = null;
    paintSearch();
    var note = $('#q-note');
    if (note) note.insertAdjacentHTML('beforeend',
      '<div class="qnote">' + esc(T('pitso.q.err', { why: e.message })) + '</div>');
  });
}

function onSearchInput(v){
  state.search.q = v;
  if (searchTimer) clearTimeout(searchTimer);
  if (!v.trim().length) {
    state.search.seq++;
    state.search.running = false; state.search.results = null;
    state.search.via = null; state.search.err = null;
    return paintSearch();
  }
  searchTimer = setTimeout(runSearch, SEARCH_WAIT);
}

function viewFind(){
  var f = state.filters;
  var list = MEND.all('pitso_providers').filter(function(pp){
    if (f.trade && pp.trade_code !== f.trade) return false;
    if (f.district && (pp.districts || []).indexOf(f.district) === -1) return false;
    if (f.available && !pp.available) return false;
    return true;
  });
  /* Sorted by standing, never by price. */
  list.sort(function(a,b){
    var A = MEND.standing(a.profile_id), B = MEND.standing(b.profile_id);
    return (B.rating || 0) - (A.rating || 0) || B.jobs_completed - A.jobs_completed;
  });

  var tradeOpts = ['<option value="">' + esc(T('ui.all_trades')) + '</option>'].concat(TRADES.map(function(t){
    return '<option value="' + esc(t[0]) + '"' + (f.trade === t[0] ? ' selected' : '') + '>' + esc(t[1]) + '</option>';
  })).join('');
  var distOpts = ['<option value="">' + esc(T('ui.all_districts')) + '</option>'].concat(MEND.DISTRICTS.map(function(d){
    return '<option value="' + esc(d) + '"' + (f.district === d ? ' selected' : '') + '>' + esc(d) + '</option>';
  })).join('');

  return '<div class="viewhead"><h2>' + esc(T('pitso.find')) + '</h2>' +
      '<p>' + esc(T('pitso.find.intro')) + '</p></div>' +
    '<div class="filters">' +
    searchBox() +
    '<div class="fgrid">' +
      '<div><label class="fl" for="f-trade">' + esc(T('pitso.trade')) + '</label><select id="f-trade">' + tradeOpts + '</select></div>' +
      '<div><label class="fl" for="f-dist">' + esc(T('app.district')) + '</label><select id="f-dist">' + distOpts + '</select></div>' +
    '</div>' +
    '<div class="checkrow" style="margin-top:12px">' +
      '<input type="checkbox" id="f-avail"' + (f.available ? ' checked' : '') + '>' +
      '<label for="f-avail">' + esc(T('pitso.onlyavailable')) + '</label></div>' +
    '<div class="count" id="f-count">' + esc(T('pitso.onboard',
        { n: list.length + ' ' + (list.length === 1 ? T('app.person') : T('app.people')) })) + '</div>' +
    /* The count above is the count of what was DOWNLOADED. Saying it without
       saying that is the omission this line exists to close. */
    coverageBlock('pitso_providers', { search: true }) +
    '</div>' +
    '<div id="q-note"></div><div id="q-out"></div>' +
    '<div id="q-board">' +
    (list.length
      ? '<ul class="board">' + list.map(providerEntry).join('') + '</ul>'
      : '<p class="muted" style="padding:28px 0">' + esc(T('pitso.empty.board')) + '</p>') +
    '</div>';
}

   VIEW 2 — PROVIDER PROFILE
   ========================================================================= */
function docVerdict(d){
  var s = MEND.effectiveStatus(d);            /* never read d.status directly */
  var label = docLabel(d.kind);
  if (s === 'verified') {
    var tail = [];
    if (d.issued_by) tail.push(d.issued_by + (d.issued_on ? ' ' + yearOf(d.issued_on) : ''));
    else if (d.issued_on) tail.push(T('pitso.dv.issued', { date: MEND.fmtDate(d.issued_on) }));
    if (d.expires_on) tail.push(T('pitso.dv.validto', { date: MEND.fmtDate(d.expires_on) }));
    return { cls:'ok', mark:'✓',
             text: T('pitso.dv.verified', { doc: label }) + (tail.length ? ' · ' + tail.join(' · ') : '') };
  }
  if (s === 'expired')
    return { cls:'no', mark:'!', text: T('pitso.dv.expired', { doc: label, date: MEND.fmtDate(d.expires_on) }) };
  if (s === 'rejected')
    return { cls:'no', mark:'×', text: T('pitso.dv.rejected', { doc: label }) };
  return { cls:'wait', mark:'·', text: T('pitso.dv.waiting', { doc: label }) };
}

function viewProfile(){
  var pid = state.profileId;
  var p = MEND.profile(pid);
  if (!p) return '<p class="sec">' + esc(T('pitso.prof.nosuch')) + '</p>';
  var pp = MEND.all('pitso_providers').filter(function(x){ return x.profile_id === pid; })[0];
  var st = MEND.standing(pid);
  var docs = MEND.all('documents').filter(function(d){ return d.profile_id === pid; });
  var revs = MEND.all('reviews').filter(function(r){ return r.subject_id === pid; })
              .sort(function(a,b){ return (b.created_at || '').localeCompare(a.created_at || ''); });

  var h = '<button class="link" data-back="find" style="margin-bottom:18px">' +
      esc(T('pitso.prof.back')) + '</button>' +
    '<h2 style="font-size:1.75rem">' + esc(p.display_name) + '</h2>' +
    /* Before the standing, before the trade, before the price. If MEND has
       taken this listing down, that is the first thing about it that is true,
       and the person it happened to is entitled to read it here rather than
       work it out from a listing that has silently stopped appearing. */
    (pp ? takedownBlock('pitso_providers', pid) : '') +
    standingLine(st) + verifiedBadges(pid) +
    '<div class="trade">' + (pp ? '<b>' + esc(tradeName(pp.trade_code)) + '</b> · ' +

    (pp ? '<div class="price"><b>' + esc(rateLine(pp)) + '</b>' +
          (pp.available ? '' : ' · ' + esc(T('pitso.prof.notaking'))) + '</div>' : '') +
    '<hr class="rule">';

  /* Standing across all three platforms — the whole argument of the spine.
     The other two names are LINKS. A claim that a standing is portable, printed
     next to a number a reader cannot follow anywhere, is just a claim. */
  /* '<n> jobs on <a>Mafisa</a>' used to be built out of two English fragments
     either side of a link. It is now one string with the link as a named hole,
     because the words move around the name in Sesotho. */
  var xlink = function(host, label){
    return '<a href="' + host + '" rel="noopener" target="_blank">' + esc(label) + '</a>';
  };
  h += '<h3>' + esc(T('rep.standing')) + '</h3>' +
    '<p class="sec small" style="margin-top:6px">' + esc(T('pitso.prof.carried')) + '</p>' +
    '<div class="tally">' +
      '<div><div class="n">' + st.pitso_completed   + '</div><div class="l">' +
        esc(T('pitso.prof.jobs_here')) + '</div></div>' +
      '<div><div class="n">' + st.mafisa_completed  + '</div><div class="l">' +
        tHtml('pitso.prof.jobs_on', { platform: xlink(CROSS.mafisa, T('mafisa.name')) }) + '</div></div>' +
      '<div><div class="n">' + st.matsema_completed + '</div><div class="l">' +
        tHtml('pitso.prof.jobs_on', { platform: xlink(CROSS.matsema, T('matsema.name')) }) + '</div></div>' +
      '<div><div class="n">' + (st.rating != null ? st.rating.toFixed(2) : '—') + '</div><div class="l">' +
        esc(T('pitso.prof.avg_of', { n: st.review_count })) + '</div></div>' +
    '</div>' +
    '<p class="sec small" style="margin-top:12px">' + esc(T('pitso.prof.cross')) + '</p>' +
    '<hr class="rule">';

  /* ---- what a stranger may know about disagreements ---------------------
     COUNTS AND NOTHING ELSE. An accusation is not a finding, and putting the

     rumour. The screen says so in words rather than leaving it implied. */
  var ds = MEND.disputeStanding(pid);
  h += '<h3>' + esc(T('pitso.disp.standing')) + '</h3>';
  if (!ds.open && !ds.resolved) {
    h += '<p class="sec small" style="margin-top:6px">' + esc(T('pitso.disp.none_ever')) + '</p>';
  } else {
    h += '<div class="tally" style="margin-top:10px">' +
      '<div><div class="n">' + ds.open + '</div><div class="l">' + esc(T('pitso.disp.open_n')) + '</div></div>' +
      '<div><div class="n">' + ds.resolved + '</div><div class="l">' + esc(T('pitso.disp.settled_n')) + '</div></div>' +
    '</div>';
    if (ds.open_recent)
      h += '<p class="sec small" style="margin-top:10px">' + esc(T('pitso.disp.recent', { n: ds.open_recent })) + '</p>';
  }
  h += '<p class="sec small" style="margin-top:10px">' + esc(T('dispute.count_only')) + '</p>' +

  h += '<h3>' + esc(T('pitso.prof.checked')) + '</h3>' +

          var v = docVerdict(d);
          return '<li><span class="mark ' + v.cls + '">' + v.mark + '</span><span class="break">' + esc(v.text) + '</span></li>';
        }).join('') + '</ul>'
      : '<p class="sec small">' + esc(T('pitso.prof.nothing_sent')) + '</p>') +
    '<hr class="rule">';

  h += '<h3>' + esc(T('pitso.prof.said')) + '</h3>' +
    (revs.length
      ? revs.map(function(r){
          return '<div class="review"><span class="stars">' + esc(MEND.star(r.rating)) + '</span>' +
            '<div class="body">' + esc(r.body || '') + '</div>' +
            '<div class="by">' + esc(name(r.author_id)) + ' · ' + MEND.fmtDate(dayOf(r.created_at)) + '</div></div>';
        }).join('')
      : '<p class="sec small">' + esc(T('pitso.prof.noreviews')) + '</p>');

  /* This person can leave the app as text or as paper. A tradesperson with no
     smartphone is still findable if somebody else can paste him into a group. */
  h += '<div class="btnrow" data-noprint style="margin-top:18px">' +
    '<button class="btn ghost small" data-share-provider="' + esc(pid) + '">' + esc(T('ui.share')) + '</button>' +
    '<button class="btn ghost small" data-print-provider="' + esc(pid) + '">' + esc(T('ui.print')) + '</button>' +
  '</div>';

  if (pp) {
    h += '<div class="btnrow"><button class="btn clay" data-hire="' + esc(pp.trade_code) + '">' +
         esc(T('pitso.prof.hire', { trade: tradeName(pp.trade_code).toLowerCase() })) + '</button></div>' +
         '<p class="tiny sec" style="margin-top:10px">' + esc(T('pitso.prof.noqueue')) + '</p>';
    /* Last on the page and the quietest thing on it. */
    h += reportBlock('pitso_providers', pid);
  }
  return h;
}

function submitRequest(e){
  e.preventDefault();
  if (refuseWrite()) return;
  var meP = MEND.me();
  if (!meP) { state.flash = T('pitso.err.signin.post'); return render(); }
  var vals = {
    trade: $('#q-trade').value,
    district: $('#q-dist').value,
    title: $('#q-title').value.trim(),
    description: $('#q-desc').value.trim(),
    needed_by: $('#q-by').value || null,
    budget: $('#q-budget').value
  };
  var errs = {};
  if (!vals.trade) errs.trade = T('pitso.err.pick.trade');
  if (!vals.district) errs.district = T('pitso.err.pick.district');
  if (vals.title.length < 4 || vals.title.length > 120) errs.title = T('pitso.err.title.len');
  var cents = toCents(vals.budget);
  if (isNaN(cents)) errs.budget = T('pitso.err.quote');
  if (vals.needed_by && vals.needed_by < MEND.today()) errs.needed_by = T('pitso.err.date.past');

  $$('#postform .field').forEach(function(fd){
    var k = fd.getAttribute('data-f'), box = $('.err', fd);
    if (errs[k]) { fd.classList.add('bad'); box.textContent = errs[k]; box.classList.remove('hidden'); }
    else { fd.classList.remove('bad'); box.textContent = ''; box.classList.add('hidden'); }
  });
  if (Object.keys(errs).length) { var first = $('#postform .field.bad'); if (first) first.scrollIntoView({block:'center'}); return; }

  var row = MEND.insert('pitso_requests', {
    requester_id: meP.id, trade_code: vals.trade, district: vals.district,
    title: vals.title, description: vals.description || null,
    needed_by: vals.needed_by, budget_cents: cents, state: 'open'
  });
  rec('pitso.request.posted', {
    platform:'pitso', subject_table:'pitso_requests', subject_id: row.id,
    payload:{ trade_code: row.trade_code, district: row.district, budget_cents: row.budget_cents }
  });
  state.postPrefill = null;
  state.flash = MEND.claimed(T('pitso.post.done',
    { trade: tradeName(vals.trade).toLowerCase(), district: vals.district }));
  go('requests');
}

/* =========================================================================
   VIEW 4 — OPEN REQUESTS (the board)
   ========================================================================= */
function offersFor(rid){ return MEND.all('pitso_offers').filter(function(o){ return o.request_id === rid; }); }

function requestEntry(q, opts){
  opts = opts || {};
  /* Nobody may be signed in at all in connected mode until they sign in, so
     this must survive a null me() rather than throwing on .id. */
  var meP = MEND.me() || {};
  var offers = offersFor(q.id);
  var live = offers.filter(function(o){ return o.state === 'offered'; });
  var mine = !!meP.id && q.requester_id === meP.id;
  var myOffer = meP.id ? offers.filter(function(o){ return o.provider_id === meP.id; })[0] : null;
  var overdue = q.needed_by && q.needed_by < MEND.today();

  var h = '<li>' +
    '<div class="rtitle">' + esc(q.title) + syncMark(q) + '</div>' +
    /* A takedown sets pitso_requests.state to 'withdrawn', which drops the row
       out of the open list entirely. The person who posted it still sees it
       here under My work, and this is where they find out what happened —
       there is nowhere else they could. */
    takedownBlock('pitso_requests', q.id) +
    '<div class="meta">' +
      '<span><b>' + esc(tradeName(q.trade_code)) + '</b></span>' +
      '<span>' + esc(q.district) + '</span>' +
      '<span' + (overdue ? ' class="muted"' : '') + '>' + esc(T('pitso.neededby')) + ' ' + MEND.fmtDate(q.needed_by) + '</span>' +
      '<span>' + esc(T('pitso.budget')) + ' ' +
        esc(moneyOrPhrase(q.budget_cents, T('pitso.openbudget'))) + '</span>' +
    '</div>' +
    /* 'Posted by <link>' is one string with the name as a hole — the words sit
       on the other side of the name in Sesotho. */
    '<div class="small sec" style="margin-top:6px">' +
      tHtml('pitso.req.postedby', {
        name: mine ? esc(T('pitso.disp.you'))
                   : '<a class="link" href="#" data-profile="' + esc(q.requester_id) + '">' +
                     esc(name(q.requester_id)) + '</a>',
        date: esc(MEND.fmtDate(dayOf(q.created_at)))
      }) + '</div>' +
    (q.description ? '<div class="desc">' + esc(q.description) + '</div>' : '');

  if (q.state === 'engaged') {
    h += '<div class="offercount">' + esc(T('pitso.req.taken')) + '</div>';
  } else {
    h += live.length
      ? '<div class="offercount">' + esc(countWord(live.length, 'pitso.req.oneoffer', 'pitso.req.noffers')) + '</div>'
      : '<div class="offercount none">' + esc(T('pitso.nooffers')) + '</div>';
  }

  if (mine) {
    /* the requester sees the offers themselves and can accept one */
    if (live.length) {
      h += '<div style="margin-top:12px">' + live.map(function(o){ return offerCard(o, q); }).join('') + '</div>';
    }
  } else if (q.state === 'open' && meP.id) {
    if (myOffer) {
      h += '<div class="card quiet" style="margin-top:12px"><div class="small"><b>' +
        esc(T('pitso.req.youroffer')) + '</b> ' +
        esc(moneyOrPhrase(offerAmount(myOffer), T('pitso.req.willquote'))) +
        ' · ' + esc(stateWord(myOffer.state)) + syncMark(myOffer) + '</div>' +
        (myOffer.message ? '<div class="small sec break" style="margin-top:6px">' + esc(myOffer.message) + '</div>' : '') +
        '</div>';
    } else if (opts.allowOffer !== false) {
      h += (state.openForm === q.id
        ? offerForm(q)
        : ifWritable('<div class="btnrow"><button class="btn ghost small" data-offer="' + esc(q.id) + '">' +
                     esc(T('pitso.offer')) + '</button></div>'));
    }
  }
  /* An open request is a notice. It has to be able to reach the people who are
     in the WhatsApp group and not on this page. */
  h += '<div class="btnrow" data-noprint>' +
    '<button class="btn ghost small" data-share-request="' + esc(q.id) + '">' + esc(T('ui.share')) + '</button>' +
    '<button class="btn ghost small" data-print-request="' + esc(q.id) + '">' + esc(T('ui.print')) + '</button>' +
  '</div>';
  /* Not on your own request: reporting yourself to the desk is not a thing
     anybody wants to do, and the offer to would only be noise. */
  if (!mine) h += reportBlock('pitso_requests', q.id);
  return h + '</li>';
}

    '<div class="price"><b>' + esc(moneyOrPhrase(offerAmount(o), T('pitso.req.willquote_b'))) + '</b>' + syncMark(o) + '</div>' +

function viewRequests(){
  var qs = MEND.all('pitso_requests').filter(function(q){ return q.state === 'open' || q.state === 'engaged'; })
    .sort(function(a,b){ return (b.created_at || '').localeCompare(a.created_at || ''); });

               : '<p class="muted">' + esc(T('pitso.empty.requests')) + '</p>');
