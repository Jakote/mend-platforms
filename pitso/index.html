function submitOffer(form){
  if (refuseWrite()) return;
  var qid = form.getAttribute('data-offerform');
  var q = MEND.all('pitso_requests').filter(function(x){ return x.id === qid; })[0];
  var meP = MEND.me();
  if (!q || q.state !== 'open') { state.flash = T('pitso.err.offer.closed'); return render(); }
  if (q.requester_id === meP.id) { state.flash = T('pitso.err.offer.own'); return render(); }

  var quote = $('#o-quote', form).value;
  var msg = $('#o-msg', form).value.trim();
  var cents = toCents(quote);
  var errs = {};
  if (isNaN(cents)) errs.quote = T('pitso.err.quote');
  if (msg.length < 4) errs.message = T('pitso.err.saysomething');
  $$('.field', form).forEach(function(fd){
    var k = fd.getAttribute('data-f'), box = $('.err', fd);
    if (errs[k]) { fd.classList.add('bad'); box.textContent = errs[k]; box.classList.remove('hidden'); }
    else { fd.classList.remove('bad'); box.textContent=''; box.classList.add('hidden'); }
  });
  if (Object.keys(errs).length) return;

  /* one offer per provider per job — the unique constraint in 002_platforms.sql */
  if (offersFor(qid).some(function(o){ return o.provider_id === meP.id; })) {
    state.flash = T('pitso.err.offer.twice'); state.openForm = null; return render();
  }
  var o = MEND.insert('pitso_offers', {
    request_id: qid, provider_id: meP.id, quote_cents: cents, message: msg, state: 'offered'
  });
  rec('pitso.offer.made', {
    platform:'pitso', subject_table:'pitso_offers', subject_id: o.id,
    payload:{ request_id: qid, quote_cents: o.quote_cents }
  });
  state.openForm = null;
  /* Tell the person who posted it. Nothing did, so an offer arrived and the
     only way to discover it was to go looking. */
  MEND.notify(q.requester_id, 'offer_made', 'notif.offer_made',
              { name: name(meP.id), title: q.title },
              { platform: 'pitso', table: 'pitso_offers', id: o.id });
  state.flash = MEND.claimed(T('pitso.req.offersent', { name: name(q.requester_id) }));
  render();
}

function acceptOffer(oid){
  if (refuseWrite()) return;
  var o = MEND.all('pitso_offers').filter(function(x){ return x.id === oid; })[0];
  if (!o) return;
  var q = MEND.all('pitso_requests').filter(function(x){ return x.id === o.request_id; })[0];
  var meP = MEND.me();
  if (!q || q.requester_id !== meP.id) { state.flash = T('pitso.err.accept.owner'); return render(); }
  if (q.state !== 'open') { state.flash = T('pitso.err.taken'); return render(); }

  MEND.update('pitso_offers', o.id, { state:'accepted' });
  offersFor(q.id).forEach(function(other){
    if (other.id !== o.id && other.state === 'offered') MEND.update('pitso_offers', other.id, { state:'declined' });
  });
  MEND.update('pitso_requests', q.id, { state:'engaged' });

  /* agreed_cents comes from offerAmount() — the same function that printed the
     number on screen. One figure, one source. */
  var eng = MEND.insert('engagements', {
    platform:'pitso', provider_id:o.provider_id, counterparty_id:q.requester_id,
    subject_table:'pitso_offers', subject_id:o.id, state:'agreed',
    agreed_cents: offerAmount(o), currency:'LSL',
    settled_by_provider:false, settled_by_counterparty:false,
    started_on: MEND.today(), ended_on: null
  });
  rec('pitso.offer.accepted', {
    platform:'pitso', subject_table:'engagements', subject_id: eng.id,
    payload:{ offer_id:o.id, request_id:q.id, agreed_cents: eng.agreed_cents }
  });
  MEND.notify(o.provider_id, 'offer_accepted', 'notif.offer_accepted',
              { name: name(meP.id), title: q.title },
              { platform: 'pitso', table: 'pitso_offers', id: o.id });
  state.flash = MEND.claimed(T('pitso.req.accepted', { name: name(o.provider_id) }));
  go('mine');
}


/* =========================================================================
   WHEN IT GOES WRONG — and the platform does not decide who is right

   MEND GROUP is not a court. What Pitso does instead is worth more than a
   verdict it has no standing to give: it holds BOTH accounts, dated, and
   neither can be revised once given. Most disagreements between people who
   have to keep living in the same district end the moment both accounts are
   written down and neither can be quietly changed afterwards.

   Nothing on this screen may read as a finding. No side is marked right, no
   claim is scored, and the word "verdict" appears nowhere. The one thing that
   closes it is BOTH of them accepting the same written outcome.
   ========================================================================= */

/* MEND.canDispute and MEND.canReview are the only places these rules live.
   This maps core's English answer onto Sesotho and nothing else — a miss shows
   the English, which is degraded but never wrong. */
function disputeReason(msg){
  if (!msg) return msg;
  var m = String(msg);
  if (/^sign in first/.test(m))                          return T('pitso.disp.err.signin');
  if (/^no such job/.test(m))                            return T('pitso.disp.err.nojob');
  if (/has not been agreed yet/.test(m))                 return T('pitso.disp.err.notagreed');
  if (/only the two people in this job/.test(m))         return T('pitso.disp.err.notparty');
  if (/^that is you/.test(m))                            return T('pitso.disp.err.self');
  if (/was not part of this job/.test(m))                return T('pitso.disp.err.notinjob');
  if (/say what went wrong/.test(m))                     return T('pitso.disp.err.claim');
  if (/write a little more than that/.test(m))           return T('pitso.disp.err.stmt');
  if (/^no such dispute/.test(m))                        return T('pitso.disp.err.nodispute');
  if (/only the two people in this dispute/.test(m))     return T('pitso.disp.err.notyours');
  return m;
}

/* "May I raise anything here at all?", asked before a word has been typed.
   canDispute checks the CLAIM as well as the structure, so a stand-in clears
   that one check and leaves only the structural answers. The real claim is put
   through canDispute again at the moment of writing — this is the question the
   screen asks, not the gate the write goes through. */
var CLAIM_PROBE = '..........';
function disputeGate(e, other){
  return MEND.canDispute(e.id, { against: other, claim: CLAIM_PROBE });
}

/* Both accounts, in the order they were given, each with its date and the name
   of whoever wrote it. Two columns on a screen wide enough for them, stacked in
   the same order on one that is not. Numbered, because this is a record. */
function accountsList(d){
  if (!d.statements.length)
    return '<p class="small sec" style="margin-top:10px">' + esc(T('pitso.disp.nothing_said')) + '</p>';
  return '<div class="accounts">' +
    '<div class="acchead">' +
      '<div class="acclabel">' + esc(name(d.raised_by)) + ' · ' + esc(T('pitso.disp.side.raiser')) + '</div>' +
      '<div class="acclabel">' + esc(name(d.against))   + ' · ' + esc(T('pitso.disp.side.other')) + '</div>' +
    '</div>' +
    '<ol class="entries">' + d.statements.map(function(st, i){
      var side = st.author_id === d.raised_by ? 'a' : 'b';
      return '<li data-side="' + side + '">' +
        '<div class="top">' +
          '<span class="n">' + (i + 1) + '</span>' +
          '<span class="nm">' + esc(name(st.author_id)) + '</span>' +
          '<span class="role">' + esc(side === 'a' ? T('pitso.disp.side.raiser') : T('pitso.disp.side.other')) + '</span>' +
          '<span class="dt">' + esc(MEND.fmtDate(dayOf(st.created_at))) + '</span>' +
        '</div>' +
        '<div class="say break">' + esc(st.body) + '</div>' +
      '</li>';
    }).join('') + '</ol></div>';
}

/* The form that raises it. The refusal, when there is one, is printed in words
   above — never a greyed-out button a person is left to guess at. */
function raiseForm(e, other){
  return '<form class="card quiet" data-raiseform="' + esc(e.id) + '" style="margin-top:12px" novalidate>' +
    '<h4 style="font-size:1.0625rem">' + esc(T('pitso.disp.raise_head')) + '</h4>' +
    '<p class="tiny sec" style="margin-top:4px">' + esc(T('pitso.disp.about_person', { name: name(other) })) + '</p>' +
    '<div class="noverdict">' + esc(T('dispute.no_verdict')) + '</div>' +
    (state.disputeErr ? '<div class="note" style="margin:10px 0 0"><b>' + esc(T('app.no')) + '</b> — ' +
                        esc(state.disputeErr) + '</div>' : '') +
    '<div class="field" style="margin-top:14px"><label class="fl" for="d-kind">' +
      esc(T('dispute.what_kind')) + '</label>' +
      '<select id="d-kind">' + MEND.DISPUTE_KINDS.map(function(k){
        return '<option value="' + esc(k) + '">' + esc(T('dispute.k.' + k)) + '</option>';
      }).join('') + '</select></div>' +
    '<div class="field"><label class="fl" for="d-claim">' + esc(T('dispute.claim')) + '</label>' +
      '<textarea id="d-claim" maxlength="2000"></textarea></div>' +
    '<div class="field"><label class="fl" for="d-amount">' + esc(T('dispute.amount')) + '</label>' +
      '<input type="number" id="d-amount" min="0" step="1" inputmode="decimal">' +
      '<div class="hint">' + esc(T('pitso.disp.amount_hint')) + '</div></div>' +
    /* Said before they type and again before they send. It is true, and a
       person is entitled to know it while they still have the choice. */
    '<div class="note"><b>' + esc(T('dispute.final')) + '</b></div>' +
    '<div class="btnrow"><button type="submit" class="btn clay">' + esc(T('pitso.disp.send_claim')) + '</button>' +
      '<button type="button" class="btn ghost" data-cancel="1">' + esc(T('app.cancel')) + '</button></div>' +
  '</form>';
}

function statementForm(d){
  return '<form class="card quiet" data-stmtform="' + esc(d.id) + '" style="margin-top:12px" novalidate>' +
    '<div class="field"><label class="fl" for="d-body">' + esc(T('dispute.add_reply')) + '</label>' +
      '<textarea id="d-body" maxlength="4000"></textarea></div>' +
    (state.disputeErr ? '<div class="note"><b>' + esc(T('app.no')) + '</b> — ' + esc(state.disputeErr) + '</div>' : '') +
    '<div class="note"><b>' + esc(T('dispute.final')) + '</b></div>' +
    '<div class="btnrow"><button type="submit" class="btn">' + esc(T('pitso.disp.send_stmt')) + '</button>' +
      '<button type="button" class="btn ghost" data-cancel="1">' + esc(T('app.cancel')) + '</button></div>' +
  '</form>';
}

/* The outcome. EITHER of them writes what was agreed; each accepts only their
   own side; it closes when both have.

   Deliberately, once the outcome is written there is no path here that sends
   different text: MEND.acceptOutcome overwrites `outcome` with whatever it is
   given while keeping the acceptance the other party already gave, so a second
   party passing new words would close the record on a sentence the first party
   never agreed to. The second party can only accept it as written, or write
   another account and leave it open. */
function outcomeBlock(d, meId){
  var iAmRaiser = d.raised_by === meId;
  var mine   = iAmRaiser ? d.outcome_agreed_by_raiser : d.outcome_agreed_by_other;
  var theirs = iAmRaiser ? d.outcome_agreed_by_other  : d.outcome_agreed_by_raiser;
  var other  = iAmRaiser ? d.against : d.raised_by;
  var h = '<div class="outcome"><h4>' + esc(T('dispute.outcome')) + '</h4>';

  if (d.state === 'resolved' && d.both_accepted) {
    return h + '<div class="agreed break">' + esc(d.outcome) + '</div>' +
      '<div class="where">' + esc(T('dispute.closed_on',
        { date: MEND.fmtDate(dayOf(d.closed_at) || MEND.today()) })) + '</div></div>';
  }

  if (!String(d.outcome || '').trim()) {
    h += '<p class="small sec" style="margin-top:6px">' + esc(T('pitso.disp.outcome_none')) + '</p>' +
      '<p class="small sec">' + esc(T('dispute.both_accept')) + '</p>';
    h += (state.openForm === 'out-' + d.id
      ? outcomeForm(d)
      : ifWritable('<div class="btnrow"><button class="btn ghost small" data-outcome="' + esc(d.id) + '">' +
                   esc(T('pitso.disp.write_outcome')) + '</button></div>'));
    return h + '</div>';
  }

  h += '<div class="agreed break">' + esc(d.outcome) + '</div>';
  if (mine) {
    h += '<div class="where">' + esc(T('dispute.you_accepted')) + '</div>' +
         '<div class="where">' + esc(T('dispute.waiting_them')) + '</div>';
  } else {
    if (theirs) h += '<div class="where">' + esc(T('dispute.both_accept')) + '</div>';
    h += '<p class="small sec" style="margin-top:8px">' + esc(T('pitso.disp.outcome_fixed')) + '</p>' +
      ifWritable('<div class="btnrow"><button class="btn small" data-acceptout="' + esc(d.id) + '">' +
                 esc(T('pitso.disp.accept_asis')) + '</button></div>');
  }
  return h + '</div>';
}

function outcomeForm(d){
  return '<form class="card" data-outcomeform="' + esc(d.id) + '" style="margin-top:12px" novalidate>' +
    '<div class="field"><label class="fl" for="d-out">' + esc(T('dispute.outcome')) + '</label>' +
      '<textarea id="d-out" maxlength="2000"></textarea></div>' +
    (state.disputeErr ? '<div class="note"><b>' + esc(T('app.no')) + '</b> — ' + esc(state.disputeErr) + '</div>' : '') +
    '<div class="note">' + esc(T('dispute.both_accept')) + '</div>' +
    '<div class="btnrow"><button type="submit" class="btn">' + esc(T('pitso.disp.write_accept')) + '</button>' +
      '<button type="button" class="btn ghost" data-cancel="1">' + esc(T('app.cancel')) + '</button></div>' +
  '</form>';
}

function disputeCard(d, meId){
  var iAmParty = d.raised_by === meId || d.against === meId;
  var last = d.statements[d.statements.length - 1];
  var closed = d.state === 'resolved';
  var h = '<div class="dispute">' +
    '<span class="dstamp' + (closed ? ' done' : '') + '">' +
      esc(T(closed ? 'dispute.resolved' : (d.state === 'answered' ? 'dispute.answered' : 'dispute.open'))) +
    '</span>' +
    '<div class="kind">' + esc(T('dispute.k.' + d.kind)) + '</div>' +
    '<div class="raisedby">' + esc(T('pitso.disp.raised_on',
      { date: MEND.fmtDate(dayOf(d.created_at)), name: name(d.raised_by) })) + '</div>' +
    (d.amount_cents != null
      ? '<div class="amt">' + esc(T('pitso.disp.amount_line', { amount: MEND.M(d.amount_cents) })) + '</div>'
      : '') +
    /* The principle, on the screen, every time. */
    '<div class="noverdict">' + esc(T('dispute.no_verdict')) + '</div>' +
    '<div class="acclabel" style="margin-top:16px">' + esc(T('pitso.disp.accounts')) + '</div>' +
    accountsList(d);

  if (iAmParty && !closed) {
    if (last && last.author_id !== meId)
      h += '<p class="small" style="margin-top:12px"><b>' + esc(T('dispute.your_turn')) + '</b></p>';
    h += (state.openForm === 'stmt-' + d.id
      ? statementForm(d)
      : ifWritable('<div class="btnrow"><button class="btn ghost small" data-statement="' + esc(d.id) + '">' +
                   esc(T('dispute.add_reply')) + '</button></div>'));
  }
  if (iAmParty) h += outcomeBlock(d, meId);
  return h + '</div>';
}

function disputeBlock(e, meId){
  var other = e.provider_id === meId ? e.counterparty_id : e.provider_id;
  var list = MEND.disputeFor(e.id);
  var open = list.filter(function(d){ return d.state !== 'resolved' && d.state !== 'withdrawn'; });
  var h = list.map(function(d){ return disputeCard(d, meId); }).join('');

  if (open.length) {
    h += '<p class="tiny sec" style="margin-top:10px">' + esc(T('pitso.disp.already_open')) + '</p>';
    return h;
  }
  var why = disputeGate(e, other);
  if (why) {
    /* The refusal, in words. Never a dead button. */
    return h + '<div class="small sec" style="margin-top:14px">' +
      esc(T('pitso.disp.cannot', { why: disputeReason(why) })) + '</div>';
  }
  return h + (state.openForm === 'disp-' + e.id
    ? raiseForm(e, other)
    : ifWritable('<div class="btnrow"><button class="btn ghost small" data-dispute="' + esc(e.id) + '">' +
                 esc(T('dispute.raise_about')) + '</button></div>'));
}

function submitRaise(form){
  if (refuseWrite()) return;
  var eid = form.getAttribute('data-raiseform');
  var e = MEND.all('engagements').filter(function(x){ return x.id === eid; })[0];
  var meP = MEND.me();
  if (!e || !meP) return;
  var other = e.provider_id === meP.id ? e.counterparty_id : e.provider_id;
  var cents = toCents($('#d-amount', form).value);
  var spec = {
    against: other,
    kind: $('#d-kind', form).value,
    claim: $('#d-claim', form).value.trim(),
    amount_cents: isNaN(cents) ? null : cents
  };
  /* Ask the gate with the REAL claim before writing, and show what it said. */
  var why = MEND.canDispute(eid, spec);
  if (why) { state.disputeErr = disputeReason(why); return render(); }
  try {
    MEND.raiseDispute(eid, spec);
  } catch (err) { state.disputeErr = disputeReason(err.message); return render(); }
  state.disputeErr = null; state.openForm = null;
  state.flash = T('pitso.disp.flash.raised', { name: name(other) });
  render();
}

function submitStatement(form){
  if (refuseWrite()) return;
  var did = form.getAttribute('data-stmtform');
  try {
    MEND.addStatement(did, $('#d-body', form).value.trim());
    rec('dispute.statement', { platform:'pitso', subject_table:'disputes', subject_id: did, payload:{} });
  } catch (err) { state.disputeErr = disputeReason(err.message); return render(); }
  state.disputeErr = null; state.openForm = null;
  state.flash = T('pitso.disp.flash.stmt');
  render();
}

function submitOutcome(form){
  if (refuseWrite()) return;
  var did = form.getAttribute('data-outcomeform');
  var text = $('#d-out', form).value.trim();
  if (text.length < 5) { state.disputeErr = T('pitso.disp.err.stmt'); return render(); }
  acceptTheOutcome(did, text);
}

/* One function writes an acceptance, whether it is the first (which carries the
   words) or the second (which must not). */
function acceptTheOutcome(did, text){
  var meP = MEND.me();
  var before = MEND.all('disputes').filter(function(x){ return x.id === did; })[0];
  var other = before ? (before.raised_by === (meP && meP.id) ? before.against : before.raised_by) : null;
  try {
    MEND.acceptOutcome(did, text || null);
  } catch (err) { state.disputeErr = disputeReason(err.message); return render(); }
  var after = MEND.all('disputes').filter(function(x){ return x.id === did; })[0];
  state.disputeErr = null; state.openForm = null;
  state.flash = (after && after.state === 'resolved')
    ? T('pitso.disp.flash.closed')
    : T('pitso.disp.flash.mine', { name: other ? name(other) : '' });
  render();
}

/* =========================================================================
   VIEW 5 — MY WORK
   ========================================================================= */
function engagementEntry(e){
  var meP = MEND.me();
  var iAmProvider = e.provider_id === meP.id;
  var other = iAmProvider ? e.counterparty_id : e.provider_id;
  /* One source. These used to read e.settled_by_*, while the settlement block
     lower down read the settlements table, and the two contradicted each other
     on screen for every finished job in the seed. */
  var settled = MEND.settledState(e, meP.id);
  var mySettled = settled.mine;
  var bothSettled = settled.both;

  var h = '<div class="card">' +
    '<div class="small sec"><b>' + esc(e.platform.toUpperCase()) + '</b> · ' +
      esc(stateWord(e.state)) + syncMark(e) + '</div>' +
    '<div class="rtitle" style="font-size:1.0625rem; margin-top:6px">' +
      tHtml(iAmProvider ? 'pitso.mine.workfor' : 'pitso.mine.workby', {
        name: '<a class="link" href="#" data-profile="' + esc(other) + '">' + esc(name(other)) + '</a>'
      }) + '</div>' +
    '<div class="meta"><span>' + esc(T('pitso.agreed')) + ' ' +
      esc(moneyOrPhrase(e.agreed_cents, T('pitso.mine.nofigure'))) + '</span>' +
      (e.started_on ? '<span>' + esc(T('pitso.mine.started', { date: MEND.fmtDate(e.started_on) })) + '</span>' : '') +
      (e.ended_on ? '<span>' + esc(T('pitso.mine.ended', { date: MEND.fmtDate(e.ended_on) })) + '</span>' : '') + '</div>';

  /* completion */
  if (e.state === 'agreed' || e.state === 'active') {
    h += ifWritable('<div class="btnrow"><button class="btn small" data-complete="' + esc(e.id) + '">' +
                    esc(T('pitso.complete')) + '</button></div>');
  }

  /* settlement — v1 RECORDS money, it never MOVES money */
  if (e.agreed_cents != null) {
    if (bothSettled) {
      h += '<div class="note ok" style="margin-top:12px">' +
        esc(T('pitso.settle.bothsaid', { amount: MEND.M(e.agreed_cents) })) + '</div>';
    } else {
      h += '<div class="note" style="margin-top:12px">' +
        esc(mySettled
          ? T('pitso.settle.waitother', { name: name(other) })
          : T(iAmProvider ? 'pitso.settle.oncepaid.p' : 'pitso.settle.oncepaid.c', { name: name(other) })) +
        '</div>';
      if (!mySettled) {
        h += ifWritable('<div class="btnrow"><button class="btn ghost small" data-settle="' + esc(e.id) + '">' +
                        esc(T('pitso.mine.marksettled')) + '</button></div>');
      }
    }
  }

  /* The itemised payment record: method, amount, day, and the transaction code.
     Separate from the coarse settled_by_* flags above, which say only "I think
     we are square"; this says what actually moved and carries the code that
     settles an argument a year later. */
  h += settleBlock(e, meP.id);

  /* review — ALWAYS through MEND.canReview, and the refusal is shown as written */
  var reason = MEND.canReview(e.id, meP.id, other);
  if (reason === null) {
    h += (state.openForm === 'rev-' + e.id
      ? reviewForm(e, other)
      : ifWritable('<div class="btnrow"><button class="btn clay small" data-review="' + esc(e.id) + '">' +
                   esc(T('pitso.mine.reviewbtn')) + '</button></div>'));
  } else {
    h += '<div class="small sec" style="margin-top:12px">' +
         esc(T('pitso.mine.reviewno', { why: reason })) + '</div>';
  }

  /* When it goes wrong. The platform does not decide who is right; it holds
     both accounts. This is the last block on the card on purpose — it is the
     thing you reach for after everything above it has failed. */
  h += disputeBlock(e, meP.id);

  return h + '</div>';
}

function reviewForm(e, other){
  var r = state.rating || 0;
  var stars = '';
  for (var i = 1; i <= 5; i++) {
    stars += '<button type="button" data-rate="' + i + '" aria-pressed="' + (r === i) +
      '" aria-label="' + esc(T('pitso.mine.rating_aria', { n: i })) + '">' +
      (i <= r ? '★' : '☆') + '</button>';
  }
  return '<form class="card quiet" data-reviewform="' + esc(e.id) + '" style="margin-top:12px" novalidate>' +
    '<h4 style="font-size:1.0625rem">' + esc(T('pitso.mine.reviewing', { name: name(other) })) + '</h4>' +
    '<p class="tiny sec" style="margin-top:4px">' + esc(T('pitso.mine.rev_final')) + '</p>' +
    '<div class="field" data-f="rating"><label class="fl">' + esc(T('pitso.mine.outof5')) + '</label>' +
      '<div class="ratepick">' + stars + '</div><div class="err hidden"></div></div>' +
    '<div class="field" data-f="body"><label class="fl" for="rv-body">' + esc(T('pitso.mine.whathappened')) + '</label>' +
      '<textarea id="rv-body" maxlength="1200" placeholder="' + esc(T('pitso.mine.rev_ph')) + '"></textarea>' +
      '<div class="err hidden"></div></div>' +
    '<div class="btnrow"><button type="submit" class="btn">' + esc(T('pitso.mine.leaverev')) + '</button>' +
      '<button type="button" class="btn ghost" data-cancel="1">' + esc(T('app.cancel')) + '</button></div>' +
  '</form>';
}

function submitReview(form){
  if (refuseWrite()) return;
  var eid = form.getAttribute('data-reviewform');
  var e = MEND.all('engagements').filter(function(x){ return x.id === eid; })[0];
  var meP = MEND.me();
  if (!e) return;
  var other = e.provider_id === meP.id ? e.counterparty_id : e.provider_id;

  /* the gate is re-asked at the moment of writing, not only at render */
  var reason = MEND.canReview(eid, meP.id, other);
  if (reason !== null) { state.flash = T('pitso.err.review.no', { why: reason }); state.openForm = null; return render(); }

  var body = $('#rv-body', form).value.trim();
  var errs = {};
  if (!state.rating) errs.rating = T('pitso.err.rate');
  if (body.length < 4) errs.body = T('pitso.err.reviewbody');
  if (body.length > 1200) errs.body = T('pitso.err.reviewlong');
  $$('.field', form).forEach(function(fd){
    var k = fd.getAttribute('data-f'), box = $('.err', fd);
    if (errs[k]) { fd.classList.add('bad'); box.textContent = errs[k]; box.classList.remove('hidden'); }
    else { fd.classList.remove('bad'); box.textContent=''; box.classList.add('hidden'); }
  });
  if (Object.keys(errs).length) return;

  var rev = MEND.insert('reviews', {
    engagement_id: eid, author_id: meP.id, subject_id: other, rating: state.rating, body: body
  });
  rec('review.left', {
    platform: e.platform, subject_table:'reviews', subject_id: rev.id,
    payload:{ engagement_id: eid, subject_id: other, rating: state.rating }
  });
  state.openForm = null; state.rating = 0;
  state.flash = T('pitso.mine.revdone', { name: name(other) });
  render();
}

/* =========================================================================
   YOUR ACCOUNT — take a copy, or go

   Two things, and the second one is where the wording has to be exact.

   The account is NOT erased in the sense a Delete button usually implies.
   Finished jobs, payments both sides confirmed, settled disagreements and the
   photographs taken when something was handed over all STAY. They are the
   other person's record as much as this one's, and if either side could
   destroy them by closing an account, none of them would be worth anything —
   which is the sentence mend_deletion_preview() returns as
   `why_those_are_kept`, and it is printed here rather than paraphrased.

   So the preview is fetched and RENDERED FIRST, and only then does a button
   that removes anything exist on the page. A Delete button that promises more
   than it delivers is worse than no Delete button.
   ========================================================================= */
function acctReason(msg){
  if (!msg) return msg;
  var m = String(msg);
  if (/needs a connection/.test(m))  return T('pitso.acct.needs_conn');
  if (/^Sign in first/.test(m))      return T('pitso.disp.err.signin');
  return m;
}

/* A key mend_deletion_preview() returns that is not named in the string table
   is shown as it comes, readably. Dropping it would quietly shrink a list a
   person is reading immediately before an irreversible act. */
function previewLabel(key){
  var k = 'pitso.acct.k.' + key;
  var s = T(k);
  return s === k ? String(key).replace(/_/g, ' ') : s;
}

function previewSide(cls, heading, obj){
  var keys = Object.keys(obj || {});
  if (!keys.length) return '';
  return '<section class="' + cls + '"><h5>' + esc(heading) + '</h5><dl>' +
    keys.map(function(k){
      return '<div class="pr"><dt>' + esc(previewLabel(k)) + '</dt>' +
             '<dd>' + esc(String(obj[k])) + '</dd></div>';
    }).join('') + '</dl></section>';
}

function exportPanel(){
  var a = state.acct;
  var h = '<div class="acct"><h4>' + esc(T('pitso.acct.copy')) + '</h4>' +
    '<p class="lead">' + esc(T('pitso.acct.copy_why')) + '</p>' +
    /* Said before they ask for it, not discovered after they open the file. */
    '<p class="lead">' + esc(T('pitso.acct.copy_nofiles')) + '</p>';
  if (a.exportErr)
    h += '<div class="note" style="margin-top:12px">' + esc(T('pitso.acct.copy_failed', { why: a.exportErr })) + '</div>';
  if (a.exporting)
    h += '<p class="lead" style="margin-top:12px">' + esc(T('pitso.acct.copy_asking')) + '</p>';
  else
    h += '<div class="btnrow"><button class="btn ghost" id="acct-export">' +
         esc(T('pitso.acct.copy')) + '</button></div>';

  if (a.exportUrl) {
    h += '<div class="note ok" style="margin-top:14px">' +
      esc(T('pitso.acct.copy_ready', { date: MEND.fmtDate(dayOf(a.exportAt)) })) + '</div>' +
      '<div class="btnrow"><a class="btn" href="' + esc(a.exportUrl) +
        '" download="mend-my-data.json">' + esc(T('pitso.acct.download')) + '</a></div>' +
      /* The download can be refused by the browser and say nothing. Same rule
         as the share box: a button that appears to do nothing is worse than
         no button, so the whole file is here to be copied by hand. */
      '<p class="lead" style="margin-top:10px">' + esc(T('pitso.acct.copy_manual')) + '</p>' +
      '<textarea class="raw" id="acct-raw" readonly aria-label="' + esc(T('pitso.acct.copy')) + '">' +
        esc(a.exportText || '') + '</textarea>';
  }
  return h + '</div>';
}

function deletePanel(){
  var a = state.acct, meP = MEND.me();
  var h = '<div class="acct"><h4>' + esc(T('pitso.acct.remove')) + '</h4>' +
    '<p class="lead">' + esc(T('pitso.acct.remove_why')) + '</p>';

  if (a.previewErr)
    h += '<div class="note" style="margin-top:12px">' + esc(a.previewErr) + '</div>';

  if (!a.preview) {
    h += a.previewing
      ? '<p class="lead" style="margin-top:12px">' + esc(T('pitso.acct.asking')) + '</p>'
      : '<div class="btnrow"><button class="btn ghost" id="acct-preview">' +
        esc(T('pitso.acct.show')) + '</button></div>';
    /* NO delete button until the preview above has been fetched and drawn. */
    return h + '</div>';
  }

  var p = a.preview;
  h += '<div class="prev">' +
    previewSide('gone',  T('pitso.acct.erased'), p.erased) +
    previewSide('stays', T('pitso.acct.kept'),   p.kept_without_your_name) +
  '</div>';
  if (p.why_those_are_kept)
    h += '<div class="keepwhy break">' + esc(p.why_those_are_kept) + '</div>';
  if (p.cannot_be_undone)
    h += '<p class="undone">' + esc(T('pitso.acct.cannot_undo')) + '</p>';

  if (a.deleting) {
    h += '<div class="note" id="acct-progress" role="status" aria-live="polite" ' +
         'style="margin-top:14px">' + esc(progressWords()) + '</div>';
    return h + '</div>';
  }

  if (a.delErr)
    h += '<div class="note" style="margin-top:14px">' + esc(T('pitso.acct.failed', { why: a.delErr })) + '</div>';

  /* Typing your own name, not a checkbox. core/mend.js passes it to
     mend_delete_me() which refuses if it does not match, so this is the real
     gate and not decoration. */
  h += '<form id="acct-delform" style="margin-top:16px" novalidate>' +
    '<div class="field"><label class="fl" for="acct-confirm">' + esc(T('pitso.acct.confirm')) + '</label>' +
      '<input type="text" id="acct-confirm" autocomplete="off">' +
      '<div class="hint">' + esc(T('pitso.acct.confirm_hint',
        { name: meP ? meP.display_name : '' })) + '</div></div>' +
    '<div class="btnrow"><button type="submit" class="btn clay">' + esc(T('pitso.acct.do_it')) + '</button>' +
      '<button type="button" class="btn ghost" id="acct-cancel">' + esc(T('app.cancel')) + '</button></div>' +
  '</form>';
  return h + '</div>';
}

function progressWords(){
  var pr = state.acct.progress;
  return pr && pr.step === 'files'
    ? T('pitso.acct.working', { done: pr.done, total: pr.total })
    : T('pitso.acct.record');
}

/* core/mend.js deletes the files ONE AT A TIME, so onProgress can fire once per
   file. A full render each time would rebuild this whole long page that many
   times, on a phone already busy with the deletes themselves. Only this one
   line moves, and it is a live region so a screen reader hears it change. */
function paintProgress(){
  var box = $('#acct-progress');
  if (box) box.textContent = progressWords(); else render();
}

function accountSection(){
  return '<hr class="rule"><h3>' + esc(T('pitso.acct.head')) + '</h3>' +
    '<p class="sec small" style="margin-top:6px">' + esc(T('pitso.acct.intro')) + '</p>' +
    /* Neither of these can do anything without a server, and both say so here
       rather than by failing when tapped. */
    (MEND.status === 'connected'
      ? exportPanel() + deletePanel()
      : '<div class="note" style="margin-top:12px">' + esc(T('pitso.acct.needs_conn')) + '</div>');
}

function doExport(){
  var a = state.acct;
  a.exporting = true; a.exportErr = null;
  render();
  Promise.resolve(MEND.exportMe()).then(function(obj){
    a.exporting = false;
    var text = JSON.stringify(obj, null, 2);
    a.exportText = text;
    a.exportAt = (obj && obj.exported_at) || new Date().toISOString();
    try {
      if (a.exportUrl) URL.revokeObjectURL(a.exportUrl);
      a.exportUrl = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    } catch (e) {
      a.exportUrl = null;                 /* the box below still holds the file */
    }
    render();
  }).catch(function(e){
    a.exporting = false;
    a.exportErr = acctReason(e.message);
    render();
  });
}

function loadDeletionPreview(){
  var a = state.acct;
  a.previewing = true; a.previewErr = null;
  render();
  Promise.resolve(MEND.deletionPreview()).then(function(p){
    a.previewing = false; a.preview = p;
    render();
  }).catch(function(e){
    a.previewing = false; a.previewErr = acctReason(e.message);
    render();
  });
}

function submitDelete(form){
  var a = state.acct;
  var typed = $('#acct-confirm', form).value.trim();

/* =========================================================================
   VIEW 6 — MY DOCUMENTS
   Nothing in Pitso ever let anyone prove anything, and every badge on every
   profile rested on a verdict no mechanism could produce. This is that
   mechanism seen from the person's side: upload, check it, send it, wait, and
   read the answer — including the reason when the answer is no.

   The file is private. It goes to a bucket with no public URL (db/006_storage.sql)
   and is opened through a signed link that dies in minutes, only ever by the
   person it belongs to or the reviewer looking at it.
   ========================================================================= */
function daysWaiting(ts){
  var day = dayOf(ts); if (!day) return null;
  var n = MEND.daysUntil(day);              /* negative once the day has passed */
  return n == null ? null : -n;
}

/* .effective, never .status — a verified document past its expiry is expired,
   whatever the stored column says. */
function docStateLine(d){
  var eff = d.effective;
  if (eff === 'rejected')
    return { cls:'no', text: d.reviewed_at
      ? T('pitso.docs.rejectedon', { date: MEND.fmtDate(dayOf(d.reviewed_at)) }) : T('doc.rejected') };
  if (eff === 'expired')
    return { cls:'no', text: T('pitso.docs.expiredon', { date: MEND.fmtDate(d.expires_on) }) };
  if (eff === 'verified')
    return { cls:'ok', text: d.reviewed_at
      ? T('pitso.docs.verifiedon', { date: MEND.fmtDate(dayOf(d.reviewed_at)) }) : T('doc.verified') };
  if (d.stage === 'draft')
    return { cls:'draft', text: T('pitso.docs.notsent') };
  if (d.submitted_at) {
    var w = daysWaiting(d.submitted_at);
    var day = MEND.fmtDate(dayOf(d.submitted_at));
    return { cls:'wait', text: w > 1 ? T('pitso.docs.waitsince', { date: day, n: w })
                                     : w === 1 ? T('pitso.docs.waitsince1', { date: day })
                                               : T('pitso.docs.waittoday', { date: day }) };
  }
  return { cls:'wait', text: T('pitso.docs.waitnodate') };
}

function docRank(d){
  if (d.effective === 'rejected') return 0;
  if (d.effective === 'expired')  return 1;
  if (d.stage === 'draft')        return 2;
  if (d.effective === 'verified') return 4;
  return 3;
}

function docEntry(d){
  /* A row the database refused must not describe itself as waiting on anybody's
     desk. It is on nobody's desk. That reading comes first, before every other
     state, and it survives a later PATCH that matched no rows. */
  var unsaved = !!(d._sync === 'failed' || (d.id && state.failedIds[d.id]));
  var s = unsaved ? { cls:'no', text: T('pitso.docs.unsaved') } : docStateLine(d);
  var h = '<li>' +
    '<div class="dname">' + esc(docLabel(d.kind)) + syncMark(d) + '</div>' +
    '<div class="dstate ' + s.cls + '">' + esc(s.text) + '</div>';

  if (unsaved) {
    h += '<div class="dwhy">' + esc(T('pitso.docs.unsaved_why')) + '</div>';
  }

  /* A rejection without its reason is useless to the person who has to fix it. */
  if (!unsaved && d.effective === 'rejected') {
    h += '<div class="dwhy"><b>' + esc(T('pitso.docs.reason_given')) + '</b> ' +
      esc(String(d.note || '').trim() ? d.note : T('pitso.docs.noreason')) +
      '</div>';
  }
  if (!unsaved && d.effective === 'expired') {
    h += '<div class="dwhy">' + esc(T('pitso.docs.expired_why')) + '</div>';
  }

  var meta = [];
  if (d.issued_by)  meta.push(T('pitso.docs.issuedby', { who: d.issued_by }));
  if (d.issued_on)  meta.push(T('pitso.docs.issuedon', { date: MEND.fmtDate(d.issued_on) }));
  if (d.expires_on) meta.push(T('pitso.docs.expireson', { date: MEND.fmtDate(d.expires_on) }));
  if (meta.length) h += '<div class="dmeta">' + esc(meta.join(' · ')) + '</div>';

  /* UPLOADING IS NOT SUBMITTING, and the screen says why. */
  if (!unsaved && d.stage === 'draft') {
    if (state.openForm === 'send-' + d.id) {
      h += '<div class="note" style="margin-top:12px">' + esc(T('pitso.docs.sendwarn')) + '</div>' +
        ifWritable('<div class="btnrow">' +
          '<button class="btn" data-sendok="' + esc(d.id) + '">' + esc(T('pitso.docs.sendyes')) + '</button>' +
          '<button class="btn ghost" data-cancel="1">' + esc(T('pitso.docs.notyet')) + '</button></div>');
    } else {
      h += '<p class="small sec" style="margin-top:10px">' + esc(T('pitso.docs.notsubmit')) + '</p>' +
        ifWritable('<div class="btnrow"><button class="btn ghost small" data-send="' + esc(d.id) + '">' +
                   esc(T('pitso.docs.sendbtn')) + '</button></div>');
    }
  }

  var link = state.docLinks[d.id];
  if (link && link.url) {
    h += '<div class="dlink"><a href="' + esc(link.url) + '" target="_blank" rel="noopener">' +
      esc(T('pitso.docs.openwhat')) + '</a> ' +
      '<span class="sec">' + esc(T('pitso.docs.linklife')) + '</span></div>';
  } else if (link && link.err) {
    h += '<div class="dlink sec">' + esc(link.err) + '</div>';
  }
  h += '<div class="btnrow"><button class="btn ghost small" data-doclink="' + esc(d.id) + '">' +
       esc(T('pitso.docs.checkwhat')) + '</button></div>';
  return h + '</li>';
}

/* ---- documents: the three actions --------------------------------------- */
function doUpload(form){
  if (refuseWrite()) return;
  var kind = $('#u-kind', form).value;
  var input = $('#u-file', form);
  var file = input && input.files && input.files[0];
  var issued_by  = $('#u-by', form).value.trim();
  var issued_on  = $('#u-issued', form).value || null;
  var expires_on = $('#u-expires', form).value || null;

  var errs = {};
  if (!kind) errs.kind = T('pitso.err.doc.kind');
  if (!file) errs.file = T('pitso.err.doc.file');
  else {
    var ext = (file.name.match(/\.[a-z0-9]+$/i) || [''])[0].toLowerCase();
    if (file.size > MAX_UPLOAD)
      errs.file = T('pitso.err.doc.big', { size: Math.round(file.size / 1048576 * 10) / 10 });
    else if (ALLOWED_MIME.indexOf(file.type) === -1 && ALLOWED_EXT.indexOf(ext) === -1)
      errs.file = T('pitso.err.doc.type');
  }
  if (issued_on && issued_on > MEND.today()) errs.issued_on = T('pitso.err.doc.future');
  if (expires_on && issued_on && expires_on <= issued_on) errs.expires_on = T('pitso.err.doc.order');
  if (expires_on && expires_on < MEND.today()) errs.expires_on = T('pitso.err.doc.gone');

  $$('.field', form).forEach(function(fd){
    var k = fd.getAttribute('data-f'), box = $('.err', fd);
    if (errs[k]) { fd.classList.add('bad'); box.textContent = errs[k]; box.classList.remove('hidden'); }
    else { fd.classList.remove('bad'); box.textContent = ''; box.classList.add('hidden'); }
  });
  if (Object.keys(errs).length) return;

  /* No re-render while this is in flight: a repaint would throw away the file
     the person chose. The button says what is happening instead. */
  var btn = $('#u-go', form), box = $('#up-error', form);
  if (btn) { btn.disabled = true; btn.textContent = T('pitso.docs.uploading'); }
  if (box) { box.textContent = ''; box.classList.add('hidden'); }

  MEND.uploadDocument(file, kind, { issued_by: issued_by || null, issued_on: issued_on, expires_on: expires_on })
    .then(function(){
      state.flash = T('pitso.docs.uploaded');
      render();
      window.scrollTo(0, 0);
    })
    .catch(function(e){
      if (btn) { btn.disabled = false; btn.textContent = T('pitso.docs.uploadbtn'); }
      if (box) { box.textContent = T('pitso.err.upload', { why: e.message }); box.classList.remove('hidden'); }
    });
}

function sendForChecking(id){
  if (refuseWrite()) return;
  var r = MEND.submitDocument(id);
  state.openForm = null;
  state.flash = r ? MEND.claimed(T('pitso.docs.sent')) : T('pitso.docs.gone');
  render();
}

function askLink(id){
  var d = MEND.myDocuments().filter(function(x){ return x.id === id; })[0];
  if (!d) return;
  if (MEND.status !== 'connected') {
    state.docLinks[id] = { err: T('pitso.docs.nolink') };
    return render();
  }
  state.docLinks[id] = { err: T('pitso.docs.asking') };
  render();
  MEND.documentLink(d).then(function(url){
    state.docLinks[id] = url ? { url: url } : { err: T('pitso.docs.nolinkback') };
    render();
  }).catch(function(e){
    state.docLinks[id] = { err: T('pitso.docs.linkfail', { why: e.message }) };
    render();
  });
}

/* =========================================================================
   SHELL
   ========================================================================= */
/* FOUR states, not two. device and connecting are notes; connected is a quiet
   confirmation; unreachable is a warning with its own band, because the page is
   then showing stale device rows and a reader who misses that acts on figures
   that are not current. */
function renderMode(){
  var n = MEND.modeNotice();
  var box = $('#mode');
  box.className = 'mode ' + n.mode;
  var h = '<span class="flag">' + esc(n.label) + '</span>';
  if (n.mode === 'unreachable') {
    h += '<span class="stale">' + esc(T('pitso.stale')) + '</span>';
  }
  h += '<span class="detail">' + esc(n.detail) + '</span>';
  $('.wrap', box).innerHTML = h;
}

/* The connection resolves after load, so the banner is subscribed rather than
   painted once. Reaching 'connected' also REPLACES the whole store with server
   rows, which makes whatever is on screen stale — so the view is repainted too,
   unless somebody is in the middle of typing into a form. */
var paintedStatus = null;
function onStatusChanged(s){
  renderMode();
  if (paintedStatus === null) { paintedStatus = s; return; }
  if (s === paintedStatus) return;
  paintedStatus = s;
  if (state.openForm || $('#upform')) {
    state.flash = T('pitso.reloaded');
    renderWho();
  } else {
    render();
  }
}

/* ---- who you are -------------------------------------------------------- */
/* Device preview keeps the picker: there is no auth server to talk to and a
   sign-in form with nothing behind it would be theatre. When Supabase IS
   configured it is a real sign-in — an email and a one-time code. Pitso does not
   ask for a password and has no field to type one into. */

  var box = $('#who');

  box.innerHTML = MEND.CONFIGURED ? authBlock() : devicePicker();
  if (MEND.CONFIGURED) {

    var c = $('#si-code');  if (c) c.value = state.auth.code || '';

      esc(p.display_name) + ' — ' + esc(p.district) + '</option>';
  }).join('');
  return '<label for="whoami">' + esc(T('pitso.auth.aswho')) + '</label>' +
         '<select id="whoami" aria-label="' + esc(T('auth.signed_in_as')) + '">' + opts + '</select>';
}

function authBlock(){
  var a = state.auth, meP = MEND.me();
  if (a.user) {
    return '<div class="signedin">' +
      '<span class="wholine">' + esc(T('auth.signed_in_as')) + ' <b>' + esc(meP ? meP.display_name : (a.email || T('pitso.disp.you'))) + '</b>' +
        (meP && a.email ? ' · ' + esc(a.email) : '') + '</span>' +
      '<button type="button" class="btnw ghost" id="signout">' + esc(T('app.signout')) + '</button>' +
    '</div>';
  }
  if (!a.sent) {
    return '<form class="si" id="si-emailform" novalidate>' +
      '<label class="wholine" for="si-email">' + esc(T('pitso.auth.signin_email')) + '</label>' +
      '<input type="email" id="si-email" autocomplete="email" placeholder="you@example.com">' +
      '<button type="submit" class="btnw"' + (a.busy ? ' disabled' : '') + '>' +
        esc(a.busy ? T('pitso.auth.sending') : T('pitso.auth.emailme')) + '</button>' +
      '<span class="authnote">' + esc(T('pitso.auth.nopass')) + '</span>' +
      (a.err ? '<span class="autherr">' + esc(a.err) + '</span>' : '') +
    '</form>';
  }
  return '<form class="si" id="si-codeform" novalidate>' +
    '<label class="wholine" for="si-code">' +
      tHtml('pitso.auth.codesent', { email: '<b>' + esc(a.email) + '</b>' }) + '</label>' +
    '<input type="text" class="code" id="si-code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="123456">' +
    '<button type="submit" class="btnw"' + (a.busy ? ' disabled' : '') + '>' +
      esc(a.busy ? T('pitso.auth.checking') : T('app.signin')) + '</button>' +
    '<button type="button" class="btnw ghost" id="si-restart">' + esc(T('pitso.auth.otheraddr')) + '</button>' +
    (a.msg ? '<span class="authnote">' + esc(a.msg) + '</span>' : '') +
    (a.err ? '<span class="autherr">' + esc(a.err) + '</span>' : '') +
  '</form>';
}

function startSignIn(form){
  var email = $('#si-email', form).value.trim();
  state.auth.email = email;
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
    state.auth.err = T('pitso.auth.bademail');
    return renderWho();
  }
  state.auth.err = null; state.auth.busy = true; renderWho();
  MEND.sendSignInCode(email).then(function(){
    state.auth.busy = false; state.auth.sent = true; state.auth.code = '';
    state.auth.msg = T('pitso.auth.sent');
    renderWho();
    var c = $('#si-code'); if (c) c.focus();
  }).catch(function(e){
    state.auth.busy = false;
    state.auth.err = T('pitso.auth.sendfail', { why: e.message });
    renderWho();
  });
}

function finishSignIn(form){
  var code = $('#si-code', form).value.trim();
  state.auth.code = code;
  if (!/^[0-9]{4,8}$/.test(code)) {
    state.auth.err = T('pitso.auth.badcode');
    return renderWho();
  }
  state.auth.err = null; state.auth.busy = true; renderWho();
  MEND.verifySignInCode(state.auth.email, code).then(function(user){
    state.auth.busy = false; state.auth.user = user;
    state.auth.sent = false; state.auth.code = ''; state.auth.msg = null;
    state.flash = T('pitso.auth.signedin', { email: state.auth.email });
    render();
  }).catch(function(e){
    state.auth.busy = false;
    state.auth.err = e.message;
    renderWho();
  });
}

/* The nav, the masthead line and the footer are static markup so they render
   before any script runs. Their words are painted from the string table at boot
   and again whenever the language changes — otherwise the toggle would leave
   five English tabs and three English paragraphs on the page. */
function paintChrome(){
  $$('nav.tabs button').forEach(function(b){
    var k = TAB_KEY[b.getAttribute('data-view')];
    if (k) b.textContent = T(k);
  });
  var said = $('#said'); if (said) said.textContent = T('pitso.tagline');
  var link = function(href, label){
    return '<a href="' + href + '" rel="noopener">' + esc(label) + '</a>';
  };
  var f3 = $('#foot-three');
  if (f3) f3.innerHTML = tHtml('pitso.foot.three', {
    pitso:   '<strong>' + esc(T('pitso.name')) + '</strong>',
    mafisa:  link(CROSS.mafisa,  T('mafisa.name')),
    matsema: link(CROSS.matsema, T('matsema.name'))
  });
  var fm = $('#foot-money'); if (fm) fm.textContent = T('pitso.foot.nomoney');
  var fb = $('#foot-by');
  if (fb) fb.innerHTML = tHtml('pitso.foot.by', { mend: link('https://mendgroup.co.za', 'MEND GROUP') });
}

function go(view){
  state.view = view; state.openForm = null; state.rating = 0;
  $$('nav.tabs button').forEach(function(b){
    b.setAttribute('aria-selected', String(b.getAttribute('data-view') === view));
  });
  render();
  window.scrollTo(0, 0);
}

function render(){
  var body;
  /* A signed-in person with no profile row cannot write anything anywhere, so
     that comes before every other screen. */
  if (needsProfile())                                  body = viewProfileSetup();
  else if (signedOut() && SIGNIN_REQUIRED[state.view]) body = viewSignInFirst();
  else if (state.view === 'find')          body = viewFind();
  else if (state.view === 'profile')       body = viewProfile();
  else if (state.view === 'post')          body = viewPost();
  else if (state.view === 'requests')      body = viewRequests();
  else if (state.view === 'docs')          body = viewDocs();
  else                                     body = viewMine();

  var flash = state.flash ? '<div class="flash">' + esc(state.flash) + '</div>' : '';
  state.flash = null;
  $('#view').innerHTML = flash + shareBoxHtml() + body;
  /* Select it for them. On a phone the next thing they do is a long-press to
     copy, and half of that work is already done. */
  var sb = $('#sharetext');
  if (sb) { try { sb.focus(); sb.setSelectionRange(0, sb.value.length); } catch (e) {} }
  /* A full repaint (a language change, a connection resolving) rebuilds the
     find box empty. Put back what was typed and what it found, so the search
     survives the repaint the way the share box does. */
  paintSearch();
  renderWho();
  renderAlerts();
}

/* ---- one delegated listener for everything ----------------------------- */
document.addEventListener('click', function(ev){
  var t = ev.target.closest ? ev.target.closest('[data-view],[data-profile],[data-back],[data-hire],[data-offer],[data-accept],[data-review],[data-settle],[data-complete],[data-rate],[data-cancel],[data-send],[data-sendok],[data-doclink],[data-share-provider],[data-print-provider],[data-share-request],[data-print-request],[data-pay],[data-confirmpay],[data-dispute],[data-statement],[data-outcome],[data-acceptout],[data-report],#verify-ledger,#signout,#si-restart,#clear-errors,#share-close,#acct-export,#acct-preview,#acct-cancel') : null;
  if (!t) return;

  /* ---- saying something is wrong: private, and quiet ---- */
  if (t.hasAttribute('data-report')) {
    state.openForm = 'rep-' + t.getAttribute('data-report');
    state.reportErr = null; render(); return;
  }

  /* ---- your account: a copy, or going ---- */
  if (t.id === 'acct-export')  { doExport(); return; }
  if (t.id === 'acct-preview') { loadDeletionPreview(); return; }
  if (t.id === 'acct-cancel')  {
    state.acct.preview = null; state.acct.previewErr = null; state.acct.delErr = null;
    render(); return;
  }

  /* ---- share and print: these write nothing, so no gate ---- */
  if (t.id === 'share-close') { state.shareBox = null; render(); return; }
  if (t.hasAttribute('data-share-provider')) { shareProvider(t.getAttribute('data-share-provider')); return; }
  if (t.hasAttribute('data-print-provider')) { printProvider(t.getAttribute('data-print-provider')); return; }
  if (t.hasAttribute('data-share-request'))  { shareRequest(t.getAttribute('data-share-request')); return; }
  if (t.hasAttribute('data-print-request'))  { printRequest(t.getAttribute('data-print-request')); return; }

  /* ---- a disagreement: both accounts held, never a verdict ---- */
  if (t.hasAttribute('data-dispute')) {
    state.openForm = 'disp-' + t.getAttribute('data-dispute'); state.disputeErr = null; render(); return;
  }
  if (t.hasAttribute('data-statement')) {
    state.openForm = 'stmt-' + t.getAttribute('data-statement'); state.disputeErr = null; render(); return;
  }
  if (t.hasAttribute('data-outcome')) {
    state.openForm = 'out-' + t.getAttribute('data-outcome'); state.disputeErr = null; render(); return;
  }
  if (t.hasAttribute('data-acceptout')) {
    if (refuseWrite()) return;
    /* No text on the second acceptance: the words stand as the first party
       wrote them, and this only adds a name to them. */
    acceptTheOutcome(t.getAttribute('data-acceptout'), null); return;
  }

  /* ---- payment: RECORDED here, never made here ---- */
  if (t.hasAttribute('data-pay')) {
    state.openForm = 'pay-' + t.getAttribute('data-pay'); state.settleErr = null; render(); return;
  }
  if (t.hasAttribute('data-confirmpay')) {
    if (refuseWrite()) return;
    try {
      MEND.confirmSettlement(t.getAttribute('data-confirmpay'));
      state.flash = T('pitso.settle.confirmed');
    } catch (err) { state.flash = settleReason(err.message); }
    render(); return;
  }

  if (t.id === 'signout') {
    MEND.signOut();
    state.auth = { email:'', code:'', sent:false, busy:false, err:null, msg:null, user:null };
    state.docLinks = {};
    state.flash = T('pitso.auth.signedout');
    go('find'); return;
  }
  if (t.id === 'si-restart') {
    state.auth.sent = false; state.auth.code = ''; state.auth.err = null; state.auth.msg = null;
    renderWho(); return;
  }
  if (t.id === 'clear-errors') { state.writeErrors = []; renderAlerts(); return; }

  if (t.hasAttribute('data-send'))    { state.openForm = 'send-' + t.getAttribute('data-send'); render(); return; }
  if (t.hasAttribute('data-sendok'))  { sendForChecking(t.getAttribute('data-sendok')); return; }
  if (t.hasAttribute('data-doclink')) { askLink(t.getAttribute('data-doclink')); return; }

  if (t.hasAttribute('data-view')) { go(t.getAttribute('data-view')); return; }

  if (t.hasAttribute('data-profile')) {
    ev.preventDefault();
    state.profileId = t.getAttribute('data-profile');
    go('profile'); return;
  }
  if (t.hasAttribute('data-back')) { go(t.getAttribute('data-back')); return; }

  if (t.hasAttribute('data-hire')) {
    state.postPrefill = { trade: t.getAttribute('data-hire') };
    go('post'); return;
  }
  if (t.hasAttribute('data-offer')) { state.openForm = t.getAttribute('data-offer'); render(); return; }
  if (t.hasAttribute('data-cancel')) {
    state.openForm = null; state.rating = 0; state.settleErr = null; state.disputeErr = null;
    state.reportErr = null;
    render(); return;
  }
  if (t.hasAttribute('data-accept')) { acceptOffer(t.getAttribute('data-accept')); return; }
  if (t.hasAttribute('data-review')) { state.openForm = 'rev-' + t.getAttribute('data-review'); state.rating = 0; render(); return; }

  if (t.hasAttribute('data-rate')) {
    state.rating = Number(t.getAttribute('data-rate'));
    var form = t.closest('form');
    $$('.ratepick button', form).forEach(function(b){
      var v = Number(b.getAttribute('data-rate'));
      b.setAttribute('aria-pressed', String(v === state.rating));
      b.textContent = v <= state.rating ? '★' : '☆';
    });
    return;
  }

  if (t.hasAttribute('data-settle')) {
    if (refuseWrite()) return;
    var eid = t.getAttribute('data-settle');
    var e = MEND.all('engagements').filter(function(x){ return x.id === eid; })[0];
    var meP = MEND.me();
    if (!e) return;
    var patch = e.provider_id === meP.id ? { settled_by_provider:true } : { settled_by_counterparty:true };
    MEND.update('engagements', eid, patch);
    rec('engagement.settlement.marked', {
      platform:e.platform, subject_table:'engagements', subject_id:eid,
      payload:{ side: e.provider_id === meP.id ? 'provider' : 'counterparty' }
    });
    state.flash = T('pitso.settle.marked');
    render(); return;
  }

  if (t.hasAttribute('data-complete')) {
    if (refuseWrite()) return;
    var cid = t.getAttribute('data-complete');
    MEND.update('engagements', cid, { state:'completed', ended_on: MEND.today() });
    rec('engagement.completed', { platform:'pitso', subject_table:'engagements', subject_id:cid, payload:{} });
    state.flash = T('pitso.mine.completed');
    render(); return;
  }

  if (t.id === 'verify-ledger') {
    MEND.verifyLedger().then(function(r){
      var out = $('#verify-out');
      if (out) out.innerHTML =
        r.ok === true
          ? '<b style="color:var(--green2)">' + esc(T('pitso.rec.intact', { n: r.entries })) + '</b>'
        : r.ok === false
          ? '<b style="color:#9A4708">' + esc(T('pitso.rec.broken', { n: r.broken_at })) + '</b>'
          // Neither intact nor broken. An empty chain has nothing to check, and a
          // server that did not answer has not been checked. Saying "broken" for
          // either is an accusation the software cannot support — and it used to
          // print "Broken at entry undefined" to every first-time visitor.
          : '<span class="small muted">' + esc(r.note || r.error || T('pitso.rec.unknown')) + '</span>';
    });
    return;
  }
});

document.addEventListener('submit', function(ev){
  var f = ev.target;
  if (f.id === 'postform') { submitRequest(ev); return; }
  if (f.id === 'si-emailform') { ev.preventDefault(); startSignIn(f); return; }
  if (f.id === 'si-codeform')  { ev.preventDefault(); finishSignIn(f); return; }
  if (f.id === 'profileform')  { ev.preventDefault(); createProfile(f); return; }
  if (f.id === 'upform')       { ev.preventDefault(); doUpload(f); return; }
  if (f.hasAttribute('data-offerform')) { ev.preventDefault(); submitOffer(f); return; }
  if (f.hasAttribute('data-reviewform')) { ev.preventDefault(); submitReview(f); return; }
  if (f.hasAttribute('data-payform')) { ev.preventDefault(); submitSettlement(f); return; }
  if (f.hasAttribute('data-raiseform')) { ev.preventDefault(); submitRaise(f); return; }
  if (f.hasAttribute('data-stmtform')) { ev.preventDefault(); submitStatement(f); return; }
  if (f.hasAttribute('data-outcomeform')) { ev.preventDefault(); submitOutcome(f); return; }
  if (f.hasAttribute('data-reportform')) { ev.preventDefault(); submitReport(f); return; }
  if (f.id === 'acct-delform') { ev.preventDefault(); submitDelete(f); return; }
});

/* The sign-in fields are re-rendered whenever anything else changes, so what has
   been typed is held in state and put back. */
document.addEventListener('input', function(ev){
  if (ev.target.id === 'si-email') state.auth.email = ev.target.value;
  if (ev.target.id === 'si-code')  state.auth.code  = ev.target.value;
  /* Debounced inside onSearchInput. Never a request per keystroke: eight round
     trips to spell "Mokhotlong" is seven of them paid for out of somebody's
     airtime for nothing. */
  if (ev.target.id === 'q-find')   onSearchInput(ev.target.value);
});

/* Enter in the find box searches now rather than waiting out the debounce. */
document.addEventListener('keydown', function(ev){
  if (ev.target.id !== 'q-find' || ev.key !== 'Enter') return;
  ev.preventDefault();
  if (searchTimer) clearTimeout(searchTimer);
  runSearch();
});

document.addEventListener('change', function(ev){
  var id = ev.target.id;
  if (id === 's-method') {
    var hint = $('#s-refhint');
    if (hint) hint.textContent = ELECTRONIC.indexOf(ev.target.value) >= 0
      ? T('pitso.settle.ref.need') : T('money.cash_no_code');
    return;
  }
  if (id === 'whoami') { MEND.signInAs(ev.target.value); state.openForm = null; go(state.view); return; }
  if (id === 'f-trade') { state.filters.trade = ev.target.value; render(); return; }
  if (id === 'f-dist')  { state.filters.district = ev.target.value; render(); return; }
  if (id === 'f-avail') { state.filters.available = ev.target.checked; render(); return; }
});

/* boot */

/* A row the server refused must be visible as a refusal, not as a row. */
MEND.onWriteError(function(e){
  state.writeErrors.push(e);
  if (e.id) state.failedIds[e.id] = e.message;
  /* Repaint so the row itself carries the mark too — unless somebody is typing
     into an open form, which is not worth throwing away for a label. */
  if (state.openForm) renderAlerts(); else render();
});

/* Subscribed, not painted once: the connection resolves after this line runs. */
MEND.onStatus(onStatusChanged);

if (MEND.CONFIGURED) {
  /* core/mend.js keeps the signed-in profile id in localStorage but not the
     access token, which lives in memory. After a reload a stored session would
     therefore look signed in while every write went out with the anon key and
     was refused by RLS. Start signed out and ask again — a name on screen that
     no longer authorises anything is worse than an empty form. */
  MEND.signOut();
} else {
  var profs = MEND.all('profiles');
  if (!MEND.me() && profs.length) MEND.signInAs(profs[0].id);
}
paintChrome();
render();

/* The shared strip changes the language; this page has to follow it. onLang
   fires once on subscribe, and that first call is the render we just did. */
var langBooted = false;
MEND.onLang(function(){
  if (!langBooted) { langBooted = true; return; }
  paintChrome();
  renderMode();   // the disclosure banner must follow the language button too
  render();
});

window.PITSO = { state: state, render: render, go: go, writeBlock: writeBlock,
                 share: doShare, settleReason: settleReason,
                 disputeReason: disputeReason, disputeGate: disputeGate };  /* for verification */
})();
</script>
</body>
</html>
