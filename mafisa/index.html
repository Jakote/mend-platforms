      '<h1 class="break">' + esc(a.title) + '</h1>' +
      '<p class="muted small" style="margin:4px 0 12px">' + esc(catName(a.category)) + ' · ' + esc(a.district) + '</p>' +
      '<hr class="rule">' +
      '<dl class="dl">' +
        '<div><dt>' + esc(T('mafisa.owner')) + '</dt><dd class="break">' + esc(nameOf(a.owner_id)) + '</dd></div>' +
        '<div><dt>' + esc(T('mafisa.borrower')) + '</dt><dd class="break">' + esc(nameOf(l.borrower_id)) + '</dd></div>' +
        '<div><dt>' + esc(T('mafisa.period')) + '</dt><dd class="num">' + esc(period(l.from_date, l.to_date)) + '</dd></div>' +
        '<div><dt>' + esc(T('mafisa.days')) + '</dt><dd class="num">' + f.days + '</dd></div>' +
        '<div><dt>' + esc(T('mafisa.dailyrate')) + '</dt><dd class="num">' + esc(MEND.M(f.daily_cents)) + '</dd></div>' +
        '<div><dt>' + esc(T('mafisa.rent')) + '</dt><dd class="num">' + esc(MEND.M(l.agreed_cents)) + '</dd></div>' +
        '<div><dt>' + esc(T('mafisa.deposit')) + '</dt><dd class="num">' + esc(MEND.M(f.deposit_cents)) + '</dd></div>' +
        '<div><dt>' + esc(T('mafisa.state')) + '</dt><dd>' + esc(stateWord(l.state)) + '</dd></div>' +
      '</dl>' +
      '<hr class="rule">' +
      machine(l.state) +
      (party
        ? '<div style="margin-top:12px">' +
          (me.id === a.owner_id ? ownerActions(l) : borrowerActions(l)) + '</div>'
        : '') +
      '<hr class="rule">' +
      '<div class="btns" data-noprint>' +
        '<button class="btn sm ghost" data-act="share-loan" data-id="' + esc(l.id) + '">' + esc(T('mafisa.share')) + '</button>' +
        '<button class="btn sm" data-act="print-loan" data-id="' + esc(l.id) + '">' + esc(T('mafisa.print.loan')) + '</button>' +
      '</div>' +
      '<p class="small muted break" style="margin:8px 0 0">'+esc(T('mafisa.ln.printnote'))+'</p>' +
    '</div>' +
  '</section>' +
  /* The photographs come BEFORE the dispute panel on purpose: the record of
     what the thing looked like on each day is the thing an argument is settled
     from, and it is worth more attached on the day than recalled afterwards. */
  conditionSection(l) +
  settleSection(l) +
  disputeSection(l);
}

/* The proof control, driven entirely off the category's `proof` column, so the
   two branches of mafisa_listing_needs_proof() are visible as two different
   things being asked for rather than one control that sometimes refuses. */
function proofBoxHtml(me, catCode, selected){
  if (!catCode) return '<p class="small muted break" style="margin:0">'+esc(T('mafisa.pf.choosecat'))+'</p>';
  var cat = catOf(catCode);
  if (!cat) return '<p class="small muted break" style="margin:0">'+esc(T('mafisa.pf.nocat'))+'</p>';

  if (cat.proof == null){
    var idDoc = verifiedIdentityOf(me.id);
    return '<p class="small break" style="margin:0 0 10px">' +
      esc(T('mafisa.pf.idbranch', {cat: catName(cat.code)})) + '</p>' +
      (idDoc
        ? '<div class="accepted" style="margin:0"><div class="caps">'+esc(T('mafisa.pf.idok'))+'</div>' +
          '<p class="small break" style="margin:5px 0 0">' +
          esc(T('mafisa.pf.idok.body', {doc: docLabel(idDoc.kind)})) + '</p></div>'
        : '<div class="refusal" style="margin:0"><div class="caps">'+esc(T('mafisa.pf.noid'))+'</div>' +
          '<p class="small break" style="margin:5px 0 0">' +
          esc(T('mafisa.pf.noid.body', {kinds: IDENTITY_WORDS})) + '</p>' +
          '<div class="btns" style="margin-top:9px"><a class="btn sm" href="#/docs">'+esc(T('mafisa.pf.godocs'))+'</a></div></div>');
  }

  var opts = verifiedDocsOf(me.id, cat.proof);
  if (!opts.length)
    return '<div class="refusal" style="margin:0"><div class="caps">'+esc(T('mafisa.pf.nothing'))+'</div>' +
      '<p class="small break" style="margin:5px 0 0">' +
      esc(T('mafisa.pf.nothing.body', {cat: catName(cat.code), doc: docLabel(cat.proof).toLowerCase()})) + '</p>' +
      '<div class="btns" style="margin-top:9px"><a class="btn sm" href="#/docs">'+esc(T('mafisa.pf.godocs'))+'</a></div></div>';

  return '<label class="f"><span class="caps">'+esc(docLabel(cat.proof))+'</span>' +
    '<select name="proof_doc_id"><option value="">'+esc(T('mafisa.nw.none_selected'))+'</option>' +
    opts.map(function(x){
      return '<option value="'+esc(x.id)+'"'+(selected===x.id?' selected':'')+'>' +
        esc(T('mafisa.pf.verified_opt', {doc: docLabel(x.kind)})) +
        (x.issued_on ? ', ' + esc(T('doc.issued_on').toLowerCase()) + ' ' + esc(MEND.fmtDate(x.issued_on)) : '') +
        (x.expires_on ? ', ' + esc(T('doc.expires_on').toLowerCase()) + ' ' + esc(MEND.fmtDate(x.expires_on)) : '') + '</option>';
    }).join('') + '</select>' +
    '<div class="hint" id="proofHint"></div></label>' +
    '<p class="small muted break" style="margin:0">'+esc(T('mafisa.pf.onlyverified'))+'</p>';
}

/* ---- 5. MY RECORDS --------------------------------------------------------- */
function screenMine(){
  var me = MEND.me();
  if (!me) return needSignIn(T('mafisa.what.mine'));
  var assets = MEND.all('mafisa_assets').filter(function(a){ return a.owner_id === me.id; });
  var taken = MEND.all('mafisa_loans').filter(function(l){ return l.borrower_id === me.id; });

  var ownBlocks = assets.length ? assets.map(function(a){
    var ls = loansOf(a.id).sort(function(x,y){ return x.from_date.localeCompare(y.from_date); });
    var v = proofVerdict(a);
    var cat = catOf(a.category);
    var m = struckOf(a.id);
    /* Nothing on this block may offer to put a struck entry back. */
    var attachable = (!a.listed && !m && cat && cat.proof) ? verifiedDocsOf(a.owner_id, cat.proof) : [];
    var rows = ls.length ? ls.map(function(l){
      var f = loanFigures(a, l.from_date, l.to_date);
      return '<tr>' +
        '<td class="mono">'+esc(loanNo(l.id))+syncMark(l)+'</td>' +
        '<td class="break">'+esc(nameOf(l.borrower_id))+'</td>' +
        '<td class="mono">'+esc(MEND.fmtDate(l.from_date))+'<br>'+esc(MEND.fmtDate(l.to_date))+'</td>' +
        '<td class="mono r">'+f.days+'</td>' +
        '<td class="mono r">'+esc(MEND.M(l.agreed_cents))+'</td>' +
        '<td>'+stampState(l.state)+'<div style="margin-top:6px">'+ownerActions(l)+'</div>' +
          settlementLine(l, 'provider') +
          '<div class="btns" style="margin-top:6px"><a class="btn sm ghost" href="#/loan/'+esc(l.id)+'">' +
          esc(T('mafisa.loan.open'))+'</a></div></td>' +
      '</tr>';
    }).join('') : '<tr><td colspan="6" class="muted">'+esc(T('mafisa.my.noloansasset'))+'</td></tr>';

    return '<section class="sheet">' +
      '<div class="sheet-hd">' +
        '<div><span class="mono" style="font-size:12px;letter-spacing:.08em">'+esc(assetNo(a.id))+syncMark(a)+'</span>' +
        '<div style="margin-top:2px"><a href="#/asset/'+esc(a.id)+'" class="break">'+esc(a.title)+'</a></div></div>' +
        stampProof(a) +
      '</div>' +
      '<div class="sheet-bd">' +
        syncLine(a) +
        (m ? strikeBlock(m, T('mafisa.md.owner')) : '') +
        '<p class="small break" style="margin:0 0 10px"><strong>'+esc(T('mafisa.my.checked'))+'</strong> '+esc(v.line)+'</p>' +
        '<div class="btns" style="margin-bottom:12px">' +

/* =========================================================================
   YOUR ACCOUNT — taking a copy, and going

   Two things, and the second is irreversible. db/018_data_rights.sql answers
   BOTH halves of the question, and both halves get shown: what is erased, and
   what is kept without your name on it. Telling somebody their account is
   gone when a photograph of their bakkie is still on a loan record is the
   kind of promise that is worse than saying nothing.

   The order in MEND.deleteMe() is the whole thing: the files go first, one at
   a time, and if one will not delete nothing else is attempted. So the screen
   reports the file step separately rather than showing one spinner over both.
   ========================================================================= */
var HAS_RIGHTS = (typeof MEND.exportMe === 'function' &&
                  typeof MEND.deletionPreview === 'function' &&
                  typeof MEND.deleteMe === 'function');
var acctPreview = null;   // what deletionPreview() came back with
var acctErr = null;
var acctBusy = '';        // '' | 'copy' | 'preview' | 'delete'
var acctStep = '';        // the progress line while files are being removed

function acctLabel(k){
  var s = T('mafisa.acct.k.' + k);
  return s === 'mafisa.acct.k.' + k ? k.replace(/_/g, ' ') : s;
}
function acctList(obj){
  var ks = Object.keys(obj || {});
  if (!ks.length) return '<p class="small muted" style="margin:6px 0 0">'+esc(T('mafisa.acct.nothing'))+'</p>';
  return '<ul class="acct-list">' + ks.map(function(k){
    return '<li><span class="small break">'+esc(acctLabel(k))+'</span><b>'+esc(num(obj[k]))+'</b></li>';
  }).join('') + '</ul>';
}

function accountSection(me){
  if (!me || !HAS_RIGHTS) return '';
  var connected = MEND.CONFIGURED && MEND.status === 'connected';

  var head = '<section class="sheet"><div class="sheet-hd"><h2>'+esc(T('mafisa.acct.heading'))+'</h2>' +
    '<span class="caps break">'+esc(me.display_name)+'</span></div><div class="sheet-bd">' +
    (connected ? '' : '<p class="note break">'+esc(T('mafisa.acct.needserver'))+'</p>') +
    (acctErr ? '<div class="refusal"><div class="caps">'+esc(T('mafisa.refused'))+'</div>' +
      '<p class="break" style="margin:5px 0 0">'+esc(acctErr)+'</p></div>' : '');

  /* ---- take a copy ---- */
  var copy = '<h3>'+esc(T('mafisa.acct.copy'))+'</h3>' +
    '<p class="break" style="margin:5px 0 8px">'+esc(T('mafisa.acct.copy.body'))+'</p>' +
    /* The one thing a person could reasonably assume and be wrong about. */
    '<p class="note break">'+esc(T('mafisa.acct.copy.note'))+'</p>' +
    '<div class="btns"><button class="btn sm" data-act="acct-copy"'+(acctBusy?' disabled':'')+'>' +
      esc(acctBusy === 'copy' ? T('mafisa.acct.copy.busy') : T('mafisa.acct.copy.btn')) + '</button></div>';

  /* ---- remove your account ---- */
  var rm = '<hr class="dbl">' +
    '<h3>'+esc(T('mafisa.acct.remove'))+'</h3>' +
    '<p class="break" style="margin:5px 0 10px">'+esc(T('mafisa.acct.remove.body'))+'</p>';

  if (!acctPreview){
    rm += '<div class="btns"><button class="btn sm ghost" data-act="acct-preview"'+(acctBusy?' disabled':'')+'>' +
      esc(acctBusy === 'preview' ? T('app.loading') : T('mafisa.acct.show')) + '</button></div>';
    return head + copy + rm + '</div></section>';
  }

  /* The preview is rendered BEFORE any button that removes anything. */
  rm += '<div class="acct-cols">' +
      '<div><div class="caps">'+esc(T('mafisa.acct.erased'))+'</div>' + acctList(acctPreview.erased) + '</div>' +
      '<div><div class="caps">'+esc(T('mafisa.acct.kept'))+'</div>' + acctList(acctPreview.kept_without_your_name) + '</div>' +
    '</div>' +
    (acctPreview.why_those_are_kept
      ? '<p class="note break" style="margin:14px 0 0">'+esc(acctPreview.why_those_are_kept)+'</p>' : '') +
    /* Said in this app's own terms as well as the database's. On Mafisa the
       thing that survives is a photograph of somebody's bakkie on the day it
       changed hands, and that is worth naming rather than leaving as a
       category on a list. */
    '<p class="note break">'+esc(T('mafisa.acct.photos.why'))+'</p>' +
    (acctPreview.cannot_be_undone === false ? ''
      : '<div class="finalwarn break">'+esc(T('mafisa.acct.final'))+'</div>') +
    '<p class="small muted break">'+esc(T('mafisa.acct.filesfirst'))+'</p>' +
    (acctStep ? '<div class="progress break">'+esc(acctStep)+'</div>' : '') +
    '<form id="acctDeleteForm" novalidate>' +
      '<label class="f"><span class="caps break">'+esc(T('mafisa.acct.type', {name: me.display_name}))+'</span>' +
        '<input name="confirm" maxlength="80" autocomplete="off"></label>' +
      '<div class="btns"><button class="btn danger" type="submit"'+(acctBusy?' disabled':'')+'>' +
        esc(T('mafisa.acct.confirm'))+'</button>' +
        '<button class="btn sm ghost" type="button" data-act="acct-cancel">'+esc(T('app.cancel'))+'</button></div>' +
    '</form>';

  return head + copy + rm + '</div></section>';
}

function takeCopy(){
  acctBusy = 'copy'; acctErr = null; render();
  MEND.exportMe().then(function(data){
    var name = 'mafisa-' + MEND.today() + '.json';
    var url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], {type:'application/json'}));
    var link = document.createElement('a');
    link.href = url; link.download = name;
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
    acctBusy = '';
    flash = {kind:'ok', title: T('mafisa.acct.copy.made'), body: T('mafisa.acct.copy.made.body')};
    render();
  }).catch(function(e){ acctBusy = ''; acctErr = e.message; render(); });
}

function showDeletionPreview(){
  acctBusy = 'preview'; acctErr = null; render();
  MEND.deletionPreview().then(function(p){
    acctBusy = ''; acctPreview = p; render();
  }).catch(function(e){ acctBusy = ''; acctErr = e.message; render(); });
}

function removeAccount(typedName){
  acctBusy = 'delete'; acctErr = null; acctStep = ''; render();
  MEND.deleteMe(typedName, function(p){
    acctStep = p.step === 'files'
      ? T('mafisa.acct.files', {done: num(p.done), total: num(p.total)})
      : T('mafisa.acct.record');
    var host = document.querySelector('.progress');
    if (host) host.textContent = acctStep; else render();
  }).then(function(){
    acctBusy = ''; acctStep = ''; acctPreview = null;
    authed = false; authUserId = null; authEmail = '';
    signin = {email:'', sent:false, error:''};
    flash = {kind:'ok', title: T('mafisa.acct.done'), body: T('mafisa.acct.done.body')};
    go('#/register');
  }).catch(function(e){
    acctBusy = ''; acctStep = ''; acctErr = e.message; render();
  });
}

function ownerActions(l){
  var b = [];
  if (l.state === 'requested'){
    b.push('<button class="btn sm" data-act="agree" data-id="'+esc(l.id)+'">'+esc(T('mafisa.do.agree'))+'</button>');
    b.push('<button class="btn sm danger" data-act="cancel" data-id="'+esc(l.id)+'">'+esc(T('mafisa.do.decline'))+'</button>');
  } else if (l.state === 'agreed'){
    b.push('<button class="btn sm" data-act="out" data-id="'+esc(l.id)+'">'+esc(T('mafisa.handed_over'))+'</button>');
  } else if (l.state === 'out'){
    b.push('<button class="btn sm" data-act="returned" data-id="'+esc(l.id)+'">'+esc(T('mafisa.taken_back'))+'</button>');
  }
  return b.length ? '<div class="btns">'+b.join('')+'</div>' : '';
}
function borrowerActions(l){
  var b = [];
  if (l.state === 'requested') b.push('<button class="btn sm danger" data-act="cancel" data-id="'+esc(l.id)+'">'+esc(T('ui.withdraw'))+'</button>');
  return b.length ? '<div class="btns">'+b.join('')+'</div>' : '';
}
/* Settlement is a RECORD, never a payment. The wording here is load-bearing. */
function settlementLine(l, side){
  var e = engagementFor(l.id);
  if (!e) return '';
  var mineDone = side === 'provider' ? e.settled_by_provider : e.settled_by_counterparty;
  var themDone = side === 'provider' ? e.settled_by_counterparty : e.settled_by_provider;
  var out = '<div class="small muted" style="margin-top:7px">';
  if (mineDone && themDone) out += esc(T('mafisa.set.both'));
  else if (mineDone) out += esc(T('mafisa.set.mine'));
  else if (themDone) out += esc(T('mafisa.set.theirs'));
  else out += esc(T('mafisa.set.neither'));
  out += '</div>';
  if (!mineDone) out += '<div class="btns" style="margin-top:5px">' +
    '<button class="btn sm ghost" data-act="settle" data-id="'+esc(l.id)+'" data-side="'+esc(side)+'">' +
    esc(T('mafisa.do.markpaid'))+'</button></div>';
  return out;
}

/* ---- 6. MY DOCUMENTS ------------------------------------------------------- */
/* Until now every OWNERSHIP VERIFIED stamp in this app was true only because the
   seed said so, and nothing a person could do would ever produce one. This is
   the screen that produces one: upload, submit, wait, and a reviewer decides. */

/* Where a document stands, in the words a person would use. Expiry is applied
   through .effective — the stored status is never read directly. */
function docStanding(d){
  var eff = d.effective || MEND.effectiveStatus(d);
  if (d.stage === 'draft') return {stamp:'<span class="stamp">'+esc(T('mafisa.dc.stamp.draft'))+'</span>',
    line: T('mafisa.ds.draft')};
  if (eff === 'verified') return {stamp:'<span class="stamp ok">'+esc(T('doc.verified'))+'</span>',
    /* Two whole sentences joined at the full stop. A sentence boundary is the
       only safe place to join two translated strings; mid-sentence is not. */
    line: (d.reviewed_at
             ? T('mafisa.ds.verified.on', {date: MEND.fmtDate(String(d.reviewed_at).slice(0,10))})
             : T('mafisa.ds.verified')) + ' ' +
          (d.expires_on ? T('mafisa.ds.stops', {date: MEND.fmtDate(d.expires_on)})
                        : T('mafisa.ds.noexpiry'))};
  if (eff === 'expired') return {stamp:'<span class="stamp bad">'+esc(T('doc.expired'))+'</span>',
    line: T('mafisa.ds.expired', {date: MEND.fmtDate(d.expires_on)})};
  if (eff === 'rejected') return {stamp:'<span class="stamp bad">'+esc(T('doc.rejected'))+'</span>',
    line: d.note ? T('mafisa.ds.rejected', {note: d.note}) : T('mafisa.ds.rejected.noreason')};
  var since = String(d.submitted_at || '').slice(0,10);
  var days = since ? Math.max(0, -MEND.daysUntil(since)) : null;
  return {stamp:'<span class="stamp st">'+esc(T('mafisa.dc.stamp.waiting'))+'</span>',
    line: since ? T('mafisa.ds.waiting.since', {date: MEND.fmtDate(since), n: days == null ? 0 : days})
                : T('mafisa.ds.waiting')};
}

      '<td class="mono">'+r.seq+'</td>' +

      '<td class="hash">'+esc(String(r.hash||'').slice(0,10))+'…</td>' +
    '</tr>';
  }).join('') : '<tr><td colspan="4" class="muted">'+esc(T('mafisa.tr.nothing'))+'</td></tr>';

  return '<section class="sheet">' +
    '<div class="sheet-hd"><h2>'+esc(T('rec.trail'))+'</h2>' +

    '<div class="sheet-bd">' +
      '<p class="small muted break" style="margin:0 0 10px">'+esc(T('mafisa.tr.appendonly'))+'</p>' +
      /* What is said here is what can be checked at the moment it is said. The
         core has posted the trail to Postgres since the outbox landed, so any
         fixed sentence about where the trail lives would be a claim going stale
         on its own. The queue is observable; that is what gets reported. */
      (function(){
        var q = HAS_OUTBOX ? MEND.outbox().filter(function(e){ return e.table === 'ledger'; }) : [];
        if (!MEND.CONFIGURED)
          return '<p class="small break" style="margin:0 0 10px">'+esc(T('mafisa.tr.local'))+'</p>';
        if (q.length)
          return '<p class="small break" style="margin:0 0 10px;color:var(--oxblood)"><strong>' +
                 esc(T('mafisa.tr.queued', {n: q.length})) + '</strong></p>';
        return '';
      })() +
      '<div class="tw"><table class="narrow trail"><thead><tr><th class="r">Seq</th>' +
      '<th>'+esc(T('mafisa.tr.event'))+'</th><th>'+esc(T('mafisa.tr.when'))+'</th><th>Hash</th></tr></thead>' +
      '<tbody>'+rows+'</tbody></table></div>' +
      '<div class="btns" style="margin-top:11px"><button class="btn sm ghost" data-act="verify">'+esc(T('mafisa.tr.check'))+'</button></div>' +
      '<div id="verifyOut" style="margin-top:9px"></div>' +
    '</div>' +
  '</section>';
}

/* =========================================================================
   ACTIONS
   ========================================================================= */
function ledger(event, subject_id, payload){
  return MEND.record(event, {platform:'mafisa', subject_table:'mafisa_loans', subject_id:subject_id, payload:payload||{}});
}
function ledgerAsset(event, subject_id, payload){
  return MEND.record(event, {platform:'mafisa', subject_table:'mafisa_assets', subject_id:subject_id, payload:payload||{}});
}

function agreeLoan(id){
  var l = byId(MEND.all('mafisa_loans'), id);
  var a = l && byId(MEND.all('mafisa_assets'), l.asset_id);
  if (!l || !a) return;
  var clash = bookingClash(l.asset_id, l.from_date, l.to_date, l.id);
  if (clash){
    flash = {kind:'no', title: T('mafisa.act.refused.clash'),
      body: T('mafisa.act.clash.body', {period: period(clash.from_date, clash.to_date), no: loanNo(clash.id)})};
    return render();
  }
  var f = loanFigures(a, l.from_date, l.to_date);
  MEND.update('mafisa_loans', id, {state:'agreed', agreed_cents: f.rent_cents});
  var e = engagementFor(id);
  if (!e){
    e = MEND.insert('engagements', {
      platform:'mafisa', provider_id:a.owner_id, counterparty_id:l.borrower_id,
      subject_table:'mafisa_loans', subject_id:id, state:'agreed',
      agreed_cents:f.rent_cents, currency:'LSL',
      settled_by_provider:false, settled_by_counterparty:false, started_on:l.from_date
    });
  } else {
    MEND.update('engagements', e.id, {state:'agreed', agreed_cents:f.rent_cents});
  }
  ledger('mafisa.loan.agreed', id, {asset:a.id, from:l.from_date, to:l.to_date, agreed_cents:f.rent_cents})
    .then(function(){
      flash = {kind:'ok', title: stateWord('agreed'),
        body: T('mafisa.act.agreed.body', {no: loanNo(id), period: period(l.from_date, l.to_date),
                                           rent: MEND.M(f.rent_cents)})};
      render();
    });
}
function advanceLoan(id, to){
  var l = byId(MEND.all('mafisa_loans'), id);
  var a = l && byId(MEND.all('mafisa_assets'), l.asset_id);
  if (!l || !a) return;
  MEND.update('mafisa_loans', id, {state:to});
  var e = engagementFor(id);
  if (e){
    if (to === 'out') MEND.update('engagements', e.id, {state:'active', started_on: MEND.today()});
    if (to === 'returned') MEND.update('engagements', e.id, {state:'completed', ended_on: MEND.today()});
    if (to === 'cancelled') MEND.update('engagements', e.id, {state:'cancelled'});
  }
  ledger('mafisa.loan.' + to, id, {asset:a.id}).then(function(){
    flash = {kind:'ok', title: stateWord(to),
      body: T('mafisa.act.nowstate', {no: loanNo(id), state: stateWord(to).toLowerCase()}) +
        (to === 'returned' ? ' ' + T('mafisa.act.canreview') : '')};
    render();
  });
}
function settle(id, side){
  var e = engagementFor(id);
  if (!e) return;
  var patch = {};
  patch[side === 'provider' ? 'settled_by_provider' : 'settled_by_counterparty'] = true;
  MEND.update('engagements', e.id, patch);
  ledger('mafisa.loan.settlement_confirmed', id, {by: side}).then(function(){
    flash = {kind:'ok', title: T('mafisa.recorded'),
      body: T('mafisa.act.settled', {no: loanNo(id)})};
    render();
  });
}
function attachProof(asset_id){
  var sel = document.getElementById('attach-' + asset_id);
  var a = byId(MEND.all('mafisa_assets'), asset_id);
  if (!a || !sel || !sel.value) return;
  var why = listingRefusal(a.owner_id, a.category, sel.value);
  if (why){ flash = {kind:'no', title: T('mafisa.act.refused.doc'), body: why}; return render(); }
  MEND.update('mafisa_assets', asset_id, {proof_doc_id: sel.value});
  setListed(asset_id, true);
}
function setListed(asset_id, want){
  var a = byId(MEND.all('mafisa_assets'), asset_id);
  if (!a) return;
  if (want){
    /* MEND took it down. Re-entering it from this page would put back
       something a person decided should not be offered, and the proof
       verdict has nothing to do with why it went. */
    var struck = struckOf(asset_id);
    if (struck){
      flash = {kind:'no', title: T('mafisa.act.refused.enter'), body: T('mafisa.md.cannot')};
      return render();
    }
    var why = listingRefusal(a.owner_id, a.category, a.proof_doc_id);
    if (why){
      flash = {kind:'no', title: T('mafisa.act.refused.enter'), body: why};
      return render();
    }
  }
  MEND.update('mafisa_assets', asset_id, {listed: !!want});
  ledgerAsset(want ? 'mafisa.asset.listed' : 'mafisa.asset.unlisted', asset_id, {title:a.title}).then(function(){
    flash = {kind:'ok', title: want ? T('mafisa.act.entered') : T('mafisa.act.withdrawn'),
      body: T(want ? 'mafisa.act.listed' : 'mafisa.act.unlisted', {no: assetNo(asset_id), title: a.title})};
    render();
  });
}

/* ---- page state ------------------------------------------------------------ */
var authed = false;          // a real access token exists IN THIS PAGE's memory
var authUserId = null;
var authEmail = '';
var signin = {email:'', sent:false, error:''};
var writeFailures = [];
var alarmsHidden = false;
var WRITE_ACTS = ['agree','out','returned','cancel','settle','list','unlist','attach','submit-doc','pay-confirm',
                  'disp-accept'];

/* Why nothing may be written right now, or null. Three of the four modes are
   read-only, and each says which one it is. The alternative — accepting the
   entry into localStorage where it looks saved and will never reach the
   register — is the failure this whole file exists to avoid. */
/* core/mend.js grew an OUTBOX: a write made with no signal is queued on the
   device and sent when the server comes back. So being offline is no longer a
   reason to refuse — somebody standing in a yard in Mokhotlong marking a loan
   returned must be able to, and that is the point of the queue. What is still
   refused is a write that could never be accepted whenever it did arrive. */
var HAS_OUTBOX = (typeof MEND.outbox === 'function');

function readOnly(){
  if (!MEND.CONFIGURED) return null;      // preview: this browser IS the register, and says so
  if (seedShowing())
    return 'This page has never reached the server, so what is on screen is the invented preview data. Anything recorded now ' +
           'would be recorded against people who do not exist and would be refused the moment it was sent. Nothing was written.';
  if (!authed)
    return T('mafisa.err.nosignin') +
           (MEND.status === 'connected' ? '' : ' The server cannot be reached to sign you in either, so this page can be read and no more.');
  if (!HAS_OUTBOX && MEND.status !== 'connected')
    return 'The server did not answer, and this build has no queue to hold the entry in. It would sit in this browser looking ' +
           'saved and reach nobody, so it is refused instead.';
  return null;
}

/* A row Postgres refused is not a record. Acting on it stacks a second invented
   fact on the first — submitting a document that was never stored, entering an
   asset the database has never heard of. */
function unsavedGuard(id){
  var tables = ['documents','mafisa_assets','mafisa_loans','engagements','settlements'];
  for (var i=0;i<tables.length;i++){
    var r = byId(MEND.all(tables[i]), id);
    if (r && r._sync === 'failed')
      return 'That record never reached the database (' + (r._error || 'no reason was given') + '). It exists in this browser ' +
             'and nowhere else, so there is nothing to act on.';
  }
  return null;
}

/* core/seed.js is loaded in every build, and load() falls back to it whenever
   the device store is empty — including when the page is CONFIGURED and the
   server never answered. The screen then fills with invented people, and the
   mode band alone does not say that. This does. */
function seedShowing(){
  if (MEND.status === 'connected') return false;
  var ps = MEND.all('profiles');
  for (var i=0;i<ps.length;i++) if (ps[i].id === 'p-thabang') return true;
  return false;
}

  return '<div class="refusal"><div class="caps">'+esc(title)+'</div><ul style="margin:6px 0 0 18px;padding:0">' +
    errs.map(function(e){ return '<li class="break">'+esc(e)+'</li>'; }).join('') + '</ul></div>';
}

function renderAlerts(){
  var host = $('#alerts'); if (!host) return;
  var out = '';
  if (writeFailures.length && !alarmsHidden){
    var n = writeFailures.length;
    out += '<div class="alarm">' +
      '<div class="caps">'+n+' '+(n===1?'record':'records')+' did not reach the database</div>' +
      '<p class="small break" style="margin:5px 0 0">'+(n===1?'It is':'They are')+' on this screen because this browser is ' +
      'holding '+(n===1?'it':'them')+'. '+(n===1?'It is':'They are')+' <strong>not</strong> in the register: nobody else can ' +
      'see '+(n===1?'it':'them')+' and '+(n===1?'it':'they')+' will not survive this device. In a register that is worse than ' +
      'no record at all, which is why it is said here in red rather than logged to a console.</p>' +
      '<ul>' + writeFailures.slice(-5).map(function(f){
        return '<li class="break mono">'+esc(f.op+' '+f.table)+' — '+esc(f.message)+'</li>'; }).join('') + '</ul>' +
      '<div class="btns" style="margin-top:9px">' +
      '<button class="btn sm danger" data-act="dismiss-alarm">'+esc(T('mafisa.sh.hide'))+'</button></div>' +
    '</div>';
  }
  var queued = HAS_OUTBOX ? MEND.outbox() : [];
  if (queued.length){
    out += '<div class="alarm" style="border-color:var(--indigo);background:var(--paper)">' +
      '<div class="caps" style="color:var(--indigo)">'+queued.length+' '+(queued.length===1?'entry has':'entries have')+
      ' not left this device yet</div>' +
      '<p class="small break" style="margin:5px 0 0">'+(queued.length===1?'It is':'They are')+' held here and will be sent when ' +
      'the server answers. Until then '+(queued.length===1?'it is':'they are')+' <strong>not in the register</strong> and nobody ' +
      'else can see '+(queued.length===1?'it':'them')+'. The oldest has been waiting since ' +
      esc(String(queued[0].queued_at || '').replace('T',' ').slice(0,16)) + '.</p>' +
      '<ul>' + queued.slice(0,5).map(function(e){
        return '<li class="break mono">'+esc(e.op+' '+e.table)+'</li>'; }).join('') + '</ul>' +
      (MEND.status === 'connected'
        ? '<div class="btns" style="margin-top:9px"><button class="btn sm" data-act="flush">'+esc(T('mafisa.sh.sendnow'))+'</button></div>'
        : '<div class="btns" style="margin-top:9px"><button class="btn sm ghost" data-act="reconnect">'+esc(T('mafisa.sh.retry'))+'</button></div>') +
    '</div>';
  }
  if (MEND.CONFIGURED && seedShowing()){
    out += '<div class="alarm">' +
      '<div class="caps">'+esc(T('mafisa.al.invented'))+'</div>' +
      '<p class="small break" style="margin:5px 0 0">This page is configured to connect and has not managed to. What is filling ' +
      'the screen underneath is the seeded preview that ships with the platform: <strong>every name, asset, rating and review ' +
      'below is invented and none of them is real.</strong> It is not stale data from the server — the server has never been ' +
      'reached, so there is no data from it to be stale. Nothing here may be acted on or shown to anybody.</p>' +
      '<div class="btns" style="margin-top:9px"><button class="btn sm danger" data-act="reconnect">'+esc(T('mafisa.sh.retry'))+'</button></div>' +
    '</div>';
  }
  if (MEND.CONFIGURED && !authed && MEND.me()){
    out += '<div class="alarm">' +
      '<div class="caps">'+esc(T('mafisa.al.noauth'))+'</div>' +
      '<p class="small break" style="margin:5px 0 0">This page remembers who was last acting here, but the sign-in token itself ' +
      'is kept in memory by core/mend.js and does not survive a reload. ' +
      (MEND.status === 'connected'
        ? 'Reads are working, and every write would be refused by the database. '
        : 'Nothing is being read from the server either. ') +
      'Nothing will be attempted until you sign in again.</p>' +
      '<div class="btns" style="margin-top:9px"><a class="btn sm" href="#/signin">'+esc(T('app.signin'))+'</a></div></div>';
  }
  host.innerHTML = out;
}

/* Acting-as in preview; a real session when a server is configured. Configured,
   not connected: whether the server answered has nothing to do with whether
   this page has accounts. */
function renderIdentity(){
  var host = $('#actingAs');
  if (!MEND.CONFIGURED){
    var me = MEND.me();
    var opts = MEND.all('profiles').map(function(p){
      return '<option value="'+esc(p.id)+'"'+(me && me.id===p.id?' selected':'')+'>'+esc(p.display_name)+'</option>';
    }).join('');
    host.innerHTML = '<label style="display:block"><span class="caps">'+esc(T('mafisa.sh.actingas'))+'</span>' +
      '<select id="whoami" style="min-width:200px;margin-top:3px">'+opts+'</select></label>';
    return;
  }
  var who = MEND.me();
  if (authed && who){
    host.innerHTML = '<div class="small" style="text-align:right"><span class="caps">'+esc(T('auth.signed_in_as'))+'</span><br>' +
      '<strong class="break">'+esc(who.display_name)+'</strong><br>' +
      '<button class="btn sm ghost" style="margin-top:4px" data-act="signout">'+esc(T('app.signout'))+'</button></div>';
  } else if (authed){
    host.innerHTML = '<div class="small" style="text-align:right"><span class="caps">'+esc(T('auth.signed_in_as'))+'</span><br>' +
      '<span class="break">'+esc(authEmail)+'</span><br>' +
      '<a class="btn sm" style="margin-top:4px" href="#/signin">'+esc(T('mafisa.sh.finish'))+'</a></div>';
  } else {

}

function renderTabs(route){

               ['#/docs',T('mafisa.tab.docs')],['#/mine',T('mafisa.tab.mine')]];

             (i[0] === '#/register' && (route.indexOf('#/asset') === 0 || route.indexOf('#/borrow') === 0)) ||

/* Asks for a signed link per photograph, after the page is drawn. Short-lived
   by design: a photograph of somebody's vehicle is not something to hand out a
   permanent URL for, and nothing about these is public. A failure says why on
   the photograph rather than leaving a blank frame. */
function fetchPhotos(){
  if (MEND.status !== 'connected' || typeof MEND.photoLink !== 'function') return;
  var slots = document.querySelectorAll('[data-photo]');
  [].forEach.call(slots, function(slot){
    var id = slot.getAttribute('data-photo');
    var row = MEND.all('attachments').filter(function(a){ return a.id === id; })[0];
    if (!row) return;
    MEND.photoLink(row, 300).then(function(url){
      if (!url || !slot.parentNode) return;
      PHOTO_VIEW[id] = url;                      // reuse it for this page's life
      var img = document.createElement('img');
      img.src = url;
      img.alt = slot.getAttribute('data-alt') || '';
      slot.parentNode.replaceChild(img, slot);
    }).catch(function(e){
      if (!slot.parentNode) return;
      slot.textContent = T('mafisa.cond.nolink', { why: e.message });
    });
  });
}

/* ---- sign in: email, then a one-time code ---------------------------------- */
function sendCode(email){
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){
    signin.error = 'That does not look like an email address.'; return render();
  }
  signin.email = email; signin.error = '';
  MEND.sendSignInCode(email).then(function(){
    signin.sent = true; render();
  }).catch(function(e){
    signin.error = 'The code could not be sent. ' + e.message; render();
  });
}
function verifyCode(code){
  if (!code){ signin.error = 'Type the code from the email.'; return render(); }
  var email = signin.email;
  signin.error = '';
  MEND.verifySignInCode(email, code).then(function(user){
    authed = true; authUserId = user.id; authEmail = email;
    signin = {email:'', sent:false, error:''};
    flash = MEND.me()
      ? {kind:'ok', title:'Signed in', body:'Acting as ' + MEND.me().display_name + '. This holds until the page is reloaded.'}
      : {kind:'ok', title:'Signed in', body:'The register does not know who you are yet. One form and it will.'};
    go('#/signin');
  }).catch(function(e){
    signin.error = e.message; render();
  });
}

/* Navigate and render EXACTLY ONCE. Setting the hash queues a hashchange, so
   calling render() as well consumed the flash message before the second render
   could show it — the confirmation was written and then silently thrown away. */

  if (location.hash === hash) render(); else location.hash = hash;
}

  if (t.form && t.form.id === 'borrowForm') updateCalc();
  /* Debounced. Every keystroke is a request somebody pays for by the
     megabyte, and a search fired on each one would send eight of them to
     read one word. Only the results are repainted, so the box keeps focus
     and the caret stays where the person left it. */
  if (t.dataset && t.dataset.q !== undefined){
    q = t.value;
    if (qTimer) clearTimeout(qTimer);
