<html data-title-key="title.mafisa" lang="en">
<head>

<title>Mafisa — the register of lent assets</title>
<meta name="description" content="Mafisa: a register of assets lent between people in Lesotho. Ownership proved, periods committed, both sides keep the record.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@600&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   MAFISA — design system "Registry".
   A deed, a land registry, an official record. Ruled, precise, documentary.
   Zero radius anywhere. Every number is monospaced and tabular, because a
   register whose figures do not line up is not a register.
   ========================================================================= */
:root{
  --parchment:#F5F1E8; --parchment2:#EDE7D9; --paper:#FFFDF7;
  --ink:#1A1A17; --ink2:#4A4639; --ink3:#6A6453;
  --indigo:#1E2749; --indigo2:#2E3A63;
  --oxblood:#7C2D12; --oxblood-wash:#F6EAE2;
  --rule:#C8C0AE; --verified:#1B5E20; --verified-wash:#E8EFE6;
  /* The shared strip (core/ui.js) renders in a shadow root and can be reached
     only through these four. Same values tools/deploy.py injects at build. */
  --mend-bar-bg:#1E2749; --mend-bar-fg:#F5F1E8;
  --mend-bar-accent:#7C2D12; --mend-bar-line:rgba(245,241,232,.22);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--parchment); color:var(--ink);
  font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:15px; line-height:1.55; overflow-x:hidden;
}
h1,h2,h3,h4{font-family:'IBM Plex Serif',Georgia,'Times New Roman',serif;font-weight:600;line-height:1.25;margin:0}
h1{font-size:22px} h2{font-size:19px} h3{font-size:17px} h4{font-size:15px}
p{margin:0 0 10px}
a{color:var(--indigo);text-decoration:underline;text-underline-offset:2px}
.num,.mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;font-weight:500}
.wrap{max-width:960px;margin:0 auto;padding:0 14px}
.caps{font-size:10.5px;text-transform:uppercase;letter-spacing:.10em;color:var(--ink3);font-weight:600}
.muted{color:var(--ink3)}
.small{font-size:13px}
.break{overflow-wrap:anywhere;word-break:break-word}

/* ---- masthead ---------------------------------------------------------- */
.top-edge{height:5px;background:var(--indigo)}
header.mast{background:var(--parchment2);border-bottom:1px solid var(--rule)}
.mast-in{padding:14px 0 10px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;justify-content:space-between}
.mark{font-family:'IBM Plex Serif',serif;font-weight:600;font-size:26px;letter-spacing:.02em;line-height:1}
.mark span{color:var(--oxblood)}
.mast-sub{font-size:12px;color:var(--ink2);margin-top:3px}
.regline{border-top:1px solid var(--rule);padding:6px 0;display:flex;flex-wrap:wrap;gap:4px 16px}

/* ---- navigation -------------------------------------------------------- */
nav.tabs{background:var(--parchment);border-bottom:1px solid var(--rule)}
.tabs-in{display:flex;overflow-x:auto;gap:0}
.tabs a{
  display:block;padding:10px 13px;white-space:nowrap;text-decoration:none;color:var(--ink2);
  font-size:11px;text-transform:uppercase;letter-spacing:.10em;font-weight:600;
  border-bottom:3px solid transparent;
}
.tabs a[aria-current="page"]{color:var(--indigo);border-bottom-color:var(--indigo)}

/* ---- mode notice ------------------------------------------------------- */
.mode{border-bottom:1px solid var(--rule);background:var(--paper)}
.mode-in{display:flex;gap:10px;align-items:flex-start;padding:9px 0}
.mode-dot{width:9px;height:9px;flex:0 0 9px;margin-top:5px;background:var(--oxblood)}
.mode.connected .mode-dot{background:var(--verified)}

/* ---- stamps ------------------------------------------------------------ */
.stamp{
  display:inline-block;border:1.5px solid var(--ink3);color:var(--ink3);
  padding:3px 7px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.11em;
  background:transparent;line-height:1.2;
}
.stamp.ok{border-color:var(--verified);color:var(--verified);background:var(--verified-wash);transform:rotate(-1.5deg)}
.stamp.bad{border-color:var(--oxblood);color:var(--oxblood);background:var(--oxblood-wash)}
.stamp.st{border-color:var(--indigo);color:var(--indigo)}
.stamp.fill{border-color:var(--indigo);background:var(--indigo);color:var(--parchment)}

/* ---- sections and rules ------------------------------------------------ */
section.sheet{background:var(--paper);border:1px solid var(--rule);margin:16px 0}
.sheet-hd{border-bottom:1px solid var(--rule);padding:10px 13px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:var(--parchment2)}
.sheet-bd{padding:13px}
.rule{border:0;border-top:1px solid var(--rule);margin:14px 0}
.dbl{border-top:3px double var(--rule);margin:16px 0}

/* ---- register entries -------------------------------------------------- */
.entries{border-top:1px solid var(--rule)}
.entry{border-bottom:1px solid var(--rule);padding:13px}
.entry:nth-child(even){background:var(--parchment2)}
.entry-hd{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;justify-content:space-between}
.entry-hd .recno{font-size:12px;letter-spacing:.08em;color:var(--ink3)}
.entry h3{margin:2px 0 8px}
.entry h3 a{text-decoration:none;color:var(--ink)}
.entry h3 a:hover{text-decoration:underline}
.entry.dim{opacity:.72}
dl.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:9px 16px;margin:0}
dl.dl dt{font-size:10px;text-transform:uppercase;letter-spacing:.10em;color:var(--ink3);font-weight:600}
dl.dl dd{margin:1px 0 0;font-weight:500}
/* An entry title is an h2 — the first level under the page's h1 — and is sized
   as it always was. A screen reader navigates by heading level, and h1 jumping
   to h3 tells it a level was skipped when none was. */
.entry h2{font-size:17px;margin:2px 0 8px}
.entry h2 a{text-decoration:none;color:var(--ink)}
.entry h2 a:hover{text-decoration:underline}

/* ---- tables ------------------------------------------------------------ */
.tw{overflow-x:auto;border:1px solid var(--rule);background:var(--paper);-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:540px}
table.narrow{min-width:400px}
th{
  text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule);background:var(--parchment2);
  font-size:10px;text-transform:uppercase;letter-spacing:.10em;color:var(--ink2);font-weight:600;white-space:nowrap;
}
td{padding:9px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}

/* ---- forms ------------------------------------------------------------- */
label.f{display:block;margin:0 0 13px}
label.f > .caps{display:block;margin-bottom:4px}
input,select,textarea{
  width:100%;border:1px solid var(--rule);border-radius:0;background:var(--paper);color:var(--ink);
  padding:9px 10px;font-family:inherit;font-size:15px;
}
input[type=date],input[type=number]{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
input:focus,select:focus,textarea:focus{outline:2px solid var(--indigo2);outline-offset:-2px}
textarea{min-height:80px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr;gap:0 14px}
@media(min-width:560px){.grid2{grid-template-columns:1fr 1fr}}
.hint{font-size:12px;color:var(--ink3);margin-top:4px}
fieldset{border:1px solid var(--rule);padding:12px;margin:0 0 14px}
legend{padding:0 6px;font-size:10px;text-transform:uppercase;letter-spacing:.10em;color:var(--ink3);font-weight:600}

/* ---- buttons ----------------------------------------------------------- */
.btn{
  display:inline-block;border:1px solid var(--indigo);background:var(--indigo);color:var(--parchment);
  padding:9px 14px;border-radius:0;font-family:inherit;font-size:13px;font-weight:600;letter-spacing:.03em;
  cursor:pointer;text-decoration:none;text-align:center;
}
.btn:hover{background:var(--indigo2)}
.btn.ghost{background:transparent;color:var(--indigo)}
.btn.ghost:hover{background:var(--parchment2)}
.btn.danger{background:transparent;border-color:var(--oxblood);color:var(--oxblood)}
.btn.danger:hover{background:var(--oxblood-wash)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 9px;font-size:11.5px}
.btns{display:flex;flex-wrap:wrap;gap:8px}

/* ---- notices ----------------------------------------------------------- */
.refusal{border:1.5px solid var(--oxblood);background:var(--oxblood-wash);padding:12px;margin:0 0 14px}
.refusal .caps{color:var(--oxblood)}
.accepted{border:1.5px solid var(--verified);background:var(--verified-wash);padding:12px;margin:0 0 14px}
.accepted .caps{color:var(--verified)}
.note{border-left:3px solid var(--rule);padding:2px 0 2px 11px;color:var(--ink2);font-size:13.5px;margin:0 0 12px}

/* ---- share: the text itself, never a button that does nothing ---------- */
.sharebox{border:1.5px solid var(--indigo);background:var(--paper);padding:12px;margin:0 0 14px}
.sharebox textarea{
  width:100%;max-width:100%;min-height:200px;box-sizing:border-box;
  font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.5;
  background:var(--parchment2);
}
.sharebox .btns{margin-top:9px}

/* ---- settlements ------------------------------------------------------- */
.paid{border:1px solid var(--rule);background:var(--paper);padding:10px 11px;margin:0 0 9px}
.paid .hd{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;justify-content:space-between}
.paid .amt{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:16px;font-weight:600}
.paid.both{border-color:var(--verified);background:var(--verified-wash)}
.paid .ref{font-family:'IBM Plex Mono',monospace;font-size:12.5px;overflow-wrap:anywhere}

/* ---- condition photographs --------------------------------------------- */
/* Two days, side by side, because that comparison IS the evidence. On a phone
   they stack, and the day each one belongs to is written on it either way. */
.pgrid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:600px){.pgrid{grid-template-columns:1fr 1fr}}
.pcol{border:1px solid var(--rule);background:var(--paper);min-width:0}
.pcol-hd{border-bottom:1px solid var(--rule);background:var(--parchment2);padding:8px 11px;
  display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;justify-content:space-between}
.pcol-bd{padding:11px}
.photo{border-top:1px solid var(--rule);padding:10px 0;min-width:0}
.photo:first-child{border-top:0;padding-top:0}
.photo img{display:block;width:100%;max-width:100%;height:auto;border:1px solid var(--rule);background:var(--parchment2)}
.photo .cap{font-size:13px;margin:6px 0 0;overflow-wrap:anywhere}
.photo .when{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink2);
  font-variant-numeric:tabular-nums;letter-spacing:.02em}
.photo .noimg{border:1px dashed var(--rule);background:var(--parchment2);padding:10px;font-size:12.5px;color:var(--ink2)}

/* ---- a dispute, as a page of a register rather than a chat -------------- */
/* Each account is a ruled entry with its date and its author in the margin.
   It must not look like a conversation: a conversation invites a reply and a
   last word, and a register invites neither. */
.disp{border:1px solid var(--rule);background:var(--paper);margin:0 0 14px}
.disp-hd{border-bottom:1px solid var(--rule);background:var(--parchment2);padding:10px 12px;
  display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;justify-content:space-between}
.disp-bd{padding:12px}
.accts{border-top:1px solid var(--rule);margin-top:10px}
.acct{border-bottom:1px solid var(--rule);padding:11px 0;min-width:0}
.acct:last-child{border-bottom:0}
.acct-hd{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline;justify-content:space-between;margin-bottom:5px}
.acct-who{font-size:11px;text-transform:uppercase;letter-spacing:.09em;font-weight:600;color:var(--ink2)}
.acct-no{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink2);font-variant-numeric:tabular-nums}
.acct p{margin:0;overflow-wrap:anywhere}
/* The claim is never presented as a finding. */
.noverdict{border-left:3px solid var(--indigo);background:var(--paper);padding:8px 0 8px 11px;
  margin:0 0 12px;font-size:13.5px;color:var(--ink2)}
.finalwarn{border:1.5px solid var(--oxblood);background:var(--oxblood-wash);padding:10px 11px;margin:0 0 12px;font-size:13.5px}
.counts{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}

/* ---- the printed loan agreement ---------------------------------------- */
/* Built as a DIRECT CHILD of <body>: tools/print.css isolates the target with
   `body[data-printing] > *:not([data-print-target])`, which reaches the top
   level only. A nested target has its own parent hidden out from under it. */
.printsheet{display:none}
.printsheet .hd{display:flex;justify-content:space-between;gap:10px;
  border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:12px}
.printsheet .no{font-family:'IBM Plex Mono',monospace;font-size:11pt;letter-spacing:.08em}
.printsheet h1{font-size:17pt;margin:0 0 3px}
.printsheet .caps{font-size:8pt;letter-spacing:.10em;text-transform:uppercase;color:#333}
.printsheet table{width:100%;min-width:0;border-collapse:collapse;margin:8px 0}
.printsheet th,.printsheet td{border:1px solid #000;padding:5px 7px;font-size:10.5pt;text-align:left;
  vertical-align:top}
.printsheet .terms{border:1px solid #000;padding:9px;margin:12px 0;font-size:9.5pt;line-height:1.4}
/* Two people, two signatures, on paper. That is the point of printing it. */
.printsheet .sigs{display:flex;gap:26px;margin-top:26px;page-break-inside:avoid}
.printsheet .sig{flex:1 1 0;min-width:0}
.printsheet .sig .line{border-bottom:1px solid #000;height:34px}
.printsheet .sig .who{font-size:9pt;margin-top:4px}
.printsheet .sig .dateline{border-bottom:1px solid #000;height:22px;margin-top:14px}
.printsheet .foot{margin-top:20px;font-size:8.5pt;color:#333;border-top:1px solid #000;padding-top:5px}

@media print{
  /* Repeated from tools/print.css, which is inlined only at build time — the
     monorepo is served with no build step, and without these a print would be
     a photograph of the app instead of the record. */
  #mend-strip,nav.tabs,header.mast,.top-edge,#alerts,#trail,.noprint,[data-noprint]{display:none !important}
  html,body{background:#fff !important;color:#000 !important}
  /* core/ui.js appends body{padding-bottom:88px!important} at runtime, after
     this stylesheet, so it takes a more specific selector to beat it. */
  body,body[data-printing]{padding-bottom:0 !important;margin:0 !important}
  button{display:none !important}
  body[data-printing] > *:not([data-print-target]){display:none !important}
  body[data-printing] [data-print-target]{display:block !important}
  @page{margin:16mm}
}

/* ---- calendar ---------------------------------------------------------- */
.cals{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:620px){.cals{grid-template-columns:1fr 1fr}}
.cal-t{font-size:11px;text-transform:uppercase;letter-spacing:.10em;color:var(--ink2);font-weight:600;margin-bottom:5px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule)}
.cal div{background:var(--paper);padding:5px 0;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-variant-numeric:tabular-nums}
.cal div.dow{background:var(--parchment2);color:var(--ink3);font-size:9.5px;letter-spacing:.06em;padding:4px 0}
.cal div.pad{background:var(--parchment)}
.cal div.past{color:var(--ink3);background:var(--parchment2)}
.cal div.cmt{background:var(--indigo);color:var(--parchment);font-weight:500}
.cal div.req{background:var(--parchment2);color:var(--oxblood);box-shadow:inset 0 -3px 0 var(--oxblood)}
.cal div.today{outline:1.5px solid var(--oxblood);outline-offset:-2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:9px;font-size:11.5px;color:var(--ink2)}
.legend i{display:inline-block;width:11px;height:11px;vertical-align:-1px;margin-right:5px;border:1px solid var(--rule)}
.legend i.cmt{background:var(--indigo);border-color:var(--indigo)}
.legend i.req{background:var(--parchment2);border-bottom:3px solid var(--oxblood)}

/* ---- state machine ----------------------------------------------------- */
.machine{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:10px;text-transform:uppercase;letter-spacing:.09em;font-weight:600}
.machine b{border:1px solid var(--rule);padding:4px 8px;color:var(--ink3);font-weight:600}
.machine b.on{border-color:var(--indigo);color:var(--indigo);background:var(--paper)}
.machine b.done{border-color:var(--ink3);color:var(--ink2)}
.machine s{text-decoration:none;color:var(--ink3)}

/* ---- standing ---------------------------------------------------------- */
.stars{font-size:17px;letter-spacing:.04em;color:var(--oxblood)}
.review{border-top:1px solid var(--rule);padding:10px 0}
.review:first-of-type{border-top:0}

/* ---- record trail ------------------------------------------------------ */
.trail td{font-size:12.5px}
.hash{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink3)}

/* ---- footer ------------------------------------------------------------ */
footer.foot{border-top:3px double var(--rule);margin-top:26px;padding:16px 0 30px;font-size:12px;color:var(--ink3)}
footer.foot a{color:var(--ink2)}

/* ---- the four modes ---------------------------------------------------- */
.mode-in{flex-wrap:wrap}
.mode.connecting .mode-dot{background:var(--ink3)}
.mode.unreachable{background:var(--oxblood-wash);border-bottom:2px solid var(--oxblood)}
.mode.unreachable .mode-dot{background:var(--oxblood)}
.mode.unreachable strong{color:var(--oxblood)}
.mode-act{margin-left:auto}

/* ---- a write that did not land ----------------------------------------- */
#alerts:not(:empty){padding-top:12px}
.alarm{border:1.5px solid var(--oxblood);border-left-width:5px;background:var(--oxblood-wash);padding:11px 12px;margin:0 0 10px}
.alarm .caps{color:var(--oxblood)}
.alarm ul{margin:7px 0 0 17px;padding:0;font-size:12.5px}
.sync{display:inline-block;border:1px solid var(--oxblood);color:var(--oxblood);background:var(--oxblood-wash);
  padding:1px 5px;font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;white-space:nowrap}
.sync.wait{border-color:var(--ink3);color:var(--ink3);background:var(--parchment2)}

/* ---- proved who, not what ---------------------------------------------- */
.stamp.idv{border-color:var(--indigo);color:var(--indigo);background:var(--paper);transform:rotate(-1.5deg)}

/* ---- documents --------------------------------------------------------- */
.doc{border-bottom:1px solid var(--rule);padding:12px 13px}
.doc:nth-child(even){background:var(--parchment2)}
.doc:last-child{border-bottom:0}
input[type=file]{padding:7px;background:var(--parchment2);font-size:13px}
input[type=file]::file-selector-button{border:1px solid var(--indigo);background:var(--paper);color:var(--indigo);
  border-radius:0;padding:5px 9px;margin-right:9px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer}
.otp{max-width:190px;font-family:'IBM Plex Mono',monospace;font-size:20px;letter-spacing:.34em}

/* ---- a control that is present without being encouraged ---------------- */
/* "Report this" has to be findable and must not read as an invitation. It is
   a plain underlined word in the margin of the entry, sized for a thumb like
   everything else because a quiet control a person cannot hit is not quiet,
   it is broken. */
.btn.quiet{
  background:transparent;border-color:transparent;color:var(--ink2);
  font-weight:400;letter-spacing:0;text-decoration:underline;text-underline-offset:3px;
  padding-left:0;padding-right:0;
}
.btn.quiet:hover{background:transparent;color:var(--oxblood)}

/* ---- an entry struck from the register --------------------------------- */
/* A deed book does not lose the page. The line is ruled through, the reason is
   written beside it, and the entry stays where it was. */
.struck-title,
.entry h2 a.struck-title,
.entry h3 a.struck-title{text-decoration:line-through;text-decoration-thickness:2px;
  text-decoration-color:var(--oxblood);text-underline-offset:0}
.strike{border:1.5px solid var(--oxblood);background:var(--oxblood-wash);padding:11px 12px;margin:0 0 13px}
.strike .caps{color:var(--oxblood)}
.strike p{margin:5px 0 0}
.stamp.struck{border-color:var(--oxblood);color:var(--oxblood);background:var(--oxblood-wash);transform:rotate(-1.5deg)}

/* ---- what the register is NOT showing ---------------------------------- */
.partial{border-left:3px solid var(--oxblood);background:var(--paper);padding:7px 0 7px 11px;
  margin:0 0 13px;font-size:13px;color:var(--ink2)}

/* ---- search ------------------------------------------------------------ */
.qmeta{border-bottom:1px solid var(--rule);background:var(--parchment2);padding:9px 13px;font-size:12.5px;color:var(--ink2)}
.qmeta strong{color:var(--ink)}

/* ---- your account ------------------------------------------------------ */
.acct-cols{display:grid;grid-template-columns:1fr;gap:0 16px}
@media(min-width:560px){.acct-cols{grid-template-columns:1fr 1fr}}
.acct-list{list-style:none;margin:6px 0 0;padding:0;border-top:1px solid var(--rule)}
.acct-list li{border-bottom:1px solid var(--rule);padding:7px 0;display:flex;gap:10px;
  align-items:baseline;justify-content:space-between}
.acct-list li b{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;font-weight:500}
.acct-list li span{min-width:0;overflow-wrap:anywhere}
.progress{border:1px solid var(--indigo);background:var(--paper);padding:9px 11px;margin:0 0 12px;font-size:13px}

.skip{position:absolute;left:-9999px}
.skip:focus{left:8px;top:8px;background:var(--paper);padding:8px;z-index:9;border:1px solid var(--indigo)}

/* ---- reachable with a thumb, visible to a keyboard --------------------- */
/* Measured with tools/a11y.js, not assumed. Three rules and one colour
   accounted for all 42 failures this app had on 11 September: --ink3 read at
   3.67:1 on the banded rows, and every control stood between 16px and 42px
   against a 44px floor. The floor is not a preference — it is a person holding
   a cheap phone one-handed in a yard, and the difference between opening the
   right record and the one below it. */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px}
.btn.sm{min-height:44px}
.tabs a{display:flex;align-items:center;min-height:44px;padding:0 13px}
input,select{min-height:44px}
input[type=file]{min-height:44px}
/* A link inside a sentence keeps its place in the line: the padding grows the
   hit area and the negative margin gives the space straight back, so the
   paragraph sets exactly as it did and the target is 44px high. */
main a:not(.btn):not(.tabs a), footer.foot a, #trail a{
  display:inline-block;max-width:100%;padding:15px 0;margin:-15px 0;
}
.entry h2 a{display:inline-block;max-width:100%;padding:12px 0;margin:-12px 0}
/* The ring is on :focus rather than :focus-visible alone. A register gets used
   on a phone and on a borrowed desktop keyboard, and a ring that appears after
   a mouse click costs an outline nobody minds; one that never appears strands
   whoever is tabbing. */
a:focus,button:focus,select:focus,input:focus,textarea:focus,[tabindex]:focus{
  outline:3px solid var(--indigo);outline-offset:2px;
}
@media (forced-colors: active){
  a:focus,button:focus,select:focus,input:focus,textarea:focus,[tabindex]:focus{
    outline:3px solid Highlight;
  }
}

<style>/* Injected into every app at build time. A printed page must be the RECORD,
   not a photograph of an app: no navigation, no buttons, no banners, no
   coloured blocks that come out as grey smears on a mono printer. */
@media print {
  #mend-strip, nav, .noprint, [data-noprint] { display: none !important; }
  html, body { background: #fff !important; color: #000 !important;
               padding-bottom: 0 !important; margin: 0 !important; }
  body { font-size: 11.5pt; }
  a[href^="http"]::after { content: " (" attr(href) ")"; font-size: 9pt; word-break: break-all; }
  a { text-decoration: none; color: #000 !important; }
  /* Progress bars and status pills are colour on screen and meaningless in
     grey, so print gives them an outline and lets the number carry the meaning. */
  [class*="bar"], [class*="pill"], [class*="badge"], [class*="stamp"] {
    box-shadow: none !important; border: 1px solid #000 !important;
    background: #fff !important; color: #000 !important;
  }
  button, input[type="button"], input[type="submit"], select { display: none !important; }
  input, textarea { border: none !important; padding: 0 !important; font: inherit !important; }
  table { page-break-inside: auto; } tr { page-break-inside: avoid; }
  h1, h2, h3 { page-break-after: avoid; }
  /* When one element is being printed on purpose, print only that.
     CSS cannot select an ancestor, so printRecord() marks the chain from the
     target up to <body> with data-print-path. Without that, a target nested
     anywhere below body had its own parent hidden and printed a blank page. */
  body[data-printing] *:not([data-print-path]):not([data-print-target]):not([data-print-target] *) {
    display: none !important;
  }
  body[data-printing] [data-print-path] {
    display: block !important;
    margin: 0 !important; padding: 0 !important; border: none !important;
    background: none !important; box-shadow: none !important; max-width: none !important;
  }
  body[data-printing] [data-print-target],
  body[data-printing] [data-print-target] * { display: revert !important; }
  body[data-printing] [data-print-target] { display: block !important; }
  @page { margin: 16mm; }
}

<script>
(function(){
'use strict';

/* =========================================================================
   REFERENCE DATA — mirrors db/004_reference.sql (mafisa_categories).

   `proof` names the document type a category needs, and since
   db/005_verification.sql it is a GATE rather than guidance. It used to be
   neither: the old trigger asked only for a verified document belonging to the
   owner and never looked at its kind, so a trade certificate was accepted as
   proof of owning a breaker. It is read now, and this UI reads it the same way.

   Where `proof` is null there is no registry to appeal to — nobody registers a
   power drill — and the rule changes shape instead of disappearing: a verified
   IDENTITY document is required, and the register must not then go on to imply
   that ownership was established. It was not.

   In connected mode the mafisa_categories table is authoritative and this list
   is only the fallback for device preview, where no such table is seeded. The
   self-test asserts the two agree wherever both exist.
   ========================================================================= */
var CATEGORY_MIRROR = [
  {code:'vehicle',      name:'Bakkie / vehicle',                 st:'Koloi',       proof:'vehicle_registration'},
  {code:'tractor',      name:'Tractor & implements',             st:null,          proof:'vehicle_registration'},
  {code:'trailer',      name:'Trailer',                          st:null,          proof:'vehicle_registration'},
  {code:'livestock',    name:'Livestock',                        st:'Liphoofolo',  proof:null},
  {code:'land',         name:'Farmland',                         st:'Masimo',      proof:'title_deed'},
  {code:'premises',     name:'Premises / storage',               st:null,          proof:'lease'},
  {code:'powertool',    name:'Power tools',                      st:null,          proof:null},
  {code:'construction', name:'Construction equipment',           st:null,          proof:null},
  {code:'generator',    name:'Generator & power',                st:null,          proof:null},
  {code:'event',        name:'Event equipment (tents, chairs, PA)',st:null,         proof:null},
  {code:'catering',     name:'Catering equipment',               st:null,          proof:null},
  {code:'media',        name:'Cameras & AV',                     st:null,          proof:null},
  {code:'sewing',       name:'Sewing & textile machines',        st:null,          proof:null},
  {code:'welding',      name:'Welding plant',                    st:null,          proof:null}
];
function categories(){
  var rows = MEND.all('mafisa_categories');
  if (!rows.length) return CATEGORY_MIRROR;
  var order = {};
  CATEGORY_MIRROR.forEach(function(c, i){ order[c.code] = i; });
  return rows.map(function(r){
    return {code:r.code, name:r.name_en, st:r.name_st || null,
            proof:(r.proof == null ? null : r.proof)};
  }).sort(function(a,b){
    var ai = order[a.code] == null ? 99 : order[a.code];
    var bi = order[b.code] == null ? 99 : order[b.code];
    return ai - bi;
  });
}
var DOC_LABEL = {
  national_id:'National identity document', passport:'Passport', drivers_licence:'Driver’s licence',
  trade_certificate:'Trade certificate', professional_registration:'Professional registration',
  company_registration:'Company registration', vehicle_registration:'Vehicle registration',
  title_deed:'Title deed', lease:'Lease', proof_of_address:'Proof of address', membership:'Membership'
};
/* The three kinds that answer "who is this", per mafisa_listing_needs_proof()
   in db/005_verification.sql. Not a UI preference — that IS the list the
   database checks, and if it changes there it must change here. */
var IDENTITY_KINDS = ['national_id','passport','company_registration'];
var IDENTITY_WORDS = 'a national identity document, a passport or a company registration';

/* What may be uploaded here. Mirrors the bucket in db/006_storage.sql. */
var UPLOAD_KINDS_OWNERSHIP = ['vehicle_registration','title_deed','lease'];
var UPLOAD_MIME = ['image/jpeg','image/png','image/heic','application/pdf'];
var UPLOAD_MAX  = 10485760;

var LOAN_STATES = ['requested','agreed','out','returned'];
/* A state is read aloud in whichever language the page is in, so it cannot be a
   frozen map built at load time — the language toggle would not reach it. */
function stateWord(st){ return MEND.t('mafisa.st.' + st); }

/* =========================================================================
   SMALL HELPERS
   ========================================================================= */
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function $(sel, root){ return (root||document).querySelector(sel); }
function pad(n){ return (n<10?'0':'') + n; }
/* mafisa_categories carries name_st for four of the fourteen and null for the
   rest (db/004_reference.sql). Where the table has a Sesotho name this uses it;
   where it does not, the English name stands rather than a word I invented for
   a machine I have not seen. Ten of the fourteen have name_st null in the
   table; filling those in is a change to db/004_reference.sql and to whoever
   owns it, not a thing to guess at here. */
function catName(code){
  var c = catOf(code); if (!c) return code;
  return (MEND_I18N.lang() === 'st' && c.st) ? c.st : c.name;
}
function catOf(code){ var cs = categories(); for (var i=0;i<cs.length;i++) if (cs[i].code===code) return cs[i]; return null; }
/* A document kind is a name a person reads, so it follows the language. The
   shared table (core/i18n.js) has seven of the eleven; the other four live in
   this app's own file. DOC_LABEL stays as the last-resort fallback so an
   unknown kind still renders as words rather than an identifier. */
function docLabel(kind){
  var shared = 'doc.' + kind, own = 'mafisa.doc.' + kind;
  var v = MEND.t(shared);   if (v !== shared) return v;
  v = MEND.t(own);          if (v !== own)    return v;
  return DOC_LABEL[kind] || String(kind||'Document').replace(/_/g,' ');
}
function byId(list, id){ for (var i=0;i<list.length;i++) if (list[i].id===id) return list[i]; return null; }
function nameOf(pid){ var p = MEND.profile(pid); return p ? p.display_name : 'Unknown'; }

/* Record numbers. A register entry without a number is not a register entry.
   Derived from position in the append-only table, so it is stable. */
function recNo(prefix, table, id){
  var rows = MEND.all(table);
  var idx = -1;
  for (var i=0;i<rows.length;i++) if (rows[i].id===id) { idx = i; break; }
  if (idx < 0) return prefix + '-????-????';
  var row = rows[idx];
  var yr = row.created_at ? new Date(row.created_at).getFullYear() : 2026;
  var n = String(idx+1); while (n.length < 4) n = '0'+n;
  return prefix + '-' + yr + '-' + n;
}
var assetNo = function(id){ return recNo('MF','mafisa_assets',id); };
var loanNo  = function(id){ return recNo('ML','mafisa_loans',id); };

/* ---- dates -------------------------------------------------------------- */
function dayCount(from, to){          // inclusive: 14–16 Sept is three days
  return Math.round((Date.parse(to+'T00:00:00Z') - Date.parse(from+'T00:00:00Z'))/86400000) + 1;
}
function overlaps(aFrom,aTo,bFrom,bTo){ return aFrom <= bTo && aTo >= bFrom; }
function isoAdd(iso, days){
  var d = new Date(Date.parse(iso+'T00:00:00Z')); d.setUTCDate(d.getUTCDate()+days);
  return d.toISOString().slice(0,10);
}
function period(from,to){ return MEND.fmtDate(from) + ' to ' + MEND.fmtDate(to); }

/* =========================================================================
   LANGUAGE
   t() returns the KEY when a string is missing, so a gap shows up in testing
   rather than as a blank line on somebody's screen.
   ========================================================================= */
function T(k, v){ return MEND.t(k, v); }

/* =========================================================================
   LEAVING THE APP — as text, and as paper
   Plenty of the people on either side of a loan have no smartphone. A record
   has to be able to become text somebody pastes into WhatsApp, and paper two
   people can both hold and sign.

   MEND.share() falls all the way down: share sheet, clipboard, then the text
   handed back. THE LAST CASE IS THE ONE THAT HAS TO WORK — it is shown in a
   box that can be selected, because a button that appears to do nothing is
   worse than no button.
   ========================================================================= */
var shareBox = null;         // {title, text, via}
var SELF = MEND.HOSTS.mafisa;   // where this copy is actually served from
/* Printed on a sheet that leaves the building — the address a reader can type. */
function hostLabel(){ return String(SELF).replace(/^https?:\/\//, '').replace(/\/$/, ''); }

function doShare(spec){
  MEND.share(spec).then(function(res){
    if (res.via === 'cancelled') return;
    shareBox = { title: spec.title, text: res.text, via: res.via };
    render();
    window.scrollTo(0, 0);
  });
}
function shareBoxHtml(){
  if (!shareBox) return '';
  var lead = shareBox.via === 'clipboard' ? T('mafisa.share.copied')
           : shareBox.via === 'share-sheet' ? T('mafisa.share.shared')
           : T('mafisa.share.manual');
  return '<div class="sharebox" data-noprint>' +
    '<div class="caps">' + esc(T('mafisa.share.heading')) + '</div>' +
    '<p class="small" style="margin:5px 0 8px">' + esc(lead) + '</p>' +
    '<textarea id="sharetext" readonly>' + esc(shareBox.text) + '</textarea>' +
    '<div class="btns">' +
      '<a class="btn sm" href="' + esc(MEND.whatsappLink('', shareBox.text)) + '" target="_blank" rel="noopener">' +
        esc(T('mafisa.share.whatsapp')) + '</a>' +
      '<button class="btn sm ghost" data-act="share-close">' + esc(T('app.close')) + '</button>' +
    '</div></div>';
}

function printSheet(html, title){
  var el = document.getElementById('printsheet');
  if (!el){
    el = document.createElement('div');
    el.id = 'printsheet'; el.className = 'printsheet';
    document.body.appendChild(el);
  }
  el.innerHTML = html;
  MEND.printRecord(el, title);
}
function sheetFoot(){
  return '<div class="foot">MAFISA · ' + esc(T('mafisa.pr.tagline')) + ' · MEND GROUP (PTY) LTD · ' +
    'Reg No. 96070 · TIN 200176439-4 · Maseru, Lesotho<br>' +
    esc(T('mafisa.pr.printed', {date: MEND.fmtDate(MEND.today())})) + ' · ' + esc(hostLabel()) +
    (MEND.status === 'connected' ? '' :
      '<br><strong>' + esc(T('mafisa.pr.notserver')) + '</strong> ' +
      esc(MEND.CONFIGURED ? T('mafisa.pr.lastheld') : T('mafisa.pr.invented'))) +
    '</div>';
}

/* ---- an asset, as text and as paper ------------------------------------ */
function assetLines(a){
  var v = proofVerdict(a);
  var st = MEND.standing(a.owner_id);
  var owner = MEND.profile(a.owner_id) || {};
  return [
    assetNo(a.id),
    T('mafisa.category') + ': ' + catName(a.category) + ' · ' + a.district,
    T('mafisa.dailyrate') + ': ' + MEND.M(a.daily_cents) + ' · ' + T('mafisa.deposit') + ': ' + MEND.M(a.deposit_cents),
    T('mafisa.owner') + ': ' + owner.display_name + ' · ' + MEND.star(st.rating) + ' · ' +
      st.jobs_completed + ' ' + T('rep.jobs'),
    owner.phone ? T('app.phone') + ': ' + owner.phone : '',
    a.condition ? T('mafisa.condition') + ': ' + a.condition : '',
    v.line,
    (function(){ var m = struckOf(a.id); return m ? strikeLine(m)
                      : (a.listed ? T('mafisa.share.listed') : T('mafisa.share.held')); })()
  ];
}
function shareAsset(id){
  var a = byId(MEND.all('mafisa_assets'), id); if (!a) return;
  doShare({ title: 'MAFISA · ' + a.title, lines: assetLines(a), url: SELF,
            table: 'mafisa_assets', id: a.id });
}
function printAsset(id){
  var a = byId(MEND.all('mafisa_assets'), id); if (!a) return;
  var v = proofVerdict(a);
  var owner = MEND.profile(a.owner_id) || {};
  var st = MEND.standing(a.owner_id);
  var ls = loansOf(a.id).sort(function(x,y){ return x.from_date.localeCompare(y.from_date); });
  printSheet(
    '<div class="hd"><div><div class="caps">Mafisa · ' + esc(T('mafisa.asset.record')) + '</div>' +
      '<h1>' + esc(a.title) + '</h1></div><div class="no">' + esc(assetNo(a.id)) + '</div></div>' +
    '<table><tbody>' +
      '<tr><th>' + esc(T('mafisa.owner')) + '</th><td>' + esc(owner.display_name) +
        (owner.phone ? ' · ' + esc(owner.phone) : '') + '</td></tr>' +
      '<tr><th>' + esc(T('ui.category')) + '</th><td>' + esc(catName(a.category)) + '</td></tr>' +
      '<tr><th>' + esc(T('app.district')) + '</th><td>' + esc(a.district) + '</td></tr>' +
      '<tr><th>' + esc(T('mafisa.dailyrate')) + '</th><td>' + esc(MEND.M(a.daily_cents)) + '</td></tr>' +
      '<tr><th>' + esc(T('mafisa.deposit')) + '</th><td>' + esc(MEND.M(a.deposit_cents)) + '</td></tr>' +
      '<tr><th>' + esc(T('mafisa.condition')) + '</th><td>' + esc(a.condition || '—') + '</td></tr>' +
      '<tr><th>' + esc(T('mafisa.as.standing')) + '</th><td>' + esc(MEND.star(st.rating)) + ' · ' +
        esc(T('mafisa.pr.standing', {jobs: st.jobs_completed, reviews: st.review_count})) + '</td></tr>' +
      '<tr><th>' + esc(T('mafisa.pr.reg')) + '</th><td>' +
        esc((function(){ var m = struckOf(a.id); return m ? strikeLine(m)
              : (a.listed ? T('mafisa.pr.reg.in') : T('mafisa.held_back')); })()) + '</td></tr>' +
    '</tbody></table>' +
    '<div class="terms"><strong>' + esc(T('mafisa.pr.checked')) + '</strong><br>' + esc(v.line) +
      '<br><br>' + esc(T('mafisa.pr.nodoc')) + '</div>' +
    '<h3>' + esc(T('mafisa.pr.committed')) + '</h3>' +
    (ls.length
      ? '<table><thead><tr><th>' + esc(T('mafisa.as.th.record')) + '</th><th>' + esc(T('ui.from')) + '</th>' +
        '<th>' + esc(T('ui.to')) + '</th><th>' + esc(T('mafisa.days')) + '</th>' +
        '<th>' + esc(T('mafisa.as.th.state')) + '</th></tr></thead><tbody>' +
        ls.map(function(l){
          return '<tr><td>' + esc(loanNo(l.id)) + '</td><td>' + esc(MEND.fmtDate(l.from_date)) + '</td><td>' +
            esc(MEND.fmtDate(l.to_date)) + '</td><td>' + dayCount(l.from_date, l.to_date) + '</td><td>' +
            esc(stateWord(l.state)) + '</td></tr>';
        }).join('') + '</tbody></table>'
      : '<p>' + esc(T('mafisa.my.noloansasset')) + '</p>') +
    sheetFoot(),
    'Mafisa ' + assetNo(a.id));
}

/* ---- a loan, as text and as a thing two people sign --------------------- */
function loanLines(l){
  var a = byId(MEND.all('mafisa_assets'), l.asset_id) || {};
  var f = a.id ? loanFigures(a, l.from_date, l.to_date) : {days:0, rent_cents:0, deposit_cents:0};
  return [
    loanNo(l.id) + ' · ' + stateWord(l.state),
    a.title || '',
    T('mafisa.owner') + ': ' + nameOf(a.owner_id),
    T('mafisa.borrower') + ': ' + nameOf(l.borrower_id),
    T('mafisa.period') + ': ' + period(l.from_date, l.to_date) + ' (' + f.days + ' ' + T('app.days') + ')',
    T('mafisa.rent') + ': ' + MEND.M(l.agreed_cents) + ' · ' + T('mafisa.deposit') + ': ' + MEND.M(f.deposit_cents),
    T('money.records_only')
  ];
}
function shareLoan(id){
  var l = byId(MEND.all('mafisa_loans'), id); if (!l) return;
  doShare({ title: 'MAFISA · ' + loanNo(l.id), lines: loanLines(l), url: SELF,
            table: 'mafisa_loans', id: l.id });
}

/* The printed loan record. Two names, two signature blocks, two dates — a
   piece of paper the owner and the borrower can each keep a copy of. It is the
   only artefact either of them has if the platform is not in front of them. */
function printLoan(id){
  var l = byId(MEND.all('mafisa_loans'), id); if (!l) return;
  var a = byId(MEND.all('mafisa_assets'), l.asset_id);
  if (!a) return;
  var f = loanFigures(a, l.from_date, l.to_date);
  var owner = MEND.profile(a.owner_id) || {};
  var borrower = MEND.profile(l.borrower_id) || {};
  var e = engagementFor(l.id);
  var pays = e ? MEND.settlementsFor(e.id) : [];

  printSheet(
    '<div class="hd"><div><div class="caps">Mafisa · ' + esc(T('mafisa.loan.record')) + '</div>' +
      '<h1>' + esc(a.title) + '</h1>' +
      '<div class="caps">' + esc(assetNo(a.id)) + '</div></div>' +
      '<div class="no">' + esc(loanNo(l.id)) + '</div></div>' +

    '<table><tbody>' +
      '<tr><th style="width:34%">' + esc(T('mafisa.owner')) + '</th><td>' + esc(owner.display_name) +
        (owner.village || owner.district ? '<br>' + esc([owner.village, owner.district].filter(Boolean).join(', ')) : '') +
        (owner.phone ? '<br>' + esc(owner.phone) : '') + '</td></tr>' +
      '<tr><th>' + esc(T('mafisa.borrower')) + '</th><td>' + esc(borrower.display_name) +
        (borrower.village || borrower.district ? '<br>' + esc([borrower.village, borrower.district].filter(Boolean).join(', ')) : '') +

/* =========================================================================
   SETTLEMENT — the register RECORDS that money moved. It never moves it.
   No card rail exists for a Lesotho merchant, and holding other people's funds
   is licensed activity. So the money goes M-Pesa, EcoCash, bank or hand to
   hand, exactly as it already does, and what the register can give the two of
   them is one entry they both agreed to, with the transaction code on it.

   There is no Pay button in this file and there is not going to be one.
   ========================================================================= */
var ELECTRONIC = ['mpesa','ecocash','bank_transfer'];
var settleOpen = null, settleErr = null;
function methodLabel(m){ return T('mafisa.method.' + m); }

/* MEND.canSettle is the ONLY place the rule lives. This puts its answer into
   Sesotho and does nothing else. If core changes its wording the match misses
   and the English comes through — degraded, never wrong. */
function settleReason(msg){
  if (!msg) return msg;
  var m = String(msg);
  if (/^put in how much/.test(m))                    return T('mafisa.settle.err.amount');
  if (/only be between the two people/.test(m))      return T('mafisa.settle.err.parties');
  if (/same person on both sides/.test(m))           return T('mafisa.settle.err.same');
  var mm = m.match(/^an?\s+(.+?)\s+payment needs its transaction code/);
  if (mm) return T('mafisa.settle.err.ref', { method: mm[1] });
  if (/more than twice/.test(m))                     return T('mafisa.settle.err.toomuch');
  if (/only the two people in this payment/.test(m)) return T('mafisa.settle.err.nobody');
  return m;
}

function paidRow(x, meId){
  var mineDone = (x.payer_id === meId && x.confirmed_by_payer) ||
                 (x.payee_id === meId && x.confirmed_by_payee);
  var iAmParty = x.payer_id === meId || x.payee_id === meId;
  var them = x.payer_id === meId ? x.payee_id : x.payer_id;
  var line = x.agreed_by_both ? T('money.settled')
           : (x.confirmed_by_payer || x.confirmed_by_payee)
             ? (mineDone ? T('mafisa.settle.mine.done', { name: nameOf(them) })
                         : T('mafisa.settle.theirs.done', { name: nameOf(them) }))
             : T('mafisa.settle.state.new');
  return '<div class="paid' + (x.agreed_by_both ? ' both' : '') + '">' +
    '<div class="hd"><span class="amt">' + esc(MEND.M(x.amount_cents)) + '</span>' +
      '<span class="caps">' + esc(methodLabel(x.method)) + ' · ' + esc(MEND.fmtDate(x.paid_on)) + '</span></div>' +
    '<div class="small break" style="margin-top:4px">' +
      esc(T('mafisa.settle.paidto', { payer: nameOf(x.payer_id), payee: nameOf(x.payee_id) })) + '</div>' +
    (x.reference ? '<div class="ref">' + esc(T('mafisa.settle.ref')) + ': ' + esc(x.reference) + '</div>' : '') +
    (x.note ? '<div class="small muted break">' + esc(x.note) + '</div>' : '') +

        esc(x.id) + '">' + esc(T('mafisa.settle.confirm')) + '</button></div>'

/* =========================================================================
   CONDITION PHOTOGRAPHS

   Mafisa is where disputes actually happen. A bakkie goes out clean and comes
   back with a cracked light, and two people remember the day differently. The
   only thing that settles that is a photograph taken on the day, which is why
   both parties can attach one on the way out and on the way back.

   core/mend.js shrinks the file to 1280px IN THE BROWSER before it goes
   anywhere — a 6MB photograph off a phone camera, over a connection somebody
   pays for by the megabyte, is a real cost, and for a cracked light 1280px
   says everything 4000px does.

   loanCondition().recorded_out / recorded_in report when the SHUTTER went, not
   when the file arrived. With an outbox those can be a week apart and it is
   the first one that matters, so the screen labels which is which.
   ========================================================================= */

/* The picture itself.

   This page used to keep only the object URL of the file the person had just
   chosen — lasting exactly as long as the page — because core gave documents a
   documentLink() and photographs nothing of the kind. That was reported and
   core has since grown MEND.photoLink(), which signs a short-lived URL the same
   way. So: the session object URL is still used when it is there (it costs
   nothing and needs no network), and otherwise a signed link is fetched.

   In device-preview mode there is no server to sign anything, so the record of
   the photograph is shown and the page says plainly that the image itself is
   not on the screen. That is the honest answer, not a broken frame. */
var PHOTO_VIEW = {};
var photoOpen = null;          // 'condition_out' | 'condition_in' | null
var photoErr = null;
var photoBusy = false;

function stampAt(iso){
  if (!iso) return '—';
  var d = String(iso);
  return MEND.fmtDate(d.slice(0,10)) + (d.length > 11 ? ' · ' + d.slice(11,16) : '');
}
function photoNo(id){ return recNo('MP', 'attachments', id); }

function photoBlock(x){
  var url = PHOTO_VIEW[x.id];
  var alt = x.caption ? x.caption : T('mafisa.cond.file');
  /* When there is no cached URL and a server IS connected, leave a slot for
     fetchPhotos() to fill with a signed link. When nothing is connected, say so
     rather than leaving an empty frame that looks like a failure. */
  var pending = !url && MEND.status === 'connected';
  return '<div class="photo">' +
    (url
      ? '<img src="' + esc(url) + '" alt="' + esc(alt) + '">'
      : pending
        ? '<div class="noimg break" data-photo="' + esc(x.id) + '" data-alt="' + esc(alt) + '">' +
          esc(T('app.loading')) + '</div>'
        : '<div class="noimg break">' + esc(T('mafisa.cond.noimage')) + '</div>') +
    (x.caption ? '<p class="cap break">' + esc(x.caption) + '</p>' : '') +
    '<p class="cap muted" style="margin-top:4px">' + esc(T('mafisa.cond.by', {name: nameOf(x.uploaded_by)})) + '</p>' +
    '<div class="when">' + esc(photoNo(x.id)) + syncMark(x) + '</div>' +
    '<div class="when">' + esc(T('mafisa.cond.taken', {when: stampAt(x.taken_at || x.created_at)})) + '</div>' +
    '<div class="when muted">' + esc(T('mafisa.cond.reached', {when: stampAt(x.created_at)})) + '</div>' +
  '</div>';
}

function photoForm(l, kind){
  return '<form id="condForm" data-loan="' + esc(l.id) + '" data-kind="' + esc(kind) + '" novalidate style="margin-top:11px">' +
    (photoErr ? '<div class="refusal"><div class="caps">' + esc(T('mafisa.refused')) + '</div>' +
                '<p class="break" style="margin:5px 0 0">' + esc(photoErr) + '</p></div>' : '') +
    /* Said BEFORE the file is chosen. Afterwards is too late to be a warning. */
    '<div class="finalwarn break"><strong>' + esc(T('mafisa.cond.final')) + '</strong></div>' +
    '<label class="f"><span class="caps">' + esc(T('mafisa.cond.file')) + '</span>' +
      '<input type="file" name="file" accept="image/*" capture="environment"></label>' +
    '<label class="f"><span class="caps">' + esc(T('mafisa.cond.caption')) + '</span>' +
      '<input type="text" name="caption" maxlength="120">' +
      '<div class="hint break">' + esc(T('mafisa.cond.caption.hint')) + '</div></label>' +
    '<div class="btns">' +
      '<button class="btn" type="submit"' + (photoBusy ? ' disabled' : '') + '>' +
        esc(photoBusy ? T('mafisa.cond.attaching') : T('mafisa.cond.attach')) + '</button>' +
      '<button class="btn ghost" type="button" data-act="cond-cancel">' + esc(T('app.cancel')) + '</button>' +
    '</div>' +
  '</form>';
}

function conditionColumn(l, kind, rows, firstTaken, mayAttach){
  var label = kind === 'condition_out' ? T('mafisa.cond.out') : T('mafisa.cond.in');
  var count = rows.length === 1 ? T('mafisa.cond.count1') : T('mafisa.cond.count', {n: rows.length});

              'data-kind="' + esc(kind) + '">' +
              esc(kind === 'condition_out' ? T('mafisa.cond.add_out') : T('mafisa.cond.add_in')) + '</button></div>')
        : '') +

function conditionSection(l){
  var a = byId(MEND.all('mafisa_assets'), l.asset_id);
  var me = MEND.me();
  var party = !!(me && a && (me.id === a.owner_id || me.id === l.borrower_id));
  var c = MEND.loanCondition(l.id);

     : !party ? '<p class="small break" style="margin:8px 0 0">' + esc(T('mafisa.cond.notparty')) + '</p>' : '');

  return '<section class="sheet">' +
    '<div class="sheet-hd"><h2>' + esc(T('mafisa.cond.heading')) + '</h2>' +
      '<span class="caps">' + esc(T('mafisa.cond.sub')) + '</span></div>' +

/* =========================================================================
   DISPUTES

   THE PLATFORM DOES NOT ADJUDICATE. MEND GROUP is not a court. It decides
   nothing, awards nothing and holds no money. What it holds is both accounts,
   dated, neither revisable once given — which is what ends most disagreements
   between people who have to keep living in the same district.

   Nothing on this screen may read as a verdict. There is no "who was right",
   no score, no finding; the outcome is what the TWO of them wrote down and
   both accepted, and until both have, it is not closed.
   ========================================================================= */
var dispOpen = false;        // the raise-it form
var dispErr = null;
var sayErr = {};             // dispute id -> refusal from addStatement

function dispNo(id){ return recNo('DS', 'disputes', id); }

function otherParty(e, meId){
  return e.provider_id === meId ? e.counterparty_id : e.provider_id;
}

/* canDispute() also enforces the claim length, and asking it before anything
   has been typed would answer "say what went wrong" when the real question is
   whether this person may raise anything at all. A sentinel claim isolates the
   structural refusals; the length rule is enforced on submit, by core. */
function disputeBar(e, meId){
  if (!e) return T('mafisa.disp.noeng');
  var why = MEND.canDispute(e.id, {against: otherParty(e, meId), claim: 'placeholder claim'});
  if (!why) return null;
  if (/has not been agreed yet/.test(why))            return T('mafisa.disp.err.tooearly');
  if (/only the two people/.test(why))                return T('mafisa.disp.err.nobody');
  if (/that is you|was not part of this job/.test(why)) return T('mafisa.disp.err.nobody');
  if (/sign in first/.test(why))                      return T('mafisa.err.nosignin');
  return why;
}

function raiseForm(l, e, meId){
  var against = otherParty(e, meId);
  return '<form id="dispRaiseForm" data-eng="' + esc(e.id) + '" data-against="' + esc(against) + '" novalidate style="margin-top:12px">' +
    (dispErr ? '<div class="refusal"><div class="caps">' + esc(T('mafisa.refused')) + '</div>' +
               '<p class="break" style="margin:5px 0 0">' + esc(dispErr) + '</p></div>' : '') +
    '<div class="noverdict break">' + esc(T('dispute.no_verdict')) + '</div>' +
    '<p class="small" style="margin:0 0 10px"><span class="caps">' + esc(T('dispute.against')) + '</span> ' +
      '<strong class="break">' + esc(nameOf(against)) + '</strong></p>' +
    '<label class="f"><span class="caps">' + esc(T('dispute.what_kind')) + '</span>' +
      '<select name="kind">' + MEND.DISPUTE_KINDS.map(function(k){
        return '<option value="' + esc(k) + '">' + esc(T('dispute.k.' + k)) + '</option>'; }).join('') +
      '</select></label>' +
    '<label class="f"><span class="caps">' + esc(T('mafisa.disp.write')) + '</span>' +
      '<textarea name="claim" maxlength="2000"></textarea>' +
      '<div class="hint break">' + esc(T('mafisa.disp.write.hint')) + '</div></label>' +
    '<label class="f"><span class="caps">' + esc(T('dispute.amount')) + '</span>' +
      '<input type="number" name="amount" min="0" step="0.01" inputmode="decimal">' +
      '<div class="hint break">' + esc(T('mafisa.disp.amount.hint')) + '</div></label>' +
    '<div class="finalwarn break"><strong>' + esc(T('dispute.final')) + '</strong></div>' +
    '<div class="btns">' +
      '<button class="btn" type="submit">' + esc(T('mafisa.disp.send')) + '</button>' +
      '<button class="btn ghost" type="button" data-act="disp-cancel">' + esc(T('app.cancel')) + '</button>' +
    '</div>' +
  '</form>';
}

/* The outcome. Either of them writes it; each accepts their OWN side; it closes
   when both have. Once one of them has written it, the other is shown the text
   as written and accepts THAT — not a second version of it. */
function outcomeBlock(d, meId){
  var isParty = (d.raised_by === meId || d.against === meId);
  var mineDone = (d.raised_by === meId && d.outcome_agreed_by_raiser) ||
                 (d.against === meId && d.outcome_agreed_by_other);
  var them = d.raised_by === meId ? d.against : d.raised_by;
  var theirsDone = (d.raised_by === meId ? d.outcome_agreed_by_other : d.outcome_agreed_by_raiser);
  var has = !!String(d.outcome || '').trim();

  var out = '<hr class="rule"><div class="caps" style="margin-bottom:5px">' + esc(T('dispute.outcome')) + '</div>';

  if (d.state === 'resolved'){
    return out + '<div class="accepted"><div class="caps">' + esc(T('mafisa.disp.closed')) + '</div>' +
      '<p class="break" style="margin:5px 0 0">' + esc(d.outcome) + '</p>' +
      '<p class="small" style="margin:6px 0 0">' +

/* =========================================================================
   THE TWO RULES THAT MATTER, EACH IN ONE PLACE.

   Every screen that shows, checks, saves or refuses goes through these. A
   figure shown on screen and the figure written to storage must come out of
   one function — that is how the TM Stone quote came to print a total the
   screen never showed.
   ========================================================================= */

/* The owner's verified documents, optionally of one kind only. */
function verifiedDocsOf(owner_id, kind){
  return MEND.all('documents').filter(function(d){
    return d.profile_id === owner_id && (!kind || d.kind === kind) && MEND.isVerified(d);
  });
}
/* The document that answers "who is this", or null. */
function verifiedIdentityOf(owner_id){
  var ds = MEND.all('documents').filter(function(d){
    return d.profile_id === owner_id && IDENTITY_KINDS.indexOf(d.kind) > -1 && MEND.isVerified(d);
  });
  return ds.length ? ds[0] : null;
}

/* Given a category and a document ROW, why the document cannot serve as proof.
   Split out from listingRefusal so the self-test can put a rejected or expired
   document of the right kind in front of it without writing one to the store. */
function proofDocRefusal(cat, doc, owner_id){
  if (!doc) return T('mafisa.pd.notonfile');
  if (doc.profile_id !== owner_id) return T('mafisa.pd.notowner');
  if (doc.kind !== cat.proof)
    return T('mafisa.pd.wrongkind', {have: docLabel(doc.kind).toLowerCase(),
                                     cat:  catName(cat.code),
                                     need: docLabel(cat.proof).toLowerCase()});
  var st = MEND.effectiveStatus(doc);          // never doc.status
  if (st === 'verified') return null;
  if (st === 'expired')  return T('mafisa.pd.expired', {doc: docLabel(doc.kind), date: MEND.fmtDate(doc.expires_on)});
  if (st === 'pending')  return T('mafisa.pd.pending',  {doc: docLabel(doc.kind)});
  if (st === 'rejected') return T('mafisa.pd.rejected', {doc: docLabel(doc.kind)});
  return T('mafisa.pd.unverified', {doc: docLabel(doc.kind)});
}

/* Mirrors trigger mafisa_listing_needs_proof() AS REWRITTEN in
   db/005_verification.sql. Two branches, and they prove different things:

     proof is a doc_type — a document of THAT KIND, verified, belonging to the
                           owner. Ownership is established.
     proof is null       — nothing on earth registers ownership of a power
                           drill, so the register does not pretend to. It
                           requires a verified identity document instead, and
                           ignores any ownership document attached, exactly as
                           the trigger does.

   Returns null when listing is permitted, otherwise the reason. */
function listingRefusal(owner_id, category, proof_doc_id){
  var cat = catOf(category);
  if (!cat) return T('mafisa.lr.nocat');

  if (cat.proof == null){
    if (!verifiedIdentityOf(owner_id))
      return T('mafisa.lr.noidentity', {cat: catName(cat.code), kinds: IDENTITY_WORDS});
    return null;
  }

  if (!proof_doc_id){
    // "You do not have one" and "you have one and have not picked it" are
    // different situations and must not read the same. The old message told a
    // man holding a verified vehicle registration that he needed a verified
    // vehicle registration, which is the kind of refusal that makes a person
    // stop trusting the screen rather than go and find the document.
    var held = verifiedDocsOf(owner_id, cat.proof);
    return held.length
      ? T('mafisa.lr.pickdoc', {cat: catName(cat.code), doc: docLabel(cat.proof).toLowerCase(), n: held.length})
      : T('mafisa.lr.needdoc', {cat: catName(cat.code), doc: docLabel(cat.proof).toLowerCase()});
  }
  return proofDocRefusal(cat, byId(MEND.all('documents'), proof_doc_id), owner_id);
}

/* Mirrors trigger mafisa_no_double_booking(). Returns the clashing loan or null.
   The SQL trigger fires when the NEW row is agreed/out; this refuses at request
   time as well, which is stricter than the database and never looser. */
function bookingClash(asset_id, from, to, exclude_loan_id){
  var loans = MEND.all('mafisa_loans');
  for (var i=0;i<loans.length;i++){
    var l = loans[i];
    if (l.asset_id !== asset_id) continue;
    if (exclude_loan_id && l.id === exclude_loan_id) continue;
    if (l.state !== 'agreed' && l.state !== 'out') continue;
    if (overlaps(from, to, l.from_date, l.to_date)) return l;
  }
  return null;
}

/* THE money function. Screen and storage both call this and nothing else. */
function loanFigures(asset, from, to){
  var days = dayCount(from, to);
  var daily = asset.daily_cents || 0;
  return { days: days, daily_cents: daily, rent_cents: days * daily,
           deposit_cents: asset.deposit_cents || 0 };
}

/* =========================================================================
   DERIVED VIEWS
   ========================================================================= */
/* What the register can honestly say about an asset, and not one word more.
   `basis` is the difference between two claims that must never be blurred:
     'ownership' — a document of the required kind says this is theirs
     'identity'  — nothing registers this kind of thing; all that was
                   established is WHO the owner is
   Every stamp, heading and sentence on screen is driven off this. */
function proofVerdict(asset){
  var cat = catOf(asset.category);
  if (!cat) return {ok:false, basis:'unknown',
    line: T('mafisa.pv.unknowncat', {cat: asset.category})};

  if (cat.proof == null){
    var idDoc = verifiedIdentityOf(asset.owner_id);
    if (idDoc) return {ok:true, basis:'identity', doc:idDoc,
      line: T('mafisa.pv.identity.ok', {cat: catName(cat.code), doc: docLabel(idDoc.kind).toLowerCase()})};
    return {ok:false, basis:'identity',
      line: T('mafisa.pv.identity.none', {kinds: IDENTITY_WORDS})};
  }

  var doc = asset.proof_doc_id ? byId(MEND.all('documents'), asset.proof_doc_id) : null;
  if (!doc) return {ok:false, basis:'ownership', required:cat.proof,
    line: T('mafisa.pv.nodoc', {doc: docLabel(cat.proof).toLowerCase()})};
  var why = proofDocRefusal(cat, doc, asset.owner_id);
  if (why) return {ok:false, basis:'ownership', required:cat.proof, doc:doc, line:why};
  return {ok:true, basis:'ownership', required:cat.proof, doc:doc,
    line: doc.expires_on
      ? T('mafisa.pv.ok.expires',  {doc: docLabel(doc.kind), date: MEND.fmtDate(doc.expires_on)})
      : T('mafisa.pv.ok.noexpiry', {doc: docLabel(doc.kind)})};
}
function engagementFor(loan_id){
  var es = MEND.all('engagements');
  for (var i=0;i<es.length;i++)
    if (es[i].subject_table === 'mafisa_loans' && es[i].subject_id === loan_id) return es[i];
  return null;
}
function loansOf(asset_id){
  return MEND.all('mafisa_loans').filter(function(l){ return l.asset_id === asset_id; });
}

/* =========================================================================
   RENDER PIECES
   ========================================================================= */
function stampProof(asset){
  var v = proofVerdict(asset);
  if (v.ok && v.basis === 'ownership') return '<span class="stamp ok">'+esc(T('mafisa.stamp.owned'))+'</span>';
  if (v.ok) return '<span class="stamp idv">'+esc(T('mafisa.stamp.identified'))+'</span>';
  return '<span class="stamp bad">'+esc(T('mafisa.stamp.noproof'))+'</span>';
}

/* A write that failed must never look like a write that worked. MEND.insert and
   MEND.update mark the row: '_sync' is 'saving' while it is in flight and
   'failed' with '_error' when Postgres refused it. In a register a record that
   never reached the database is worse than no record at all, so it is marked
   everywhere the row appears, not only in a banner that can be scrolled past. */
function syncMark(row){
  if (!row || !row._sync) return '';
  if (row._sync === 'failed') return ' <span class="sync" title="' + esc(row._error || '') + '">'+esc(T('sync.not_saved'))+'</span>';
  /* 'saving' covers two different situations and a person needs to know which:
     on its way to Postgres now, or sitting in the outbox because there is no
     signal. Neither is "saved", and neither is a failure. */
  return MEND.status === 'connected'
    ? ' <span class="sync wait">'+esc(T('outbox.sending'))+'</span>'
    : ' <span class="sync wait">'+esc(T('outbox.waiting'))+'</span>';
}
function syncLine(row){
  if (!row || row._sync !== 'failed') return '';
  return '<div class="alarm" style="margin:10px 0 0"><div class="caps">'+esc(T('mafisa.sync.notin'))+'</div>' +
    '<p class="small break" style="margin:5px 0 0">'+esc(T('mafisa.sync.notin.body'))+' ' +
    '<span class="mono">' + esc(row._error || T('mafisa.sync.noreason')) + '</span></p></div>';
}
function stampState(state){
  var cls = (state === 'returned') ? 'stamp st' : (state === 'out' || state === 'agreed') ? 'stamp fill'
          : (state === 'cancelled' || state === 'disputed') ? 'stamp bad' : 'stamp';
  return '<span class="'+cls+'">'+esc(stateWord(state))+'</span>';
}
function machine(state){
  var out = '<div class="machine">';
  for (var i=0;i<LOAN_STATES.length;i++){
    var s = LOAN_STATES[i];
    var idx = LOAN_STATES.indexOf(state);
    var cls = s === state ? 'on' : (idx > -1 && i < idx ? 'done' : '');
    out += '<b class="'+cls+'">'+esc(stateWord(s))+'</b>';
    if (i < LOAN_STATES.length-1) out += '<s>&rarr;</s>';
  }
  if (state === 'cancelled' || state === 'disputed') out += '<s>&nbsp;</s><b class="on">'+esc(stateWord(state))+'</b>';
  return out + '</div>';
}

function reviewsOf(pid, limit){

/* ---- the loan calendar --------------------------------------------------- */
function calendarFor(asset_id, months){
  var loans = loansOf(asset_id);
  var marks = {};
  loans.forEach(function(l){
    if (l.state !== 'agreed' && l.state !== 'out' && l.state !== 'requested') return;
    var d = l.from_date;
    var guard = 0;
    while (d <= l.to_date && guard++ < 400){
      if (l.state === 'requested'){ if (!marks[d]) marks[d] = 'req'; }
      else marks[d] = 'cmt';
      d = isoAdd(d, 1);
    }
  });
  var t = MEND.today();
  var start = new Date(Date.parse(t.slice(0,7)+'-01T00:00:00Z'));
  var out = '<div class="cals">';
  for (var m=0; m<(months||3); m++){
    var y = start.getUTCFullYear(), mo = start.getUTCMonth() + m;
    var first = new Date(Date.UTC(y, mo, 1));
    var yy = first.getUTCFullYear(), mm = first.getUTCMonth();
    var label = first.toLocaleDateString('en-ZA', {month:'long', year:'numeric'});
    var startDow = (first.getUTCDay() + 6) % 7;                 // Monday first
    var ndays = new Date(Date.UTC(yy, mm+1, 0)).getUTCDate();
    out += '<div><div class="cal-t">'+esc(label)+'</div><div class="cal">';
    ['M','T','W','T','F','S','S'].forEach(function(d){ out += '<div class="dow">'+d+'</div>'; });
    for (var p=0;p<startDow;p++) out += '<div class="pad"></div>';
    for (var d2=1; d2<=ndays; d2++){
      var iso = yy + '-' + pad(mm+1) + '-' + pad(d2);
      var cls = marks[iso] === 'cmt' ? 'cmt' : marks[iso] === 'req' ? 'req' : (iso < t ? 'past' : '');
      if (iso === t) cls += ' today';
      out += '<div class="'+cls+'">'+d2+'</div>';
    }
    out += '</div></div>';
  }
  out += '</div>';
  out += '<div class="legend">' +
    '<span><i class="cmt"></i>'+esc(T('mafisa.as.legend.cmt'))+'</span>' +
    '<span><i class="req"></i>'+esc(T('mafisa.as.legend.req'))+'</span>' +

/* =========================================================================
   SAYING SOMETHING IS WRONG

   A register whose entire claim is verified ownership needs somebody to be
   able to say "that is not his". db/020_abuse.sql keeps the report private to
   the reporter and the desk; MEND.reportSignal returns 0 for a single report
   on purpose, because one report is one opinion and publishing it would make
   this a place a person can be damaged by a single tap.

   The control is deliberately quiet. This is not an action to encourage.
   ========================================================================= */
var reportOpen = null;       // subject id whose form is open, or null
var reportErr  = null;

/* not_theirs first, because on an asset record it is the one that matters —
   but taken from the core's own list so a reason added there cannot silently
   go missing from this screen. */
function reportReasons(){
  var rs = MEND.REPORT_REASONS.slice();
  var i = rs.indexOf('not_theirs');
  if (i > 0) { rs.splice(i, 1); rs.unshift('not_theirs'); }
  return rs;
}

/* Why this person cannot report this thing, said in the page's language
   rather than in the core's English. */
function reportRefusal(table, id){
  var why = MEND.canReport(table, id);
  if (!why) return null;
  return /already/.test(why) ? T('report.already') : T('mafisa.rp.signin');
}

function reportBlock(table, id, mine){
  var n = MEND.reportSignal(table, id);
  var signal = n ? '<p class="small break" style="margin:0 0 8px"><strong>' +
    esc(T('report.signal', {n: n})) + '</strong></p>' : '';
  if (mine) return signal;          // reporting your own entry is not a thing

  if (reportOpen !== id){
    var why = reportRefusal(table, id);
    return '<div data-noprint style="margin-top:4px">' + signal +
      (why
        ? '<p class="small muted break" style="margin:0">' + esc(why) + '</p>'
        : '<button class="btn sm quiet" data-act="report-open" data-id="'+esc(id)+'">' +
          esc(T('report.this')) + '</button>') +

  }

  return '<div data-noprint style="margin-top:4px">' + signal +
    '<div class="note break" style="margin:0 0 12px">' + esc(T('mafisa.rp.claim')) + '</div>' +
    (reportErr ? '<div class="refusal"><div class="caps">'+esc(T('mafisa.refused'))+'</div>' +
       '<p class="break" style="margin:5px 0 0">'+esc(reportErr)+'</p></div>' : '') +
    '<form id="reportForm" data-table="'+esc(table)+'" data-id="'+esc(id)+'" novalidate>' +
      /* Said BEFORE the box, not after it is filled in. */
      '<p class="note break" style="margin:0 0 12px">' + esc(T('report.private')) + '</p>' +
      '<label class="f"><span class="caps">'+esc(T('report.why'))+'</span>' +
        '<select name="reason">' + reportReasons().map(function(r){
          return '<option value="'+esc(r)+'">'+esc(T('report.r.' + r))+'</option>'; }).join('') +
        '</select>' +
        '<div class="hint break">'+esc(T('mafisa.rp.notyours'))+'</div></label>' +
      '<label class="f"><span class="caps">'+esc(T('report.detail'))+' — '+esc(T('ui.optional'))+'</span>' +
        '<textarea name="detail" maxlength="2000"></textarea></label>' +
      '<div class="btns">' +
        '<button class="btn sm" type="submit">'+esc(T('mafisa.rp.send'))+'</button>' +
        '<button class="btn sm ghost" type="button" data-act="report-cancel">'+esc(T('app.cancel'))+'</button>' +
      '</div>' +
    '</form>' +
  '</div>';
}

/* =========================================================================
   A STRUCK ENTRY IS STILL A RECORD

   moderation_is_accountable() in db/020_abuse.sql sets listed = false when it
   hides an asset, so a taken-down entry would otherwise fall in among the ones
   waiting on paperwork and be described as missing proof — which is a second
   false statement on top of the disappearance. It gets its own treatment: the
   entry stays, ruled through, with the reason and the date.
   ========================================================================= */
function struckOf(id){
  var m = MEND.moderationOf('mafisa_assets', id);
  return (m && m.action === 'hidden') ? m : null;
}
/* The same sentence wherever the entry leaves this app — pasted into a
   WhatsApp group, or printed for a wall. A copy of a struck entry that does
   not say it was struck reads as a live listing, which is the whole reason
   it was taken down. */
function strikeLine(m){
  return T('mod.hidden') + ' · ' +
    T('mafisa.md.on', {date: MEND.fmtDate(String(m.created_at || '').slice(0,10))}) + ' · ' +
    T('mod.reason') + ': ' + (m.reason || '');
}
function strikeBlock(m, extra){
  return '<div class="strike break">' +
    '<div class="caps">' + esc(T('mod.hidden')) + ' · ' +
      esc(T('mafisa.md.on', {date: MEND.fmtDate(String(m.created_at || '').slice(0,10))})) + '</div>' +
    '<p><strong>' + esc(T('mod.reason')) + ':</strong> ' + esc(m.reason || '') + '</p>' +
    '<p class="small">' + esc(T('mafisa.md.stillhere')) + '</p>' +
    (extra ? '<p class="small">' + esc(extra) + '</p>' : '') +
  '</div>';
}

/* =========================================================================
   WHAT THE REGISTER IS NOT SHOWING

   core/mend.js bounds every download at 200 rows a table. Showing 200 of 4,312
   without saying so is not a smaller list, it is a false one.
   ========================================================================= */
function num(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function coverageLine(table, key){
  if (typeof MEND.coverageOf !== 'function') return '';
  var c = MEND.coverageOf(table);
  if (!c || !(c.total > c.loaded)) return '';
  return '<p class="partial break">' + esc(T(key, {loaded: num(c.loaded), total: num(c.total)})) + '</p>';
}

/* =========================================================================
   SEARCH — on the server when there is one

   MEND.searchAll() can only find what this device downloaded, which is now the
   first 200 assets. Somebody looking for the one tractor in Mokhotlong would
   not find it and would be told, wrongly, that the register has nothing. So
   the server is asked first and the fallback SAYS it is a fallback.
   ========================================================================= */
var q = '';                  // what is in the box
var qHits = null;            // null = not searching; [] = searched, nothing found
var qScope = null;           // 'server' | 'local' | 'busy'
var qNote = '';              // why it fell back, when it did
var qTimer = null;
var qSeq = 0;                // only the newest answer may paint

function runSearch(text){
  var mine = ++qSeq;
  var s = String(text || '').trim();
  if (s.length < 2){ qHits = null; qScope = null; qNote = ''; return paintHits(); }

  var local = function(note){
    if (mine !== qSeq) return;
    qHits = MEND.searchAll(s, {limit: 40}).filter(function(r){ return r.type === 'asset'; });
    qScope = 'local'; qNote = note; paintHits();
  };

  if (typeof MEND.searchServer !== 'function' || MEND.status !== 'connected'){
    return local(T('mafisa.q.local', {n: num(MEND.all('mafisa_assets').length)}));
  }
  qScope = 'busy'; paintHits();
  MEND.searchServer(s, 40).then(function(rows){
    if (mine !== qSeq) return;
    if (rows === null) return local(T('mafisa.q.local', {n: num(MEND.all('mafisa_assets').length)}));
    qHits = rows.filter(function(r){ return r.type === 'asset' && r.platform === 'mafisa'; });
    qScope = 'server'; qNote = ''; paintHits();
  }).catch(function(e){
    local(T('mafisa.q.failed', {why: e.message}));
  });
}

/* A hit is a register entry, so it is drawn as one. The link is INTERNAL —
   these assets are this app's own records, and sending somebody out to an
   absolute URL to read a page they are already on is how a search loses them. */
function hitsHtml(){
  if (qHits === null) return registerRowsHtml();
  if (qScope === 'busy') return '<div class="entry"><p class="muted" style="margin:0">'+esc(T('mafisa.q.busy'))+'</p></div>';
  if (!qHits.length) return '<div class="entry"><p class="muted" style="margin:0">'+esc(T('mafisa.reg.nomatch'))+'</p></div>';
  return qHits.map(function(r){
    var a = byId(MEND.all('mafisa_assets'), r.id);
    return '<div class="entry">' +
      '<div class="entry-hd"><span class="mono recno">'+esc(assetNo(r.id))+'</span>' +
        (a ? stampProof(a) : '') + '</div>' +
      '<h2><a href="#/asset/'+esc(r.id)+'" class="break">'+esc(r.title)+'</a></h2>' +
      '<p class="small muted break" style="margin:0">'+esc(r.subtitle || '')+'</p>' +
    '</div>';
  }).join('');
}

function qMetaHtml(){
  if (qHits === null) return '';
  if (qScope === 'busy') return '<div class="qmeta break">'+esc(T('mafisa.q.busy'))+'</div>';
  return '<div class="qmeta break"><strong>'+esc(T('mafisa.q.count', {n: qHits.length}))+'</strong> — ' +
    esc(qScope === 'server' ? T('mafisa.q.server') : qNote) +
    ' <button class="btn sm quiet" data-act="q-clear">'+esc(T('mafisa.q.clear'))+'</button></div>';
}

/* The two filters narrow the BROWSE list, and a search replaces that list. A
   control still on screen that no longer affects anything under it is the same
   lie as a bounded list that does not say it is bounded — so the filters are
   part of what the results container holds, and ONE function builds it. The
   screen and the keystroke repaint cannot then disagree about whether they are
   still standing, which is exactly what they did the first time this was two
   functions. */
function filtersHtml(){
  var catOpts = '<option value="">'+esc(T('ui.all_categories'))+'</option>' + categories().map(function(c){
    return '<option value="'+esc(c.code)+'"'+(filters.category===c.code?' selected':'')+'>'+esc(catName(c.code))+'</option>';
  }).join('');
  var distOpts = '<option value="">'+esc(T('ui.all_districts'))+'</option>' + MEND.DISTRICTS.map(function(d){
    return '<option value="'+esc(d)+'"'+(filters.district===d?' selected':'')+'>'+esc(d)+'</option>';
  }).join('');
  return '<div class="sheet-bd" style="padding-top:0">' +
    '<div class="grid2">' +
      '<label class="f" style="margin-bottom:0"><span class="caps">'+esc(T('ui.category'))+'</span>' +
        '<select data-filter="category">'+catOpts+'</select></label>' +
      '<label class="f" style="margin-bottom:0"><span class="caps">'+esc(T('app.district'))+'</span>' +
        '<select data-filter="district">'+distOpts+'</select></label>' +
    '</div></div>';
}

function hitsSectionHtml(){
  return (qHits === null ? filtersHtml() : '') +
    qMetaHtml() + '<div class="entries">' + hitsHtml() + '</div>';
}

/* Only the results are repainted, never the whole page: a full render on every
   keystroke takes the focus out of the box the person is typing in. */
function paintHits(){
  var host = document.getElementById('hits');
  if (!host) return;
  host.innerHTML = hitsSectionHtml();
}
