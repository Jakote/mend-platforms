document.addEventListener('click', function(ev){
  var b = ev.target.closest ? ev.target.closest('[data-act]') : null;
  if (!b) return;
  var act = b.dataset.act, id = b.dataset.id;

  /* ---- share and print: they write nothing, so no gate ---- */
  if (act === 'share-close'){ shareBox = null; return render(); }
  if (act === 'share-asset'){ return shareAsset(id); }
  if (act === 'print-asset'){ return printAsset(id); }
  if (act === 'share-loan'){  return shareLoan(id); }
  if (act === 'print-loan'){  return printLoan(id); }
  if (act === 'pay-open'){   settleOpen = id; settleErr = null; return render(); }
  if (act === 'pay-cancel'){ settleOpen = null; settleErr = null; return render(); }

  /* ---- opening a form writes nothing ---- */
  if (act === 'q-clear'){ q = ''; qHits = null; qScope = null; qNote = ''; qSeq++;
                          if (qTimer) { clearTimeout(qTimer); qTimer = null; } return render(); }
  if (act === 'report-open'){   reportOpen = id; reportErr = null; return render(); }
  if (act === 'report-cancel'){ reportOpen = null; reportErr = null; return render(); }
  /* Reads, both of them. exportMe() and deletionPreview() are stable SQL
     functions — the first hands back a file, the second only says what
     WOULD happen. Neither removes anything. */
  if (act === 'acct-copy')    return takeCopy();
  if (act === 'acct-preview') return showDeletionPreview();
  if (act === 'acct-cancel'){ acctPreview = null; acctErr = null; acctStep = ''; return render(); }
  if (act === 'cond-open'){   photoOpen = b.dataset.kind; photoErr = null; return render(); }
  if (act === 'cond-cancel'){ photoOpen = null; photoErr = null; return render(); }
  if (act === 'disp-open'){   dispOpen = true;  dispErr = null; return render(); }
  if (act === 'disp-cancel'){ dispOpen = false; dispErr = null; return render(); }

  /* ---- shell actions: allowed in every mode, they write nothing ---- */
  if (act === 'reconnect'){ MEND.connect(); return; }
  if (act === 'flush'){ if (HAS_OUTBOX) MEND.flushOutbox().then(function(){ render(); }); return; }
  if (act === 'dismiss-alarm'){ alarmsHidden = true; renderAlerts(); return; }
  if (act === 'restart-signin'){ signin = {email:signin.email, sent:false, error:''}; return render(); }
  if (act === 'doc-link') return showDocLink(id);
  if (act === 'signout'){
    MEND.signOut(); authed = false; authUserId = null; authEmail = '';
    signin = {email:'', sent:false, error:''};
    flash = {kind:'ok', title:'Signed out',
      body:'This page is acting as nobody now. Nothing was removed from the register.'};
    return go('#/register');
  }

  /* ---- everything past here writes. Refuse loudly rather than pretend. ---- */
  if (WRITE_ACTS.indexOf(act) > -1){
    var ro = readOnly();
    if (ro){ flash = {kind:'no', title: T('mafisa.refused'), body: ro}; return render(); }
    var un = unsavedGuard(id);
    if (un){ flash = {kind:'no', title: T('mafisa.sync.notin'), body: un}; return render(); }
  }
  if (act === 'submit-doc') return submitDoc(id);
  if (act === 'attach')     return attachProof(id);

  /* Each party confirms their OWN side and nobody else's. core/mend.js refuses
     anything else; the refusal is shown in words rather than swallowed. */
  if (act === 'pay-confirm'){
    try {
      MEND.confirmSettlement(id);
      flash = {kind:'ok', title: T('mafisa.recorded'), body: T('mafisa.settle.confirmed')};
    } catch (err) {
      flash = {kind:'no', title: T('mafisa.refused'), body: settleReason(err.message)};
    }
    return render();
  }

  /* Accepting an outcome. Each party accepts their OWN side; core/mend.js
     refuses anything else and closes it only when both have. Nothing here
     decides who was right, and the confirmation must not read as if it did. */
  if (act === 'disp-accept'){
    try {
      var dr = MEND.acceptOutcome(id, null);
      flash = dr && dr.state === 'resolved'
        ? {kind:'ok', title: T('mafisa.disp.closed'), body: T('dispute.closed_on', {date: stampAt(dr.closed_at)})}
        : {kind:'ok', title: T('dispute.you_accepted'), body: T('dispute.waiting_them')};
    } catch (err) {
      flash = {kind:'no', title: T('mafisa.refused'), body: err.message};
    }
    return render();
  }

  if (act === 'verify'){
    MEND.verifyLedger().then(function(r){
      var who = r.scope === 'server' ? T('mafisa.ch.server') : T('mafisa.ch.local');
      if (r.ok === true){
        $('#verifyOut').innerHTML = '<div class="accepted"><div class="caps">'+esc(T('rec.chain_ok'))+'</div>' +
          '<p class="break" style="margin:5px 0 0">' + esc(T('mafisa.ch.ok', {n: r.entries})) + ' ' +
          esc(who) + (r.note ? ' ' + esc(r.note) : '') + '</p></div>';
      } else if (r.ok === false){
        $('#verifyOut').innerHTML = '<div class="refusal"><div class="caps">'+esc(T('rec.chain_broken'))+'</div>' +
          '<p class="break" style="margin:5px 0 0">' + esc(T('mafisa.ch.broken', {seq: String(r.broken_at)})) + ' ' +
          esc(who) + '</p></div>';
      } else {
        /* Neither intact nor broken: nobody could be asked. Saying "broken"
           here would raise an alarm about the record when the fault is the
           connection, and saying "intact" would be worse. */
        /* An EMPTY chain is not an unchecked one. Core says so in r.note, and
           throwing that away told the person the check "could not be run" when
           it ran fine and found nothing to check. */
        $('#verifyOut').innerHTML = '<div class="refusal" style="border-color:var(--rule)"><div class="caps" style="color:var(--ink2)">' +
          esc(r.empty ? T('rec.nothing_yet') : T('rec.not_checked')) + '</div><p style="margin:5px 0 0" class="break">' +
          esc(r.note || (T('mafisa.ch.notchecked') + ' ' + (r.error || ''))) + '</p></div>';
      }
    });
    return;
  }
  if (act === 'agree')    return agreeLoan(id);
  if (act === 'out')      return advanceLoan(id, 'out');
  if (act === 'returned') return advanceLoan(id, 'returned');
  if (act === 'cancel')   return advanceLoan(id, 'cancelled');
  if (act === 'settle')   return settle(id, b.dataset.side);
  if (act === 'list')     return setListed(id, true);
  if (act === 'unlist')   return setListed(id, false);
});

document.addEventListener('submit', function(ev){
  var form = ev.target;

  /* ---- sign in. Email, then a one-time code. There is no password field in
         this file, so there is nothing to remember and nothing to leak. ---- */
  if (form.id === 'emailForm'){ ev.preventDefault(); return sendCode(form.email.value.trim()); }
  if (form.id === 'otpForm'){   ev.preventDefault(); return verifyCode(form.code.value.trim()); }

  /* Every form below this line writes. */
  var ro = readOnly();
  if (ro){
    ev.preventDefault();
    flash = {kind:'no', title: T('mafisa.refused'), body: ro};
    render(); return;
  }

  /* ---- saying something is wrong. A CLAIM, private to the reporter and the
         desk: db/020_abuse.sql shows a stranger nothing but a count, and only
         from two people up. Nothing here tells the person reported. ---- */
  if (form.id === 'reportForm'){
    ev.preventDefault();
    var rtable = form.dataset.table, rid = form.dataset.id;
    var rwhy = reportRefusal(rtable, rid);
    if (rwhy){ reportErr = rwhy; return render(); }
    try {
      MEND.report(rtable, rid, form.reason.value, form.detail.value.trim());
    } catch (err){
      reportErr = /already/.test(err.message) ? T('report.already') : err.message;
      return render();
    }
    reportErr = null; reportOpen = null;
    flash = {kind:'ok', title: T('mafisa.rp.sent'), body: MEND.claimed(T('report.sent'))};
    return render();
  }

  /* ---- going. The preview has already been read at this point: the form does
         not exist until deletionPreview() has been rendered. ---- */
  if (form.id === 'acctDeleteForm'){
    ev.preventDefault();
    return removeAccount(form.confirm.value.trim());
  }

  /* ---- a condition photograph. Evidence: it is never editable, and that is
         said on the form before a file is chosen, not in a toast after. ---- */
  if (form.id === 'condForm'){
    ev.preventDefault();
    var pfile = form.file.files && form.file.files[0];
    if (!pfile){ photoErr = T('mafisa.cond.err.nofile'); return render(); }
    if (!pfile.type || pfile.type.indexOf('image/') !== 0){
      photoErr = T('mafisa.cond.err.type'); return render();
    }
    var pkind = form.dataset.kind, ploan = form.dataset.loan;
    var pcap  = form.caption.value.trim() || null;
    photoErr = null; photoBusy = true;
    var pbtn = form.querySelector('button[type=submit]');
    if (pbtn){ pbtn.disabled = true; pbtn.textContent = T('mafisa.cond.attaching'); }
    MEND.attachPhoto(pfile, {subject_table:'mafisa_loans', subject_id: ploan,
                             kind: pkind, caption: pcap})
      .then(function(row){
        /* The only copy of the image this page will ever be able to show. See
           it costs nothing and needs no round trip. fetchPhotos() signs a
           link for anything not already here. */
        try { PHOTO_VIEW[row.id] = URL.createObjectURL(pfile); } catch (e) {}
        photoBusy = false; photoOpen = null;
        return ledger('mafisa.loan.condition_photo', ploan,
                      {kind: pkind, bytes: row.bytes, taken_at: row.taken_at});
      })
      .then(function(){
        flash = {kind:'ok', title: T('mafisa.cond.attached'), body: T('mafisa.cond.attached.body')};
        render();
      })
      .catch(function(e){
        photoBusy = false; photoErr = e.message; render();
      });
    return;
  }

  /* ---- raising it. The platform holds the account; it decides nothing. ---- */
  if (form.id === 'dispRaiseForm'){
    ev.preventDefault();
    var damt = form.amount.value === '' ? null : Math.round(Number(form.amount.value) * 100);
    var dspec = {
      against: form.dataset.against,
      kind: form.kind.value,
      claim: form.claim.value.trim(),
      amount_cents: (damt !== null && isFinite(damt) && damt >= 0) ? damt : null
    };
    /* Ask the gate first and print what it said, in words. */
    var dwhy = MEND.canDispute(form.dataset.eng, dspec);
    if (dwhy){
      dispErr = /say what went wrong/.test(dwhy) ? T('mafisa.disp.err.short') : dwhy;
      return render();
    }
    try { MEND.raiseDispute(form.dataset.eng, dspec); }
    catch (err){ dispErr = err.message; return render(); }
    dispErr = null; dispOpen = false;
    flash = {kind:'ok', title: T('mafisa.recorded'), body: T('dispute.no_verdict')};
    return render();
  }

  /* ---- a further account. Final on the way in. ---- */
  if (form.classList.contains('dispSayForm')){
    ev.preventDefault();
    var did = form.dataset.id;
    try { MEND.addStatement(did, form.body.value.trim()); }
    catch (err){
      sayErr[did] = /write a little more/.test(err.message) ? T('mafisa.disp.err.short') : err.message;
      return render();
    }
    sayErr[did] = null;
    flash = {kind:'ok', title: T('mafisa.recorded'), body: T('dispute.final')};
    return render();
  }

  /* ---- writing the outcome AND accepting your own side in one act ---- */
  if (form.classList.contains('dispOutcomeForm')){
    ev.preventDefault();
    var oid = form.dataset.id, otext = form.outcome.value.trim();
    if (otext.length < 5){
      flash = {kind:'no', title: T('mafisa.refused'), body: T('mafisa.disp.err.short')};
      return render();
    }
    try {
      var orow = MEND.acceptOutcome(oid, otext);
      flash = orow && orow.state === 'resolved'
        ? {kind:'ok', title: T('mafisa.disp.closed'), body: T('dispute.closed_on', {date: stampAt(orow.closed_at)})}
        : {kind:'ok', title: T('dispute.you_accepted'), body: T('dispute.waiting_them')};
    } catch (err){
      flash = {kind:'no', title: T('mafisa.refused'), body: err.message};
    }
    return render();
  }

  /* ---- a payment that already happened, written down ---- */
  if (form.id === 'settleForm'){
    ev.preventDefault();
    var loan = byId(MEND.all('mafisa_loans'), form.dataset.loan);
    var eng = loan && engagementFor(loan.id);
    if (!eng) return;
    var dir = form.dir.value;
    var payer = dir === 'op' ? eng.provider_id : eng.counterparty_id;
    var payee = dir === 'op' ? eng.counterparty_id : eng.provider_id;
    var amt = form.amount.value === '' ? null : Math.round(Number(form.amount.value) * 100);
    var spec = {
      payer_id: payer, payee_id: payee,
      amount_cents: (amt !== null && isFinite(amt)) ? amt : null,
      method: form.method.value,
      reference: form.reference.value,
      paid_on: form.paid_on.value || MEND.today(),
      note: form.note.value.trim() || null
    };
    /* Ask the gate BEFORE writing and print what it said. A greyed-out button
       tells a person nothing; the reason tells them what to change. */
    var why = MEND.canSettle(eng.id, spec);
    if (why){ settleErr = settleReason(why); return render(); }
    try { MEND.recordSettlement(eng.id, spec); }
    catch (err){ settleErr = settleReason(err.message); return render(); }
    settleErr = null; settleOpen = null;
    flash = {kind:'ok', title: T('mafisa.recorded'), body: T('mafisa.settle.written')};
    return render();
  }

  /* ---- your entry in the register ---- */
  if (form.id === 'profileForm'){
    ev.preventDefault();
    var nm = form.display_name.value.trim();
    var perrs = [];
    if (nm.length < 2 || nm.length > 80) perrs.push('The name must be between 2 and 80 characters.');
    if (!form.district.value) perrs.push('Choose a district.');
    if (perrs.length){ $('#profileErr').innerHTML = refusalHtml(T('mafisa.err.nothingsaved'), perrs); return; }
    var prow = MEND.insert('profiles', {
      id: authUserId, kind:'person', display_name: nm, district: form.district.value,
      village: form.village.value.trim() || null, phone: form.phone.value.trim() || null
    });
    MEND.signInAs(prow.id);
    MEND.record('profile.created', {platform:'mafisa', subject_table:'profiles', subject_id: prow.id,
      payload:{district: prow.district}}).then(function(){
      flash = {kind:'ok', title:'Entered in the register',
        body: MEND.claimed(MEND.enOnly(nm + ' is now a name on this register, and on Pitso and Matsema, which read the same entry. ' +
              'Nothing you own is proved yet — that starts with a document.'))};
      go('#/docs');
    });
    return;
  }

  /* ---- a document: upload as a draft. Submitting is a separate act. ---- */
  if (form.id === 'docForm'){
    ev.preventDefault();
    var box = $('#docErr');
    var file = form.file.files && form.file.files[0];
    var derrs = [];
    if (!form.kind.value) derrs.push('Say what the document is.');
    if (!file) derrs.push('Choose a file.');
    if (file && UPLOAD_MIME.indexOf(file.type) === -1)
      derrs.push('The bucket takes JPEG, PNG, HEIC and PDF only (db/006_storage.sql). This file is ' +
                 (file.type || 'of a type the browser could not name') + '.');
    if (file && file.size > UPLOAD_MAX)
      derrs.push('The bucket refuses anything over 10 MB. This file is ' + (file.size/1048576).toFixed(1) + ' MB.');
    var issued = form.issued_on.value || null, expires = form.expires_on.value || null;
    if (issued && expires && expires <= issued)
      derrs.push('The expiry has to fall after the date of issue (constraint doc_dates_sane in db/001_spine.sql).');
    if (derrs.length){ box.innerHTML = refusalHtml(T('mafisa.err.nothinguploaded'), derrs); return; }

    var btn = form.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = 'Uploading…';
    MEND.uploadDocument(file, form.kind.value, {
      issued_by: form.issued_by.value.trim() || null, issued_on: issued, expires_on: expires
    }).then(function(row){
      flash = {kind:'ok', title:'On file as a draft',
        body: docLabel(row.kind) + ' is uploaded and nobody has seen it. Uploading is not submitting: send it to the ' +
              'verification desk when you are ready, and it can be replaced right up until you do.'};
      go('#/docs');
    }).catch(function(e){
      btn.disabled = false; btn.textContent = 'Upload as a draft';
      box.innerHTML = refusalHtml('The upload failed — nothing was recorded', [e.message]);
    });
    return;
  }

  /* ---- register an asset ---- */
  if (form.id === 'assetForm'){
    ev.preventDefault();
    var intent = (ev.submitter && ev.submitter.value) || 'hold';
    var me = MEND.me();
    var errs = [];
    var title = form.title.value.trim();
    if (!form.category.value) errs.push('Choose a category.');
    if (title.length < 3 || title.length > 120) errs.push('The title must be between 3 and 120 characters.');
    if (!form.district.value) errs.push('Choose a district.');
    var daily = form.daily.value === '' ? null : Math.round(Number(form.daily.value) * 100);
    var dep   = form.deposit.value === '' ? null : Math.round(Number(form.deposit.value) * 100);
    if (daily !== null && (!isFinite(daily) || daily < 0)) errs.push('The daily rate cannot be negative.');
    if (dep !== null && (!isFinite(dep) || dep < 0)) errs.push('The deposit cannot be negative.');
    if (intent === 'list' && daily === null) errs.push('An asset in the register needs a daily rate.');

    var proof = proofValue(form) || null;
    if (intent === 'list'){
      var why = listingRefusal(me.id, form.category.value, proof);
      if (why) errs.push(why);
    }
    if (errs.length){
      $('#assetErr').innerHTML = '<div class="refusal"><div class="caps">'+esc(T('mafisa.err.nothingsaved'))+'</div><ul style="margin:6px 0 0 18px;padding:0">' +
        errs.map(function(e){ return '<li class="break">'+esc(e)+'</li>'; }).join('') + '</ul>' +
        (intent === 'list'
          ? '<p class="small break" style="margin:8px 0 0">' +
            T('mafisa.err.samerule') + '</p>'
          : '') +
        '</div>';
      $('#assetErr').scrollIntoView({block:'nearest'});
      return;
    }
    var row = MEND.insert('mafisa_assets', {
      owner_id: me.id, category: form.category.value, title: title,
      description: form.description.value.trim() || null, district: form.district.value,
      condition: form.condition.value.trim() || null,
      daily_cents: daily, deposit_cents: dep, proof_doc_id: proof, listed: intent === 'list'
    });
    clearDraft();
    ledgerAsset('mafisa.asset.registered', row.id, {title:title, category:row.category, listed:row.listed})
      .then(function(){
        if (row.listed) return ledgerAsset('mafisa.asset.listed', row.id, {title:title});
      })
      .then(function(){
        flash = {kind:'ok', title: row.listed ? 'Entered in the register' : 'Recorded, kept back',
          body: MEND.claimed(MEND.enOnly(assetNo(row.id) + ' — ' + title + (row.listed
            ? ' is in the register and can be asked for.'
            : ' is on the books but not findable. Attach a verified document to enter it.')))};
        go('#/mine');
      });
    return;
  }

  /* ---- request a loan ---- */
  if (form.id === 'borrowForm'){
    ev.preventDefault();
    var a = byId(MEND.all('mafisa_assets'), form.dataset.asset);
    var me2 = MEND.me();
    var from = form.from.value, to = form.to.value;
    var box = $('#borrowErr');
    function refuse(title, body, extra){
      box.innerHTML = '<div class="refusal"><div class="caps">'+esc(title)+'</div>' +
        '<p style="margin:5px 0 0" class="break">'+esc(body)+'</p>' +
        (extra ? '<p class="small" style="margin:8px 0 0">'+extra+'</p>' : '') + '</div>';
      box.scrollIntoView({block:'nearest'});
    }
    if (!from || !to) return refuse(T('mafisa.refused'), T('mafisa.err.dates.both'));
    if (to < from)    return refuse(T('mafisa.refused'), T('mafisa.err.dates.order'));
    if (from < MEND.today()) return refuse(T('mafisa.refused'), T('mafisa.err.dates.past'));
    var clash = bookingClash(a.id, from, to);
    if (clash){
      return refuse('Refused — the dates clash',
        'This asset is already committed ' + period(clash.from_date, clash.to_date) +
        ' under record ' + loanNo(clash.id) + '. Your period ' + period(from, to) +
        ' overlaps it. Choose dates that do not.',
        'The same refusal is made by the database in <span class="mono">mafisa_no_double_booking</span>. ' +
        'Two people cannot have the same thing on the same day.');
    }
    var f = loanFigures(a, from, to);
    var loan = MEND.insert('mafisa_loans', {
      asset_id: a.id, borrower_id: me2.id, from_date: from, to_date: to,
      agreed_cents: f.rent_cents, state: 'requested'
    });
    ledger('mafisa.loan.requested', loan.id, {asset:a.id, from:from, to:to, days:f.days, agreed_cents:f.rent_cents})
      .then(function(){
        flash = {kind:'ok', title:'Requested',
          body: MEND.claimed(MEND.enOnly(loanNo(loan.id) + ' — ' + a.title + ', ' + period(from, to) + ', ' + f.days + ' days at ' +
                MEND.M(f.daily_cents) + ' a day = ' + MEND.M(f.rent_cents) + ', deposit ' + MEND.M(f.deposit_cents) +
                '. ' + nameOf(a.owner_id) + ' must agree it before it is committed. No money has moved.'))};
        go('#/mine');
      });
    return;
  }

  /* ---- leave a review ---- */
  if (form.classList.contains('reviewForm')){
    ev.preventDefault();
    var me3 = MEND.me();
    var eng = form.dataset.eng, subj = form.dataset.subject;
    var why2 = MEND.canReview(eng, me3.id, subj);
    if (why2){ flash = {kind:'no', title:'Refused', body: why2}; return render(); }
    MEND.insert('reviews', {engagement_id: eng, author_id: me3.id, subject_id: subj,
      rating: Number(form.rating.value), body: form.body.value.trim() || null});
    MEND.record('mafisa.review.left', {platform:'mafisa', subject_table:'reviews', subject_id: eng,
      payload:{subject: subj, rating: Number(form.rating.value)}}).then(function(){
      flash = {kind:'ok', title:'Review recorded',
        body: MEND.claimed(MEND.enOnly('It now counts towards ' + nameOf(subj) + '’s standing on all three platforms.'))};
      render();
    });
    return;
  }
});

window.addEventListener('hashchange', function(){
  render();
  window.scrollTo(0,0);
});

/* =========================================================================
   SELF-TEST — run MAFISA_SELFTEST() in the console.
   Written as refusals, like db/test. It asserts that the figure the screen
   shows and the figure the record carries come out of the same function, and
   that both branches of the REWRITTEN mafisa_listing_needs_proof() are mirrored
   here: the kind of document is checked where a registry exists, and where none
   does, an identity is required and ownership is never claimed.
   ========================================================================= */
window.MAFISA_SELFTEST = function(){
  var out = [], ok = true, skipped = 0;
  function t(name, cond, detail){ out.push((cond?'PASS  ':'FAIL  ')+name+(detail?'  — '+detail:'')); if(!cond) ok=false; }
  function skip(name, why){ out.push('SKIP  '+name+'  — '+why); skipped++; }

  /* Half of these assert against the seeded preview people. Connected to a real
     database those fixtures are simply not there, and a suite that shouted FAIL
     at their absence would teach whoever ran it to ignore it. It says SKIP and
     why, and the rules that need no fixtures are checked either way. */
  var a1 = byId(MEND.all('mafisa_assets'), 'a-1');
  var a2 = byId(MEND.all('mafisa_assets'), 'a-2');
  var a3 = byId(MEND.all('mafisa_assets'), 'a-3');
  var l2 = byId(MEND.all('mafisa_loans'), 'l-2');
  var SEEDED = !!(a1 && l2 && byId(MEND.all('documents'), 'd-3'));
  var NO_FIXTURES = 'the seeded preview data is not loaded (this page is connected to a real database)';

  if (SEEDED){
    var f = loanFigures(a1, l2.from_date, l2.to_date);
    t('seed loan l-2 rent recomputes to the stored figure', f.rent_cents === l2.agreed_cents,
      MEND.M(f.rent_cents) + ' vs stored ' + MEND.M(l2.agreed_cents));
    t('14–16 Sept counts as three days', f.days === 3, 'days=' + f.days);
    var clash = bookingClash('a-1','2026-09-15','2026-09-18');
    t('15–18 Sept is refused against the 14–16 Sept commitment', !!clash,
      clash ? 'clashes with ' + loanNo(clash.id) : 'NO CLASH DETECTED');
    t('19–21 Sept is allowed', !bookingClash('a-1','2026-09-19','2026-09-21'));
  } else {
    skip('the loan figure and double-booking checks', NO_FIXTURES);
  }

  /* Arithmetic needs no fixtures: build an asset and assert the screen figure
     and the stored figure come out of the one function. */
  var probe = {daily_cents: 45000, deposit_cents: 150000};
  var pf = loanFigures(probe, '2026-09-14', '2026-09-16');
  t('first and last day both count', pf.days === 3, 'days=' + pf.days);
  t('rent is days times the daily rate, from ONE function',
    pf.rent_cents === pf.days * probe.daily_cents && calcBlock(probe,'2026-09-14','2026-09-16').indexOf(MEND.M(pf.rent_cents)) > -1,
    MEND.M(pf.rent_cents));

  /* ---- branch 1: the category names a document, and the KIND is checked ---- */
  if (SEEDED){
  t('a verified vehicle registration enters a vehicle',
    listingRefusal('p-thabang','vehicle','d-3') === null, String(listingRefusal('p-thabang','vehicle','d-3')));
  /* Asserted by KEY, never by English words: the rule is "the wrong kind of
     document is refused and the right one is named", and that rule has to hold
     on a phone set to Sesotho exactly as it does here. */
  var wrongKind = listingRefusal('p-thabang','vehicle','d-2') || '';
  var wantKind = T('mafisa.pd.wrongkind', {have: docLabel('trade_certificate').toLowerCase(),
                                           cat:  catName('vehicle'),
                                           need: docLabel('vehicle_registration').toLowerCase()});
  t('a verified TRADE CERTIFICATE is refused as proof of a vehicle',
    wrongKind === wantKind, wrongKind.slice(0,90) || 'ACCEPTED — the old bug is back');
  t('the wrong-kind refusal names the document the register wants',
    wrongKind.indexOf(docLabel('vehicle_registration').toLowerCase()) > -1, wrongKind.slice(0,90));
  t('no document at all is refused where a registry exists',
    !!listingRefusal('p-thabang','vehicle',null));
  t('somebody else\'s vehicle registration is refused',
    listingRefusal('p-teboho','vehicle','d-3') === T('mafisa.pd.notowner'),
    String(listingRefusal('p-teboho','vehicle','d-3')));
  t('a tractor with no proof is refused (its category needs a vehicle registration)',
    !!listingRefusal('p-mokoto','tractor',null));
  } else { skip('the branch-1 checks against seeded documents', NO_FIXTURES); }

  /* Right kind, wrong standing. Fed as rows so the store is never written to,
     and so these run against a real database as happily as against the seed. */
  var VEH = catOf('vehicle');
  var VD = docLabel('vehicle_registration');
  t('a PENDING vehicle registration is refused',
    proofDocRefusal(VEH, {profile_id:'p-thabang', kind:'vehicle_registration', status:'pending'}, 'p-thabang')
      === T('mafisa.pd.pending', {doc: VD}));
  t('a REJECTED vehicle registration is refused',
    proofDocRefusal(VEH, {profile_id:'p-thabang', kind:'vehicle_registration', status:'rejected'}, 'p-thabang')
      === T('mafisa.pd.rejected', {doc: VD}));
  t('a vehicle registration stored as verified but past its expiry is refused',
    proofDocRefusal(VEH, {profile_id:'p-thabang', kind:'vehicle_registration',
                          status:'verified', expires_on:'2024-01-01'}, 'p-thabang')
      === T('mafisa.pd.expired', {doc: VD, date: MEND.fmtDate('2024-01-01')}));

  /* ---- branch 2: no registry exists, so identity is what gets proved ------- */
  if (SEEDED){
  t('a power tool needs no ownership document at all',
    listingRefusal('p-thabang','powertool',null) === null, String(listingRefusal('p-thabang','powertool',null)));
  var noId = listingRefusal('p-mokoto','powertool',null) || '';
  t('a power tool IS refused when the owner has no verified identity', !!noId, noId.slice(0,90));
  t('that refusal says identity, and does not claim ownership was the problem',
    noId === T('mafisa.lr.noidentity', {cat: catName('powertool'), kinds: IDENTITY_WORDS}),
    noId.slice(0,90));
  t('the identity branch ignores an attached ownership document, as the trigger does',
    listingRefusal('p-thabang','powertool','d-2') === null);
  t('and an attached document cannot rescue a missing identity',
    !!listingRefusal('p-mokoto','powertool','d-8'));
  t('an EXPIRED identity document is no identity',
    verifiedIdentityOf('p-palesa') === null && !!listingRefusal('p-palesa','powertool',null));
  } else { skip('the branch-2 checks against seeded people', NO_FIXTURES); }
  t('a trade certificate is not an identity document',
    IDENTITY_KINDS.indexOf('trade_certificate') === -1);
  t('the identity list is exactly the three kinds the trigger accepts',
    IDENTITY_KINDS.join(',') === 'national_id,passport,company_registration', IDENTITY_KINDS.join(','));

  /* ---- what the screen is then allowed to say ----------------------------- */
  if (SEEDED && a1 && a3 && a2){
    t('a vehicle with the right paper reads as ownership proved',
      proofVerdict(a1).ok && proofVerdict(a1).basis === 'ownership', proofVerdict(a1).basis);
    t('livestock reads as identity, not ownership',
      proofVerdict(a3).ok && proofVerdict(a3).basis === 'identity', proofVerdict(a3).basis);
    /* Asserted against the STRING TABLE, never against an English literal. A
       suite that passes in English and fails in Sesotho is testing the reader's
       language rather than the rule — which is exactly what these five did the
       moment this app learned to speak Sesotho. */
    t('an identity-only entry NEVER shows the ownership stamp',
      stampProof(a3).indexOf(T('mafisa.stamp.owned')) === -1, stampProof(a3));
    t('an identity-only entry says so on its face',
      stampProof(a3).indexOf(T('mafisa.stamp.identified')) > -1, stampProof(a3));
    /* The exact sentence, by key. An identity-only entry must never be given
       the ownership wording, and the only way to assert that in two languages
       is to say which string it is required to be. */
    t('the identity verdict states plainly that ownership is not claimed',
      proofVerdict(a3).line === T('mafisa.pv.identity.ok', {
        cat: catName(a3.category),
        doc: docLabel((verifiedIdentityOf(a3.owner_id) || {}).kind).toLowerCase()}),
      proofVerdict(a3).line.slice(0,80));
    t('the identity wording and the ownership wording are not the same sentence',
      T('mafisa.pv.identity.ok', {cat:'x', doc:'y'}) !== T('mafisa.pv.ok.noexpiry', {doc:'y'}) &&
      proofVerdict(a3).line !== proofVerdict(a1).line);
    t('a listed concrete mixer is identity-backed too, and no longer claims ownership',
      proofVerdict(a2).basis === 'identity' && stampProof(a2).indexOf(T('mafisa.stamp.owned')) === -1);
    t('the ownership stamp is still produced where ownership WAS proved',
      stampProof(a1).indexOf(T('mafisa.stamp.owned')) > -1);
  } else { skip('the stamp-wording checks', NO_FIXTURES); }

  /* Stamp wording without fixtures: a synthetic asset in each branch. */
  t('any identity-backed entry is stamped “ownership not proved”',
    stampProof({category:'powertool', owner_id:'nobody'}).indexOf(T('mafisa.stamp.identified')) > -1 ||
    stampProof({category:'powertool', owner_id:'nobody'}).indexOf('stamp bad') > -1);
  t('an entry with nothing behind it never carries a verified stamp',
    stampProof({category:'vehicle', owner_id:'nobody', proof_doc_id:null}).indexOf(T('mafisa.stamp.owned')) === -1);

  /* ---- the mirror must not drift from the table -------------------------- */
  var dbCats = MEND.all('mafisa_categories');
  if (dbCats.length){
    var drift = [];
    dbCats.forEach(function(r){
      var m = null;
      for (var i=0;i<CATEGORY_MIRROR.length;i++) if (CATEGORY_MIRROR[i].code === r.code) m = CATEGORY_MIRROR[i];
      if (!m) drift.push(r.code + ' is in the table and not in this file');
      else if ((m.proof || null) !== (r.proof || null)) drift.push(r.code + ': file says ' + m.proof + ', table says ' + r.proof);
    });
    t('the category mirror in this file agrees with mafisa_categories', drift.length === 0, drift.join('; '));
  } else {
    skip('the category mirror against mafisa_categories', 'no such table is loaded (device preview)');
  }

  /* ---- documents, modes, and the things that must never appear ----------- */
  var d7 = byId(MEND.all('documents'),'d-7');
  if (d7) t('the seeded expired document reads as expired, not verified', MEND.effectiveStatus(d7) === 'expired',
    'effective=' + MEND.effectiveStatus(d7));
  else skip('the seeded expired document', NO_FIXTURES);
  t('a verified document past its expiry reads as expired wherever it came from',
    MEND.effectiveStatus({status:'verified', expires_on:'2020-01-01'}) === 'expired' &&
    MEND.isVerified({status:'verified', expires_on:'2020-01-01'}) === false);
  t('a draft document is never described as submitted',
    docStanding({stage:'draft', status:'pending'}).stamp.indexOf(T('mafisa.dc.stamp.draft')) > -1 &&
    docStanding({stage:'draft', status:'pending'}).stamp.indexOf(T('mafisa.dc.stamp.waiting')) === -1,
    docStanding({stage:'draft', status:'pending'}).stamp);
  t('a rejected document shows the reason it was rejected',
    docStanding({stage:'reviewed', status:'rejected', note:'because the plate is unreadable'})
      .line.indexOf('because the plate is unreadable') > -1);
  t('THERE IS NO PASSWORD FIELD ANYWHERE IN THIS PAGE',
    document.querySelectorAll('input[type=password]').length === 0);
  t('device preview is not read-only; it says what it is instead',
    MEND.CONFIGURED || readOnly() === null, String(readOnly()));
  t('an offline write is queued rather than refused, where the core can hold it',
    !HAS_OUTBOX || MEND.CONFIGURED === false || readOnly() === null || !authed || seedShowing(),
    'readOnly=' + String(readOnly()));
  t('a queued row is never described as saved',
    syncMark({_sync:'saving'}).indexOf(T('outbox.sending')) > -1 ||
    syncMark({_sync:'saving'}).indexOf(T('outbox.waiting')) > -1,
    syncMark({_sync:'saving'}));
  t('a refused row says so in the row itself, not only in a banner',
    syncMark({_sync:'failed', _error:'HTTP 403'}).indexOf(T('sync.not_saved')) > -1,
    syncMark({_sync:'failed', _error:'HTTP 403'}));
  t('the four modes are all handled by the mode band',
    ['device','connecting','connected','unreachable'].indexOf(MEND.modeNotice().mode) > -1,
    MEND.modeNotice().mode);


  /* =======================================================================
     DISPUTES, CONDITION PHOTOGRAPHS, AND THE WORDS THEY MAY NOT USE

     The rule this whole panel exists to keep is a wording rule, so it is
     asserted as one. MEND GROUP does not adjudicate; nothing on the screen may
     read as a finding, and no stranger may read a word of what was said.
     ======================================================================= */
  t('every dispute kind the core accepts has a word on screen',
    MEND.DISPUTE_KINDS.every(function(k){ return T('dispute.k.' + k) !== 'dispute.k.' + k; }),
    MEND.DISPUTE_KINDS.join(','));

  /* The screen must never claim a verdict. Checked against the rendered panel
     rather than against the source, because it is the rendering that a person
     reads. */
  var vguard = /\b(guilty|at fault|we find|liable|ruled|judgment|judgement|verdict|in favour of)\b/i;
  t('nothing the dispute panel renders reads as a verdict',
    !vguard.test(T('dispute.no_verdict')) && !vguard.test(T('mafisa.disp.heading')) &&
    !vguard.test(T('mafisa.disp.outcome.final')),
    T('mafisa.disp.heading'));
  t('the platform says outright that it does not decide who is right',
    T('dispute.no_verdict').length > 20 && T('dispute.count_only').length > 20);

  /* The statement form must warn BEFORE the write, not confirm after it. */
  t('the finality warning exists and is shown on the way in',
    T('dispute.final') !== 'dispute.final' && T('mafisa.cond.final') !== 'mafisa.cond.final');

  /* core/mend.js marks a dispute 'answered' the instant it is RAISED, because
     raiseDispute() writes the claim through addStatement(). The screen must not
     repeat that, or a person reads "answered" before anybody has answered. */
  t('the dispute stamp is derived from who has written, not from the state column',
    (function(){
      var one = {state:'answered', statements:[{author_id:'p-a'}]};
      var two = {state:'answered', statements:[{author_id:'p-a'},{author_id:'p-b'}]};
      var authors = function(d){ var m={}; d.statements.forEach(function(x){m[x.author_id]=true;});
                                 return Object.keys(m).length > 1; };
      return authors(one) === false && authors(two) === true;
    })(), 'core reports state=answered for a dispute nobody has answered');

  /* What a stranger may read. This is the privacy rule, and it is the one that
     would do real damage if it were ever quietly dropped. */
  if (SEEDED){
    var _lwho = MEND.me();
    var el = byId(MEND.all('mafisa_loans'), 'l-1');
    var ea = el && byId(MEND.all('mafisa_assets'), el.asset_id);
    var strangerId = 'p-teboho';
    if (el && ea && strangerId !== ea.owner_id && strangerId !== el.borrower_id){
      MEND.signInAs(strangerId);
      var html = disputeSection(el);
      var ds = MEND.disputeFor((engagementFor('l-1')||{}).id || '') || [];
      var claims = ds.map(function(d){ return d.claim; }).filter(Boolean);
      t('a stranger reading a loan never sees the claim itself',
        claims.every(function(c){ return html.indexOf(c.slice(0, 30)) === -1; }),
        claims.length ? 'claims present: ' + claims.length : 'no dispute on l-1 to hide');
      t('a stranger is told the count-only rule in words',
        !ds.length || html.indexOf(T('dispute.count_only')) > -1);
      t('a stranger is offered no way to write into somebody else’s dispute',
        html.indexOf('dispSayForm') === -1 && html.indexOf('disp-accept') === -1);
      if (_lwho) MEND.signInAs(_lwho.id);
    } else { skip('the stranger’s view of a dispute', 'no seeded loan to read as an outsider'); }
  } else { skip('the stranger’s view of a dispute', NO_FIXTURES); }

  /* Standing is counts, never the accusation. */
  t('standing on a name is counts only, and carries the rule beside it',
    (function(){
      var h = disputeStandingBlock('p-lineo');
      var ds = MEND.all('disputes');
      return h.indexOf(T('dispute.count_only')) > -1 &&
             ds.every(function(d){ return !d.claim || h.indexOf(d.claim.slice(0,25)) === -1; });
    })());

  /* Condition photographs: what loanCondition reports, and the distinction the
     screen has to keep — when it was TAKEN against when it arrived. */
  t('loanCondition reports the two days separately and only claims both when both exist',
    (function(){
      var c = MEND.loanCondition('__no_such_loan__');
      return c.photos_out === 0 && c.photos_in === 0 && c.both_recorded === false &&
             c.recorded_out === null && c.recorded_in === null;
    })());
  t('the screen says the date is when the photograph was TAKEN, not when it arrived',
    /TAKEN|NKILOENG/.test(T('mafisa.cond.taken_not_sent')) &&
    T('mafisa.cond.taken') !== T('mafisa.cond.reached'));
  t('evidence is described as unchangeable before a file is chosen',
    T('mafisa.cond.final').length > 40);
  t('the shrink is stated with the real number from the core, not a guess',
    T('mafisa.cond.shrunk', {edge: MEND.PHOTO_MAX_EDGE}).indexOf(String(MEND.PHOTO_MAX_EDGE)) > -1 &&
    MEND.PHOTO_MAX_EDGE === 1280, 'PHOTO_MAX_EDGE=' + MEND.PHOTO_MAX_EDGE);

  /* =======================================================================
     THE LANGUAGE ITSELF

     A key that was never defined renders as the key, which on screen is a line
     of dotted lowercase where a sentence should be. Nothing catches that but
     looking, so this looks.
     ======================================================================= */
  (function(){
    /* A key that was never defined renders AS THE KEY, which on screen is a
       line of dotted lowercase where a sentence should be. Nothing catches that
       but looking, so this looks — at every screen, in whichever language the
       page is currently in.

       Ledger EVENT NAMES look identical to keys and are meant to be raw: the
       record trail shows 'mafisa.loan.agreed' verbatim because that is the
       event, not a label for one. They are subtracted from the catch rather
       than the trail being skipped, so a real missing key on the trail panel is
       still caught. */
    var probe = /(?:mafisa|dispute|report|mod|ui|app|doc|rep|money|sync|rec|outbox|mode|auth|install|notif|deliv)\.[a-z0-9_]+(?:\.[a-z0-9_]+)*/g;
    var events = {};
    MEND.all('ledger').forEach(function(r){ events[r.event_type] = true; });
    var screens = [screenRegister(), screenNew(), screenMine(), screenDocs(),
                   screenSignIn(), trailPanel(),
                   accountSection(MEND.me() || {display_name:'x'})];
    var a1x = MEND.all('mafisa_assets')[0];
    if (a1x) screens.push(screenAsset(a1x.id), screenBorrow(a1x.id));
    var l1x = MEND.all('mafisa_loans')[0];
    if (l1x) screens.push(screenLoan(l1x.id));
    if (a1x){
      var wasOpen = reportOpen; reportOpen = a1x.id;
      screens.push(screenAsset(a1x.id));
      reportOpen = wasOpen;
    }
    var wasPrev = acctPreview;
    acctPreview = {erased:{documents:1}, kept_without_your_name:{condition_photographs:2},
                   why_those_are_kept:'x', cannot_be_undone:true};
    screens.push(accountSection(MEND.me() || {display_name:'x'}));
    acctPreview = wasPrev;
    var text = screens.join(' ').replace(/<[^>]*>/g, ' ');
    var bad = (text.match(probe) || []).filter(function(m){ return !events[m]; });
    t('no screen renders a raw translation key', bad.length === 0, bad.slice(0, 6).join(', '));
  })();

  /* Every stamp, state and refusal must come out DIFFERENT in the two
     languages, or it was never translated — and must come out NON-EMPTY in
     both, or somebody reads a blank where a refusal should be. */
  t('the loan states, the stamps and the refusals all answer in both languages',
    (function(){
      var keys = ['mafisa.st.requested','mafisa.st.agreed','mafisa.st.out','mafisa.st.returned',
                  'mafisa.stamp.owned','mafisa.stamp.identified','mafisa.stamp.noproof',
                  'mafisa.refused','mafisa.err.clash','dispute.final','dispute.no_verdict',
                  'mafisa.cond.final','mafisa.disp.heading',
                  'report.this','report.private','report.r.not_theirs','mod.hidden','mod.reason',
                  'mafisa.md.stillhere','mafisa.md.cannot','mafisa.cov.assets',
                  'mafisa.q.server','mafisa.q.local','mafisa.acct.photos.why','mafisa.acct.final'];
      var was = MEND_I18N.lang(), bad = [];
      MEND_I18N.setLang('en'); var en = keys.map(function(k){ return T(k); });
      MEND_I18N.setLang('st'); var st = keys.map(function(k){ return T(k); });
      MEND_I18N.setLang(was);
      keys.forEach(function(k, i){
        if (!en[i] || !st[i] || en[i] === k || st[i] === k) bad.push(k + ' (missing)');
        else if (en[i] === st[i]) bad.push(k + ' (still English)');
      });
      return bad.length ? bad.join('; ') : true;
    })() === true,
    'see the list above if this failed');

  /* The suite itself must not be language-dependent. Run the stamp rule in the
     other language and require the same answer. */
  t('the stamp rule gives the same answer whichever language the page is in',
    (function(){
      var was = MEND_I18N.lang();
      var probeAsset = {category:'vehicle', owner_id:'nobody', proof_doc_id:null};
      MEND_I18N.setLang('en'); var a = stampProof(probeAsset).indexOf(T('mafisa.stamp.owned')) === -1;
      MEND_I18N.setLang('st'); var b = stampProof(probeAsset).indexOf(T('mafisa.stamp.owned')) === -1;
      MEND_I18N.setLang(was);
      return a && b;
    })());

  /* =======================================================================
     REPORTING — a claim, kept private, and never a finding

     The damage this panel can do is not a crash. It is publishing one person's
     accusation about another, or telling somebody they were reported. Both are
     wording and shape rules, so both are asserted as such.
     ======================================================================= */
  t('every reason the core accepts has a word on screen',
    MEND.REPORT_REASONS.every(function(r){ return T('report.r.' + r) !== 'report.r.' + r; }),
    MEND.REPORT_REASONS.join(','));
  t('the reasons offered are exactly the core’s list, none added and none dropped',
    reportReasons().slice().sort().join(',') === MEND.REPORT_REASONS.slice().sort().join(','),
    reportReasons().join(','));
  t('“it is not theirs” is the first reason on an asset record',
    reportReasons()[0] === 'not_theirs', reportReasons()[0]);

  (function(){
    var wasOpen = reportOpen, wasErr = reportErr;
    var probeId = '__report_probe__';
    reportOpen = probeId; reportErr = null;
    var form = reportBlock('mafisa_assets', probeId, false);
    reportOpen = wasOpen; reportErr = wasErr;
    t('the form says what is written there is seen only by MEND',
      form.indexOf(esc(T('report.private'))) > -1);
    t('and it says so BEFORE the boxes, not after they are filled in',
      form.indexOf(esc(T('report.private'))) < form.indexOf('name="detail"') &&
      form.indexOf(esc(T('report.private'))) < form.indexOf('name="reason"'));
    t('the form never says the report decides anything',
      !/\b(guilty|at fault|we find|liable|ruled|verdict|removed|taken down)\b/i.test(
        T('mafisa.rp.claim') + ' ' + T('report.sent') + ' ' + T('mafisa.rp.notyours')),
      T('mafisa.rp.claim').slice(0,60));
  })();

  t('one report is not a public count — the core returns 0 and the screen shows nothing',
    MEND.reportSignal('mafisa_assets', '__no_such_asset__') === 0 &&
    reportBlock('mafisa_assets', '__no_such_asset__', true).indexOf(T('report.signal', {n: 0})) === -1);
  t('the owner of an entry is not offered a control to report their own entry',
    reportBlock('mafisa_assets', '__no_such_asset__', true).indexOf('report-open') === -1);

  /* =======================================================================
     A STRUCK ENTRY IS STILL A RECORD
     ======================================================================= */
  t('an entry nobody has touched is not struck',
    struckOf('__no_such_asset__') === null);
  (function(){
    var m = {action:'hidden', reason:'the registration plate belongs to another vehicle',
             created_at:'2026-09-10T08:00:00Z'};
    var h = strikeBlock(m, T('mafisa.md.owner'));
    t('a struck entry carries the reason it was struck',
      h.indexOf(esc(m.reason)) > -1);
    t('a struck entry carries the date it was struck',
      h.indexOf(esc(MEND.fmtDate('2026-09-10'))) > -1, h.slice(0,120));
    t('and it says the entry has not been removed',
      h.indexOf(esc(T('mafisa.md.stillhere'))) > -1);
    t('the owner is told it was MEND that took it down, not that proof is missing',
      h.indexOf(esc(T('mafisa.md.owner'))) > -1 &&
      T('mafisa.md.owner').indexOf('MEND') > -1);
  })();
  t('a copy leaving this app carries the strike with it',
    (function(){
      var m = {action:'hidden', reason:'the plate belongs to another vehicle', created_at:'2026-09-10T08:00:00Z'};
      var line = strikeLine(m);
      return line.indexOf(T('mod.hidden')) > -1 && line.indexOf(m.reason) > -1 &&
             line.indexOf(MEND.fmtDate('2026-09-10')) > -1 &&
             line !== T('mafisa.share.held') && line !== T('mafisa.share.listed');
    })());
  t('a taken-down entry is never explained as a missing document',
    T('mafisa.md.cannot') !== T('mafisa.as.cannot.body') &&
    !/document|tokomane/i.test(T('mafisa.md.cannot')),
    T('mafisa.md.cannot').slice(0,60));

  /* =======================================================================
     WHAT THE REGISTER IS NOT SHOWING
     ======================================================================= */
  (function(){
    var real = MEND.coverageOf;
    MEND.coverageOf = function(){ return null; };
    var none = coverageLine('mafisa_assets', 'mafisa.cov.assets');
    MEND.coverageOf = function(){ return {loaded: 200, total: 200}; };
    var whole = coverageLine('mafisa_assets', 'mafisa.cov.assets');
    MEND.coverageOf = function(){ return {loaded: 200, total: 4312}; };
    var part = coverageLine('mafisa_assets', 'mafisa.cov.assets');
    MEND.coverageOf = real;
    t('a list that is whole says nothing about being bounded', none === '' && whole === '');
    t('a bounded list says BOTH numbers, not just the one it is showing',
      part.indexOf('200') > -1 && part.indexOf('4,312') > -1, part.replace(/<[^>]*>/g,'').slice(0,90));
  })();
  t('four thousand three hundred and twelve is written so a person can read it',
    num(4312) === '4,312' && num(200) === '200', num(4312));

  /* =======================================================================
     SEARCH — and what it says when it could only reach this device
     ======================================================================= */
  t('a one-letter query searches nothing rather than everything',
    (function(){
      var wasQ = qHits; qHits = 'x';
      runSearch('a');
      var after = qHits; qHits = wasQ;
      return after === null;
    })());
  t('the fallback says outright that it only looked at this device',
    T('mafisa.q.local', {n: '200'}) !== T('mafisa.q.server') &&
    T('mafisa.q.local', {n: '200'}).indexOf('200') > -1);
  t('the server answer does not claim to be local, and neither claims the other',
    T('mafisa.q.server').length > 30 && T('mafisa.q.failed', {why:'x'}).indexOf('x') > -1);
  t('a result is a register entry and links inside this app, not out to a host',
    (function(){
      var wasH = qHits, wasS = qScope;
      qHits = [{type:'asset', platform:'mafisa', id:'probe-1', title:'Probe', subtitle:'x'}];
      qScope = 'server';
      var h = hitsHtml();
      qHits = wasH; qScope = wasS;
      return h.indexOf('href="#/asset/probe-1"') > -1 && h.indexOf('http') === -1;
    })());
  t('search results replace the browse list rather than sitting beside a filter that no longer applies',
    (function(){
      var wasH = qHits, wasS = qScope;
      qHits = []; qScope = 'local';
      var screen = screenRegister(), section = hitsSectionHtml();
      qHits = null;
      var browsing = hitsSectionHtml();
      qHits = wasH; qScope = wasS;
      /* Both the first paint and the keystroke repaint come out of
         hitsSectionHtml(), so assert the ONE function — and that the
         screen really is built from it. */
      return screen.indexOf('data-filter="district"') === -1 &&
             section.indexOf('data-filter="district"') === -1 &&
             browsing.indexOf('data-filter="district"') > -1;
    })());

  /* =======================================================================
     YOUR ACCOUNT — and the promise it must not make

     The failure here is not a bug, it is an overpromise: telling somebody
     their account is gone while a photograph of their bakkie is still on
     somebody else's loan record.
     ======================================================================= */
  (function(){
    var wasPrev = acctPreview, wasBusy = acctBusy;
    var who = {display_name: 'Probe Person', id: 'probe'};
    acctPreview = null; acctBusy = '';
    var before = accountSection(who);
    t('the button that removes an account does not exist until the preview has been read',
      before.indexOf('acctDeleteForm') === -1 && before.indexOf('acct-preview') > -1);
    t('the copy is offered, and says the files themselves are not in it',
      before.indexOf(esc(T('mafisa.acct.copy.note'))) > -1 &&
      /does not contain|ha e na/i.test(T('mafisa.acct.copy.note')));

    acctPreview = {
      erased: {your_name_and_contact: 1, documents: 2, photographs: 3, listings: 1},
      kept_without_your_name: {completed_jobs: 4, condition_photographs: 6,
                               reviews_others_wrote: 2, record_entries: 11},
      why_those_are_kept: 'A photograph taken when something was handed over is the other person’s record.',
      cannot_be_undone: true
    };
    var after = accountSection(who);
    acctPreview = wasPrev; acctBusy = wasBusy;

    t('the preview shows what is ERASED and what is KEPT, both, with counts',
      after.indexOf(esc(T('mafisa.acct.erased'))) > -1 &&
      after.indexOf(esc(T('mafisa.acct.kept'))) > -1 &&
      after.indexOf('>6<') > -1);
    /* The field names come from db/018_data_rights.sql. A field added there and
       not given a word here is printed as it came rather than hidden, but the
       ten that exist today must read as English or Sesotho, not as SQL. */
    t('every field the SQL preview returns is given a word, none silently dropped',
      ['your_name_and_contact','documents','photographs','listings','completed_jobs',
       'condition_photographs','reviews_others_wrote','record_entries','settled_payments','disputes']
        .every(function(k){ return T('mafisa.acct.k.' + k) !== 'mafisa.acct.k.' + k; }));
    t('the database’s own reason for keeping them is printed, not paraphrased away',
      after.indexOf(esc('A photograph taken when something was handed over is the other person’s record.')) > -1);
    t('and this app says in its own terms that the condition photographs survive',
      after.indexOf(esc(T('mafisa.acct.photos.why'))) > -1 &&
      /condition photograph|linepe tsa boemo/i.test(T('mafisa.acct.photos.why')));
    t('it is said plainly that this cannot be undone',
      after.indexOf(esc(T('mafisa.acct.final'))) > -1);
    t('the removal requires the person to type their own name',
      after.indexOf('acctDeleteForm') > -1 && after.indexOf('name="confirm"') > -1 &&
      after.indexOf(esc(T('mafisa.acct.type', {name: who.display_name}))) > -1);
    t('the file order is explained before the button, not discovered when it fails',
      after.indexOf(esc(T('mafisa.acct.filesfirst'))) < after.indexOf('acctDeleteForm'));
  })();
  t('nothing in this app offers to pay anybody',
    document.querySelectorAll('button,a').length === 0 ||
    ![].some.call(document.querySelectorAll('button,a'), function(el){
      return /^pay$/i.test((el.textContent || '').trim()); }));

  var passed = out.filter(function(x){ return x.indexOf('PASS') === 0; }).length;
  var failed = out.filter(function(x){ return x.indexOf('FAIL') === 0; }).length;
  out.push('');
  out.push(passed + ' passed, ' + failed + ' failed, ' + skipped + ' skipped' +
           (SEEDED ? '' : ' (connected to a real database, so the preview fixtures are absent)'));
  console.log(out.join('\n'));
  return {ok: ok, passed: passed, failed: failed, skipped: skipped, seeded: SEEDED, results: out};
};

/* =========================================================================
   BOOT
   The connection resolves asynchronously. A banner painted once on load is
   wrong for however long the server takes to answer — or to fail to — so the
   page subscribes instead of guessing, and repaints when the answer lands.
   ========================================================================= */
var booted = false;
MEND.onStatus(function(){
  renderMode();
  if (booted) render();     // connect() replaces the whole cache; redraw from it
});
MEND.onWriteError(function(e){
  writeFailures.push(e);
  alarmsHidden = false;
  if (booted) render();     // raises the banner AND marks the row wherever it shows
});
if (HAS_OUTBOX) MEND.onOutbox(function(){ if (booted) renderAlerts(); });

render();
booted = true;

/* The shared strip owns the language toggle; this page follows it. onLang
   fires once on subscribe, and that first call is the render just above. */
MEND.onLang(function(){ if (booted) { renderMode(); render(); } });

/* For verification from the console. */
window.MAFISA = { render: render, printLoan: printLoan, printAsset: printAsset,
                  settleReason: settleReason, engagementFor: engagementFor };
})();
</script>
</body>
